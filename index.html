// Dark-neon dashboard for Instagram, mirroring the X dashboard's visual
// language (hero card, donut, mini stats, bar chart) with real numbers from
// buffer_daily_stats/buffer_top_posts, plus an audience-demographics section
// backed by Publer's account-level chart_data endpoint (separate from
// post_insights — see publer-demographics).
function IGOverviewDashboard({ models, bufferDailyStats, bufferTopPosts, onPlanPosts, onMakeContentPlan }) {
  const C = {
    page: "radial-gradient(ellipse 130% 100% at 10% 0%, rgba(57,230,115,0.14), transparent 55%), radial-gradient(ellipse 100% 80% at 100% 0%, rgba(56,189,248,0.10), transparent 55%), #0b0f0d",
    card: "rgba(255,255,255,0.035)", cardBorder: "1px solid rgba(255,255,255,0.08)",
    ink: "#ffffff", sub: "#9d9b95",
    pinkA: "#39e673", pinkB: "#17c58a", pinkSoft: "rgba(57,230,115,0.14)", pinkIcon: "#39e673",
    igBrandA: "#ff2e78", igBrandB: "#ff7a3d", // Instagram's own brand gradient — kept only on the small platform-icon badge
    ringTrack: "rgba(255,255,255,0.08)",
  };
  const DONUT_COLORS = ["#39e673", "#38bdf8", "#ffb020"];

  const [igAccount, setIgAccount] = React.useState("all");
  const [igRange, setIgRange] = React.useState(7);

  const allRows = (bufferDailyStats || []).filter((r) => r.platform === "ig");
  const connectedNames = new Set(allRows.map((r) => r.model));
  const connectedModels = models.filter((m) => connectedNames.has(m.name));
  const rows = igAccount === "all" ? allRows : allRows.filter((r) => r.model === igAccount);

  // Audience demographics (age range, top countries) — a separate Publer
  // endpoint from post_insights, needs a Business-tier Publer plan and only
  // accumulates going forward (not retroactive), so this can legitimately
  // stay empty for a while on a freshly-upgraded workspace. "All accounts"
  // has no single audience to show, so demographics fall back to whichever
  // connected account is first in that case.
  const demoModelName = igAccount !== "all" ? igAccount : connectedModels[0]?.name;
  const [demographics, setDemographics] = React.useState(null);
  const [demoLoading, setDemoLoading] = React.useState(false);
  React.useEffect(() => {
    if (!demoModelName) { setDemographics(null); return; }
    let cancelled = false;
    setDemoLoading(true);
    (async () => {
      try {
        const { data, error } = await supabaseClient.functions.invoke("publer-demographics", { body: { modelName: demoModelName, platform: "ig", days: igRange } });
        if (cancelled) return;
        const manual = MANUAL_IG_DEMOGRAPHICS[demoModelName];
        const live = error ? null : data;
        // Publer's own data wins whenever it actually has any — this manual
        // set is only a stand-in until chart_data starts returning something.
        if (manual && (!live || !live.ages?.length)) {
          setDemographics({ ...live, ages: manual.ages, countries: manual.countries, unit: manual.unit });
        } else {
          setDemographics(live);
        }
      } catch (e) {
        if (!cancelled) setDemographics(null);
      } finally {
        if (!cancelled) setDemoLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [demoModelName, igRange]);

  // Live post list (not just the 5-post rolling-7-day snapshot buffer_top_posts
  // keeps) so "Top Posts" actually grows to show more when 30D is selected —
  // reuses publer-posts, the same endpoint XCaptionStudio's post history uses.
  const [livePosts, setLivePosts] = React.useState(null);
  const [livePostsLoading, setLivePostsLoading] = React.useState(false);
  React.useEffect(() => {
    if (!demoModelName) { setLivePosts(null); return; }
    let cancelled = false;
    setLivePostsLoading(true);
    (async () => {
      try {
        const { data, error } = await supabaseClient.functions.invoke("publer-posts", { body: { modelName: demoModelName, platform: "ig", days: igRange } });
        if (cancelled) return;
        setLivePosts(!error && data?.posts ? data.posts : null);
      } catch (e) {
        if (!cancelled) setLivePosts(null);
      } finally {
        if (!cancelled) setLivePostsLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [demoModelName, igRange]);

  const dateNDaysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const rangeAgoStr = dateNDaysAgo(igRange - 1);
  const weekRows = rows.filter((r) => r.statDate >= rangeAgoStr);
  const weekTotals = {
    reach: weekRows.reduce((s, r) => s + (r.impressions || 0), 0),
    posts: weekRows.reduce((s, r) => s + (r.postCount || 0), 0),
    likes: weekRows.reduce((s, r) => s + (r.reactions || 0), 0),
    replies: weekRows.reduce((s, r) => s + (r.comments || 0), 0),
  };
  const fmtK = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1)}K` : `${n}`);

  const rangeDays = Array.from({ length: igRange }, (_, i) => dateNDaysAgo(igRange - 1 - i));
  const dayBars = rangeDays.map((date) => ({
    date,
    label: igRange <= 7 ? new Date(date + "T12:00:00").toLocaleDateString(undefined, { weekday: "narrow" }) : new Date(date + "T12:00:00").getDate(),
    reach: rows.filter((r) => r.statDate === date).reduce((s, r) => s + (r.impressions || 0), 0),
  }));
  const maxDayReach = Math.max(1, ...dayBars.map((d) => d.reach));
  const bestDayIdx = dayBars.reduce((best, d, i) => (d.reach > dayBars[best].reach ? i : best), 0);

  const accountShares = connectedModels.map((m) => {
    const r = weekRows.filter((row) => row.model === m.name).reduce((s, row) => s + (row.impressions || 0), 0);
    return { name: m.name, reach: r, pct: weekTotals.reach > 0 ? Math.round((r / weekTotals.reach) * 100) : 0 };
  }).sort((a, b) => b.reach - a.reach).slice(0, 3);

  const donutSegments = [
    { label: "Likes", value: weekTotals.likes, color: DONUT_COLORS[0] },
    { label: "Replies", value: weekTotals.replies, color: DONUT_COLORS[1] },
    { label: "Reposts", value: weekRows.reduce((s, r) => s + (r.reposts || 0), 0), color: DONUT_COLORS[2] },
  ];
  const donutTotal = donutSegments.reduce((s, seg) => s + seg.value, 0);
  const donutR = 40, donutCirc = 2 * Math.PI * donutR;
  let donutOffset = 0;

  // Real post list (grows with the 7D/30D toggle) when the live fetch has

    : (bufferTopPosts || [])

  const noAccounts = connectedModels.length === 0;

  // Cursor-tilt, scoped to just the header row — see the note in
  // PlatformOverviewDashboard for why this isn't on the whole panel anymore.
  const tiltRef = React.useRef(null);
  const tiltRectRef = React.useRef(null);
  const tiltRafRef = React.useRef(null);
  const handleTiltEnter = () => {
    if (tiltRef.current) tiltRectRef.current = tiltRef.current.getBoundingClientRect();
  };
  const handleTiltMove = (e) => {
    const el = tiltRef.current;
    const rect = tiltRectRef.current;
    if (!el || !rect) return;
    if (tiltRafRef.current) return;
    const clientX = e.clientX, clientY = e.clientY;
    tiltRafRef.current = requestAnimationFrame(() => {
      tiltRafRef.current = null;
      const px = (clientX - rect.left) / rect.width - 0.5;
      const py = (clientY - rect.top) / rect.height - 0.5;
      el.style.transition = "transform 0.1s ease-out";
      el.style.transform = `perspective(1400px) rotateX(${py * -3}deg) rotateY(${px * 3}deg)`;
    });
  };
  const handleTiltLeave = () => {
    if (tiltRafRef.current) { cancelAnimationFrame(tiltRafRef.current); tiltRafRef.current = null; }
    const el = tiltRef.current;
    if (!el) return;
    el.style.transition = "transform 0.5s ease-out";
    el.style.transform = "perspective(1400px) rotateX(0deg) rotateY(0deg)";
  };

  return (
    <div
      className="mb-5 rounded-3xl overflow-hidden"
      style={{
        background: C.page, color: C.ink, fontFamily: "system-ui, -apple-system, sans-serif",

        {!noAccounts && (

              {/* Engagement mix ring, "pending messages"-style card */}

                      {donutTotal > 0 && donutSegments.map((seg, i) => {

                        return el;

                        <span className="fs-11" style={{ color: C.sub }}>{seg.label}</span>
                        <span className="fs-11 font-bold ml-auto pl-3">{donutTotal > 0 ? Math.round((seg.value / donutTotal) * 100) : 0}%</span>

                <div className="pt-3 mt-3" style={{ borderTop: `1px solid ${C.ringTrack}` }}>
                  <div className="flex items-baseline gap-1.5 mb-1.5">
                    <span className="fs-11 font-semibold">Link clicks</span>
                    <span className="fs-9 c-faint font-mono">· {igRange}d</span>
                  </div>
                  <div className="text-xl font-extrabold c-text mb-1.5">{(demographics?.linkClicks?.total || 0).toLocaleString()}</div>
                  {demoLoading ? (
                    <div className="fs-10 c-faint font-mono italic py-2">Loading...</div>
                  ) : (
                    <AreaTrendChart
                      data={(demographics?.linkClicks?.series?.length
                        ? demographics.linkClicks.series
                        : rangeDays.map((d) => ({ date: d, value: 0 }))
                      )}
                      color={C.pinkA} height={40}
                    />
                  )}
                </div>
              </div>

              {/* Right column: two mini stat cards */}
              <div className="lg:col-span-3 flex flex-col gap-4">
                <div className="rounded-3xl p-4 flex items-center gap-3" style={{ background: C.pinkSoft, border: `1px solid ${C.pinkA}33` }}>
                  <div className="rounded-2xl flex items-center justify-center flex-shrink-0" style={{ width: 40, height: 40, background: "rgba(0,0,0,0.25)" }}>
                    <Send size={16} color={C.pinkIcon} />
                  </div>
                  <div className="min-w-0">
                    <div className="text-lg font-extrabold leading-none" style={{ textShadow: `0 0 12px ${C.pinkA}66` }}>{fmtK(weekTotals.replies)}</div>
                    <div className="fs-10 mt-1" style={{ color: C.sub }}>Replies</div>
                    <div className="rounded-full mt-1.5 overflow-hidden" style={{ width: "100%", height: 4, background: "rgba(255,255,255,0.1)" }}>
                      <div style={{ width: `${Math.min(100, (weekTotals.replies / Math.max(1, weekTotals.likes)) * 100)}%`, height: "100%", background: C.pinkIcon }} />
                    </div>

                </div>
                <div className="rounded-3xl p-4" style={{ background: C.card, border: C.cardBorder, flex: 1 }}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="fs-12 font-semibold">Post Stats</div>
                    <MoreDotsIG dark />

                      30 of them side by side has no room to be legible. */}
                  <div className="flex items-end justify-between gap-0.5" style={{ height: 90, overflow: "hidden" }}>
                    {dayBars.map((d, i) => (
                      <div key={d.date} className="flex-1 flex flex-col items-center justify-end gap-1" style={{ height: "100%", minWidth: 0 }}>
                        {i === bestDayIdx && <IGStar size={11} color={C.pinkA} />}
                        <div className="rounded-full w-full" style={{
                          height: `${Math.max(6, (d.reach / maxDayReach) * 70)}px`,
                          background: i === bestDayIdx ? `linear-gradient(180deg, ${C.pinkA}, ${C.pinkB})` : "rgba(255,255,255,0.08)",
                          boxShadow: i === bestDayIdx ? `0 0 10px ${C.pinkA}77` : "none",
                        }} />
                        {igRange <= 10 && <span className="fs-9" style={{ color: C.sub }}>{d.label}</span>}
                      </div>
                    ))}
                  </div>
                  <div className="flex items-center justify-between pt-2 mt-2" style={{ borderTop: `1px solid ${C.ringTrack}` }}>
                    <span className="fs-10" style={{ color: C.sub }}>Posts · {igRange}d</span>
                    <span className="fs-13 font-extrabold">{weekTotals.posts}</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Audience demographics — real Publer chart_data when it has
                collected any (Business-tier plan, forward-only — not
                retroactive), zero-filled placeholders in the same shape
                otherwise so the widgets are never just missing. */}
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-4 mb-4">
              <div className="lg:col-span-4 rounded-3xl p-5 flex flex-col" style={{ background: C.card, border: C.cardBorder }}>
                <div className="flex items-center justify-between mb-3">
                  <div className="fs-13 font-semibold">Age range</div>

                {demoLoading ? (
                  <div className="fs-11 c-faint font-mono italic py-8 text-center flex-1">Loading...</div>
                ) : (
                  <AgeRangeBubbles ages={demographics?.ages} colors={DONUT_COLORS.concat(["#a78bfa"])} />
                )}
              </div>
              <div className="lg:col-span-5 rounded-3xl p-5" style={{ background: C.card, border: C.cardBorder }}>
                <div className="flex items-center justify-between mb-3">
                  <div className="fs-13 font-semibold">Impressions</div>
                  <MoreDotsIG dark />
                </div>
                {demoLoading ? (
                  <div className="fs-11 c-faint font-mono italic py-8 text-center">Loading...</div>
                ) : (
                  <WorldDotMap color="#a78bfa" />
                )}
              </div>
              <div className="lg:col-span-3 rounded-3xl p-5" style={{ background: C.card, border: C.cardBorder }}>
                <div className="flex items-center justify-between mb-1">
                  {demographics?.unit === "%" ? (
                    <div className="text-lg font-extrabold c-text">Audience</div>
                  ) : (
                    <div className="text-2xl font-extrabold c-text">{(demographics?.totalImpressions || 0).toLocaleString()}</div>
                  )}
                  <MoreDotsIG dark />
                </div>
                <div className="fs-10 c-faint font-mono mb-3">{demographics?.unit === "%" ? "by country" : "Impressions worldwide"}</div>
                <TopCountriesCard countries={demographics?.countries} unit={demographics?.unit} />

            {/* Post activity table */}
            {topPosts.length > 0 && (
              <div className="rounded-3xl p-5" style={{ background: C.card, border: C.cardBorder }}>
                <div className="fs-13 font-semibold mb-3">
                  {livePosts?.length ? `Posts · last ${igRange} days (${topPosts.length})` : "Top Posts · rolling 7 days"}

                </div>
                <div className="flex flex-col gap-1 max-h-[28rem] overflow-y-auto pr-1">

                      <a key={p.externalLink || i} href={p.externalLink || undefined} target="_blank" rel="noreferrer"

                        onMouseLeave={(e) => e.currentTarget.style.background = "transparent"}>

                        )}
                        <div className="flex-1 min-w-0">
                          <div className="fs-12 font-semibold truncate flex items-center gap-1.5">
                            {p.text || "No caption"} {p.externalLink && <ExternalLink size={11} color={C.sub} />}

                        <span className="fs-10 font-semibold px-2.5 py-1 rounded-full flex-shrink-0" style={{ background: C.pinkSoft, color: C.pinkIcon }}>{p.model}</span>
                        <div className="fs-11 font-mono flex-shrink-0" style={{ color: C.sub, width: 60, textAlign: "right" }}>{(p.impressions || 0).toLocaleString()}</div>
                      </a>
                    );
                  })}
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}
function MoreDotsIG({ dark }) {
  const c = dark ? "#c9c8c1" : "rgba(255,255,255,0.8)";
  return (
    <div className="flex items-center gap-0.5">
      {[0, 1, 2].map((i) => <span key={i} className="rounded-full" style={{ width: 3.5, height: 3.5, background: c }} />)}
    </div>
  );
}

function ContentDirector({ cards, persistCards, models, restrictModel, forcedNetwork, reels, persistReels, xCompetitors, persistXCompetitors, bufferDailyStats, bufferTopPosts }) {
  const [detail, setDetail] = useState(null);
  const [adding, setAdding] = useState(false);
  const [newTitle, setNewTitle] = useState("");
  const [newModel, setNewModel] = useState(restrictModel || "");
  const [newPlatform, setNewPlatform] = useState("ig");
  const [filter, setFilter] = useState(restrictModel || "all");
  const [network, setNetwork] = useState(forcedNetwork || "all");
  const [xPlanningMode, setXPlanningMode] = useState(false);
  const [igPlanningMode, setIgPlanningMode] = useState(false);
  // Which screen InstagramContentHub should open on once a model is picked —
  // "menu" (the normal "Plan content" entry) or "plan" (the "Make content
  // plan" shortcut on the IG dashboard, which skips straight to the Full
  // Content Plan screen instead of making the user click through the menu).
  const [igEntryScreen, setIgEntryScreen] = useState("menu");
  const [ttPlanningMode, setTtPlanningMode] = useState(false);

  // The sidebar's Content Director arrow lets you jump straight to a
  // platform (Instagram / TikTok / X) — when that changes, follow it here.
  useEffect(() => {
    if (forcedNetwork) setNetwork(forcedNetwork);
  }, [forcedNetwork]);

  const nextSeq = () => (cards.reduce((m, c) => Math.max(m, c.seq || 0), 0) + 1);

  const addCard = async () => {
    if (!newTitle.trim()) return;
    const card = {
      id: uid(), seq: nextSeq(), title: newTitle, model: restrictModel || newModel, sceneType: "",
      platform: newPlatform, location: "", deadline: "", assignee: "", scriptLink: "", notes: "",
      stage: "idea", source: restrictModel ? "creator" : "team", createdAt: Date.now(),
    };
    await persistCards([...cards, card]);
    setNewTitle(""); setNewModel(restrictModel || ""); setNewPlatform("ig"); setAdding(false);
  };

  const advance = async (id, stageId) => {
    await persistCards(cards.map((c) => (c.id === id ? { ...c, stage: stageId } : c)));
  };
  const saveCard = async (updated) => {
    await persistCards(cards.map((c) => (c.id === updated.id ? updated : c)));
    setDetail(null);
  };
  const deleteCard = async (id) => {
    await persistCards(cards.filter((c) => c.id !== id));
    setDetail(null);
  };

  const byModel = filter === "all" ? cards : cards.filter((c) => c.model === filter);
  const visible = network === "all" ? byModel : byModel.filter((c) => (c.platform || "ig") === network);
  const countFor = (netId) => (netId === "all" ? byModel.length : byModel.filter((c) => (c.platform || "ig") === netId).length);

  // Instagram is a completely different, per-model experience (see InstagramContentHub) —
  // team/admin login only for now; creator login keeps the existing board until
  // her own version of this is designed.
  const igModelName = restrictModel || (filter !== "all" ? filter : null);
  const igModelObj = igModelName ? models.find((m) => m.name === igModelName) : null;
  const igMode = network === "ig" && !restrictModel;

  if (igMode) {
    if (igModelName) {
      return (
        <InstagramContentHub
          key={igModelName}
          modelName={igModelName}
          modelObj={igModelObj}
          cards={cards}
          persistCards={persistCards}
          reels={reels || []}
          persistReels={persistReels}
          onBackToModels={() => setFilter("all")}
          initialScreen={igEntryScreen}
        />
      );
    }
    if (!igPlanningMode) {

    return (
      <>
        <button onClick={() => setXPlanningMode(false)}
          className="flex items-center gap-1 fs-10 font-mono uppercase c-faint hover-accent-text mb-3 transition-colors">
          <ChevronLeft size={12} /> X Dashboard

          </button>
          {PLATFORMS.map((p) => {

            return (

                className={`w-full flex items-center justify-between px-3 py-2 rounded-lg fs-12 font-mono transition-colors ${network === p.id ? "c-bg-accent-a2 c-accent font-semibold" : "c-muted hover-bg-surface"}`}>
                <span className="flex items-center gap-1.5"><Icon size={12} />{p.label}</span>

      {detail && <CardDetail card={detail} models={models} restrictModel={restrictModel} onClose={() => setDetail(null)} onSave={saveCard} onDelete={deleteCard} />}

    </div>

// ---------- Instagram Content Director (dedicated per-model hub) ----------
// Deliberately NOT styled like the rest of the app's generic c-bg-surface
// cards — this is its own console-like space (glow panel, pill steppers,
// live clock) so it actually reads as a distinct mode, not another kanban.

function useLiveClock() {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(t);
  }, []);
  return now;
}

function IGStepper({ value, onChange, min = 0, max = 60, big = false }) {
  return (
    <div className={`inline-flex items-center border c-border rounded-full ${big ? "gap-5 px-4 py-2" : "gap-3 px-2.5 py-1"}`}>
      <button type="button" onClick={() => onChange(Math.max(min, value - 1))}
        className="c-muted hover-accent-text transition-colors flex items-center justify-center">
        <Minus size={big ? 15 : 12} />
      </button>
      <span className={`text-center font-mono font-bold c-text ${big ? "text-2xl w-9" : "text-sm w-5"}`}>{value}</span>
      <button type="button" onClick={() => onChange(Math.min(max, value + 1))}
        className="c-muted hover-accent-text transition-colors flex items-center justify-center">
        <Plus size={big ? 15 : 12} />
      </button>
    </div>
  );
}

function IGBadge({ icon: Icon, children, glow }) {
  return (
    <span
      className="fs-9 tracking-wide uppercase px-2.5 py-1 rounded-full font-mono font-semibold inline-flex items-center gap-1.5 border"
      style={glow
        ? { color: "#39e673", borderColor: "rgba(57,230,115,0.55)", background: "rgba(57,230,115,0.08)", boxShadow: "0 0 10px rgba(57,230,115,0.35)" }
        : { color: "#8B93A1", borderColor: "rgba(139,147,161,0.3)", background: "transparent" }}>
      <Icon size={11} /> {children}
    </span>
  );
}

const IG_MIX_TYPES = [
  { id: "generation", label: "New Generations", badge: "New Script", icon: Sparkles, glow: false,
    desc: "From scratch — maximum creativity, her patterns as reference." },
  { id: "variation", label: "Variations", badge: "Reference Variation", icon: Shuffle, glow: true,
    desc: "Varies a winner a little more — keeps the engine, moves the execution." },
  { id: "replication", label: "Replications", badge: "Winner Replication", icon: Copy, glow: true,
    desc: "Almost literal — spam what already blew up, change next to nothing." },
];

function IGModelPicker({ models, onPick, subtitle = "Opens her dedicated Instagram console.", handleKey = "igHandle", handleLabel = "IG", bufferDailyStats, platform }) {
  const clock = useLiveClock();

  // Small at-a-glance stats per card — 7-day reach and how recently she
  // posted — pulled from bufferDailyStats, which every caller already has
  // loaded for its overview dashboard. No extra fetch, and only shown for
  // accounts that actually have a handle set (an unconnected account has
  // nothing real to show here, so it stays a plain placeholder card).
  const modelStats = (name) => {
    const rows = (bufferDailyStats || []).filter((r) => r.platform === platform && r.model === name);
    if (!rows.length) return null;
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - 6);
    const cutoffStr = toISO(cutoff);
    const reach7d = rows.filter((r) => r.statDate >= cutoffStr).reduce((s, r) => s + (r.impressions || 0), 0);
    const lastActiveDate = rows.filter((r) => (r.postCount || 0) > 0).map((r) => r.statDate).sort().pop();
    let lastActive = "—";
    if (lastActiveDate) {
      const days = Math.round((Date.now() - new Date(lastActiveDate + "T00:00:00").getTime()) / 86400000);
      lastActive = days <= 0 ? "today" : days === 1 ? "1d ago" : `${days}d ago`;
    }
    return { reach7d, lastActive };
  };

  return (
    <div className="rounded-2xl p-5 md:p-7 relative overflow-hidden"
      style={{
        background: "radial-gradient(ellipse 120% 100% at 15% 0%, rgba(18,179,76,0.10), transparent 60%), #0b0f0d",
        border: "1px solid rgba(57,230,115,0.16)",
      }}>
      <div className="flex items-start justify-between gap-3 mb-7 flex-wrap">
        <div>
          <div className="text-2xl font-extrabold tracking-tight c-text">Pick a model</div>
          <p className="c-muted text-sm mt-1.5">{subtitle}</p>
        </div>
        <div className="text-right flex-shrink-0">
          <div className="flex items-center justify-end gap-1.5 fs-10 font-mono uppercase tracking-wide"
            style={{ color: "#39e673", textShadow: "0 0 6px rgba(57,230,115,0.5)" }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: "#39e673", boxShadow: "0 0 6px #39e673" }} />
            All systems online
          </div>
          <div className="fs-13 font-mono c-muted mt-1">{clock.toLocaleTimeString("en-GB")}</div>
        </div>
      </div>

      {models.length === 0 && (
        <div className="fs-12 c-faint font-mono italic py-10 text-center rounded-xl" style={{ border: "1px dashed rgba(255,255,255,0.12)" }}>
          no models yet — add one in Model Manager
        </div>
      )}

      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {models.map((m, i) => {
          const color = MASS_PLANNER_COLORS[i % MASS_PLANNER_COLORS.length];
          const stats = m[handleKey] ? modelStats(m.name) : null;
          return (
            <button key={m.name} onClick={() => onPick(m.name)}
              className="text-left rounded-2xl p-4 flex items-center gap-3 transition-all hover:-translate-y-0.5"
              style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}
              onMouseEnter={(e) => { e.currentTarget.style.borderColor = `${color}80`; e.currentTarget.style.boxShadow = `0 0 20px ${color}20`; }}
              onMouseLeave={(e) => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.08)"; e.currentTarget.style.boxShadow = "none"; }}>
              <div className="w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0 fs-14 font-bold"
                style={{ background: `${color}1f`, border: `1px solid ${color}4d`, color }}>
                {m.name.slice(0, 1).toUpperCase()}
              </div>
              <div className="min-w-0 flex-1">
                <div className="c-text font-semibold text-sm truncate">{m.name}</div>
                <div className="fs-11 c-muted font-mono truncate">{m[handleKey] ? `@${m[handleKey]}` : `no ${handleLabel} handle set`}</div>
                {stats ? (
                  <div className="fs-9 font-mono c-faint uppercase tracking-wide mt-1 flex items-center gap-2">
                    <span style={{ color }}>{stats.reach7d.toLocaleString()}</span> reach · 7d
                    <span>·</span>
                    <span>posted {stats.lastActive}</span>
                  </div>
                ) : (
                  <div className="fs-9 font-mono c-faint uppercase tracking-wide mt-1 flex items-center gap-1">
                    Open her Content Director <ChevronRight size={10} />
                  </div>
                )}
              </div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function InstagramContentHub({ modelName, modelObj, cards, persistCards, reels, persistReels, onBackToModels, initialScreen = "menu" }) {
  const [screen, setScreen] = useState(initialScreen); // menu | batch | variation | plan | reels
  const [videosThisWeek, setVideosThisWeek] = useState(18);
  const [acrossDays, setAcrossDays] = useState(6);
  const [mix, setMix] = useState({ generation: 6, variation: 6, replication: 6 });
  const [batchCount, setBatchCount] = useState(6);
  const [batchDays, setBatchDays] = useState(6);
  const [variationCount, setVariationCount] = useState(6);
  const [variationDays, setVariationDays] = useState(6);
  const [referenceReelId, setReferenceReelId] = useState(null);
  const [generating, setGenerating] = useState(false);
  const [justGenerated, setJustGenerated] = useState(null);
  const [reelAdding, setReelAdding] = useState(false);
  const [reelTitle, setReelTitle] = useState("");
  const [reelLink, setReelLink] = useState("");
  const [reelViews, setReelViews] = useState("");
  const [reelLikes, setReelLikes] = useState("");
  const clock = useLiveClock();

  const myCards = cards.filter((c) => c.model === modelName && (c.platform || "ig") === "ig");
  const myReels = reels.filter((r) => r.model === modelName);

  const mixTotal = mix.generation + mix.variation + mix.replication;
  const setMixVal = (id, v) => setMix((m) => ({ ...m, [id]: Math.max(0, v) }));
  const letAIDecideMix = () => {
    const each = Math.max(0, Math.round(videosThisWeek / 3));
    setMix({ generation: each, variation: each, replication: Math.max(0, videosThisWeek - each * 2) });
  };
  const nextSeq = () => (cards.reduce((m, c) => Math.max(m, c.seq || 0), 0) + 1);

  const generatePlan = async (only) => {
    const types = only ? IG_MIX_TYPES.filter((t) => t.id === only) : IG_MIX_TYPES;
    let seq = nextSeq();
    const newCards = [];
    let i = 0;
    types.forEach((t) => {
      const count = mix[t.id] || 0;
      for (let n = 0; n < count; n++) {
        const dayOffset = acrossDays > 0 ? i % acrossDays : 0;
        const deadline = new Date(Date.now() + dayOffset * 86400000).toISOString().slice(0, 10);
        newCards.push({
          id: uid(), seq: seq++, title: `${t.label} #${n + 1}`, model: modelName, sceneType: t.label,
          platform: "ig", location: "", deadline, assignee: "", scriptLink: "", notes: t.desc,
          stage: "idea", source: "team", createdAt: Date.now(),
        });
        i++;
      }
    });
    if (!newCards.length) return;
    setGenerating(true);
    await persistCards([...cards, ...newCards]);
    setGenerating(false);
    setJustGenerated({ count: newCards.length, days: acrossDays });
    setTimeout(() => setJustGenerated(null), 5000);
  };

  const addReel = async () => {
    if (!reelLink.trim() && !reelTitle.trim()) return;
    const entry = {
      id: uid(), model: modelName, weekOf: todayISO(), title: reelTitle.trim() || "Untitled reel", link: reelLink.trim(),
      views: Number(reelViews) || 0, likes: Number(reelLikes) || 0, shares: 0, comments: 0, createdAt: Date.now(),
    };
    await persistReels([...reels, entry]);
    setReelTitle(""); setReelLink(""); setReelViews(""); setReelLikes(""); setReelAdding(false);
  };

  const generateBatch = async () => {
    if (!batchCount) return;
    let seq = nextSeq();
    const newCards = [];
    for (let n = 0; n < batchCount; n++) {
      const dayOffset = batchDays > 0 ? n % batchDays : 0;
      const deadline = new Date(Date.now() + dayOffset * 86400000).toISOString().slice(0, 10);
      newCards.push({
        id: uid(), seq: seq++, title: `New Generations #${n + 1}`, model: modelName, sceneType: "New Generations",
        platform: "ig", location: "", deadline, assignee: "", scriptLink: "",
        notes: "From scratch — maximum creativity, her patterns as reference.",
        stage: "idea", source: "team", createdAt: Date.now(),
      });
    }
    setGenerating(true);
    await persistCards([...cards, ...newCards]);
    setGenerating(false);
    setJustGenerated({ count: newCards.length, days: batchDays });
    setTimeout(() => setJustGenerated(null), 5000);
  };

  const generateVariations = async () => {
    const ref = sortedReels.find((r) => r.id === referenceReelId);
    if (!variationCount || !ref) return;
    let seq = nextSeq();
    const newCards = [];
    for (let n = 0; n < variationCount; n++) {
      const dayOffset = variationDays > 0 ? n % variationDays : 0;
      const deadline = new Date(Date.now() + dayOffset * 86400000).toISOString().slice(0, 10);
      newCards.push({
        id: uid(), seq: seq++, title: `Variation of "${ref.title}" #${n + 1}`, model: modelName, sceneType: "Variations",
        platform: "ig", location: "", deadline, assignee: "", scriptLink: ref.link || "",
        notes: `Varies a winner a little more — keeps the engine, moves the execution. Reference: ${ref.title}`,
        stage: "idea", source: "team", createdAt: Date.now(),
      });
    }
    setGenerating(true);
    await persistCards([...cards, ...newCards]);
    setGenerating(false);
    setJustGenerated({ count: newCards.length, days: variationDays });
    setTimeout(() => setJustGenerated(null), 5000);
  };

  const sortedReels = [...myReels].sort((a, b) => (b.views || 0) - (a.views || 0));
  const viewsList = myReels.map((r) => r.views || 0).filter((v) => v > 0).sort((a, b) => a - b);
  const median = viewsList.length ? viewsList[Math.floor(viewsList.length / 2)] : 0;
  const rankOf = (views) => {
    if (!median || !views) return null;
    if (views >= median * 3) return { label: "Blow up", color: "#39e673" };
    if (views >= median * 1.5) return { label: "Rising", color: "#5B8FA8" };
    return null;
  };
  const scriptForReel = (reel) => myCards.find(
    (c) => c.scriptLink && reel.title && c.title.toLowerCase().includes(reel.title.toLowerCase().slice(0, 12))
  );

  return (
    <div className="rounded-2xl p-5 md:p-7 relative overflow-hidden"
      style={{
        background: "radial-gradient(ellipse 120% 100% at 15% 0%, rgba(18,179,76,0.10), transparent 60%), #0b0f0d",
        border: "1px solid rgba(57,230,115,0.16)",
      }}>
      {/* ---- console header shared by every IG screen ---- */}
      <div className="flex items-start justify-between gap-3 mb-6 flex-wrap">
        <div>
          {onBackToModels && (
            <button onClick={onBackToModels}
              className="flex items-center gap-1 fs-10 font-mono uppercase c-faint hover-accent-text mb-1.5 transition-colors">
              <ChevronLeft size={12} /> All models
            </button>
          )}
          {screen !== "menu" && (
            <button onClick={() => setScreen("menu")}
              className="flex items-center gap-1 fs-11 font-mono uppercase c-muted hover-accent-text mb-2.5 transition-colors">
              <ChevronLeft size={14} /> Start page
            </button>
          )}
          {screen === "menu" ? (
            <div className="flex items-baseline gap-2.5">
              <span className="text-2xl font-extrabold tracking-tight c-text">{modelName}</span>
              {modelObj?.igHandle && <span className="fs-12 c-muted font-mono">@{modelObj.igHandle}</span>}
            </div>
          ) : (
            <div className="fs-11 uppercase tracking-widest c-faint font-mono">{modelName}</div>
          )}

// ---------- TikTok Content Director (automation console — visual shell) ----------
// This mirrors a much more advanced reference product: a phase machine /
// winner-detection / retest-cycle engine. None of the scoring math runs for
// real yet — there's no TikTok post-performance data feeding it — so every
// number in here is either a real count derived from `cards`, or an editable
// local parameter. Wiring it to real per-post stats is the next phase.

const TT_TABS = [
  { id: "digest", label: "Weekly Digest", icon: Megaphone },
  { id: "discovery", label: "Winner Discovery", icon: TrendingUp },
  { id: "strategy", label: "Strategy", icon: Zap },
  { id: "rules", label: "Rules", icon: Settings },
];

const TT_PRESETS = [
  { id: "test", label: "Test Score", color: "#E2725B",
    desc: "Faster winner detection (3x), shorter retest windows (24h). Higher false-positive risk, faster signal capture.",
    values: { winnerThreshold: 3, outlierOverride: 12, retestWindowHours: 24, retestCount: 4, rollingAvgDays: 7 } },
  { id: "balanced", label: "Balanced", color: "#39e673", active: true,
    desc: "5x winner threshold, 5 retests every other day, standard freshness boost. The house default.",
    values: { winnerThreshold: 5, outlierOverride: 20, retestWindowHours: 48, retestCount: 5, rollingAvgDays: 14 } },
  { id: "safe", label: "Play It Safe", color: "#5B8FA8",
    desc: "Stricter 7x winner threshold, 7 retests. Fewer false winners, slower signal, promotion only once it's proven.",
    values: { winnerThreshold: 7, outlierOverride: 25, retestWindowHours: 48, retestCount: 7, rollingAvgDays: 21 } },
];

const TT_VERTICALS = ["Talking Head", "Dance / Movement", "Thirst Trap"];

function TikTokContentHub({ models, cards, selectedModelName, onBackToModels }) {
  const [tab, setTab] = useState("digest");
  const selectedModel = selectedModelName;
  const selectedModelObj = models.find((m) => m.name === selectedModel);
  const [presetByModel, setPresetByModel] = useState({});
  const [rules, setRules] = useState({
    winnerThreshold: 5, outlierOverride: 20, rollingAvgDays: 14,
    retestCadenceDays: 2, retestWindowHours: 48, retestCount: 5,
    goldenHits: 4, borderlineHits: 3, recycleDays: 21,
  });
  const [dismissed, setDismissed] = useState([]);
  const clock = useLiveClock();

  const setRule = (k, v) => setRules((r) => ({ ...r, [k]: Math.max(0, v) }));
  const ttCardsFor = (name) => cards.filter((c) => c.model === name && (c.platform || "ig") === "tiktok");

  // Loose, real-data proxy for the 3 pipeline phases until real view-count
  // scoring exists: idea/script = New Test, filming/edited = In Testing, posted = Golden.
  const phaseCounts = (name) => {
    const own = ttCardsFor(name);
    return {
      newTest: own.filter((c) => ["idea", "script"].includes(c.stage)).length,
      testing: own.filter((c) => ["filming", "edited"].includes(c.stage)).length,
      golden: own.filter((c) => c.stage === "posted").length,
    };
  };

  const weekMs = 7 * 86400000;
  const weeklyChange = (name) => {
    const own = ttCardsFor(name);
    const thisWeek = own.filter((c) => Date.now() - (c.createdAt || 0) < weekMs).length;
    const lastWeek = own.filter((c) => {
      const age = Date.now() - (c.createdAt || 0);
      return age >= weekMs && age < weekMs * 2;
    }).length;
    if (!lastWeek) return thisWeek ? 100 : 0;
    return Math.round(((thisWeek - lastWeek) / lastWeek) * 100);
  };

  const signals = (() => {
    const counts = phaseCounts(selectedModel);
    const change = weeklyChange(selectedModel);
    const items = [];
    if (counts.newTest > 0) {
      items.push({
        id: `${selectedModel}-newtest`, model: selectedModel,
        text: `${counts.newTest} new idea${counts.newTest === 1 ? "" : "s"} queued for ${selectedModel} — none tested yet this cycle.`,
      });
    }
    if (change !== 0) {
      items.push({
        id: `${selectedModel}-pace`, model: selectedModel,
        text: `${selectedModel}'s pipeline is ${change > 0 ? "up" : "down"} ${Math.abs(change)}% vs last week.`,
      });
    }
    return items;
  })().filter((s) => !dismissed.includes(s.id));

  return (
    <div className="rounded-2xl p-5 md:p-7 relative overflow-hidden"
      style={{
        background: "radial-gradient(ellipse 120% 100% at 15% 0%, rgba(18,179,76,0.10), transparent 60%), #0b0f0d",
        border: "1px solid rgba(57,230,115,0.16)",
      }}>
      {/* ---- header ---- */}
      <div className="flex items-start justify-between gap-3 mb-5 flex-wrap">
        <div>
          {onBackToModels && (
            <button onClick={onBackToModels}
              className="flex items-center gap-1 fs-10 font-mono uppercase c-faint hover-accent-text mb-1.5 transition-colors">
              <ChevronLeft size={12} /> All models
            </button>
          )}
          <div className="flex items-baseline gap-2.5">
            <span className="text-2xl font-extrabold tracking-tight c-text">{selectedModel}</span>
            {selectedModelObj?.tiktokHandle && <span className="fs-12 c-muted font-mono">@{selectedModelObj.tiktokHandle}</span>}
          </div>
          <p className="c-muted text-sm mt-1.5">Phase machine, winner detection, retest cycle — shell for now, scoring wires up next.</p>
        </div>
        <div className="text-right flex-shrink-0">
          <div className="flex items-center justify-end gap-1.5 fs-10 font-mono uppercase tracking-wide"
            style={{ color: "#39e673", textShadow: "0 0 6px rgba(57,230,115,0.5)" }}>
            <span className="w-1.5 h-1.5 rounded-full" style={{ background: "#39e673", boxShadow: "0 0 6px #39e673" }} />
            All systems online
          </div>
          <div className="fs-13 font-mono c-muted mt-1">{clock.toLocaleTimeString("en-GB")}</div>
        </div>
      </div>

      {/* ---- tab bar ---- */}
      <div className="flex items-center gap-1.5 mb-6 flex-wrap">
        {TT_TABS.map((t) => {
          const Icon = t.icon;
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              className="flex items-center gap-1.5 fs-11 font-mono uppercase tracking-wide px-3.5 py-1.5 rounded-full border transition-colors"
              style={active
                ? { borderColor: "rgba(57,230,115,0.5)", color: "#39e673", background: "rgba(57,230,115,0.08)" }
                : { borderColor: "rgba(255,255,255,0.1)", color: "#8B93A1" }}>
              <Icon size={12} /> {t.label}
            </button>
          );
        })}
      </div>

      {/* ==================================================================== */}
      {/* WEEKLY DIGEST */}
      {/* ==================================================================== */}
      {tab === "digest" && (
        <div className="grid grid-cols-1 lg:grid-cols-3 gap-5">
          <div className="lg:col-span-2">
            <div className="flex flex-wrap gap-2 mb-4">
              {(() => {
                const change = weeklyChange(selectedModel);
                return (

              <div className="text-xl font-mono font-bold c-text">{ttCardsFor(selectedModel).length} <span className="fs-11 c-muted">cards in pipeline</span></div>
              <div className="flex flex-wrap gap-1.5 mt-2.5">
                {TT_VERTICALS.map((v) => (
                  <span key={v} className="fs-9 font-mono c-muted px-2 py-0.5 rounded-full" style={{ background: "rgba(255,255,255,0.04)" }}>{v}</span>

            </div>
            <div className="rounded-xl p-4" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>

              <div className="fs-12 c-muted italic">none yet — needs real post-performance data</div>
            </div>
            <div className="rounded-xl p-4" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
              <div className="fs-10 uppercase tracking-wide c-faint font-mono mb-1">Rising This Week</div>

          </div>

      {/* ==================================================================== */}
      {/* WINNER DISCOVERY */}
      {/* ==================================================================== */}
      {tab === "discovery" && (
        <div>
          {!selectedModel ? (
            <div className="fs-12 c-faint font-mono italic py-10 text-center rounded-xl" style={{ border: "1px dashed rgba(255,255,255,0.12)" }}>

            </div>
          ) : (() => {
            const own = ttCardsFor(selectedModel);
            const hashOf = (s) => {
              let h = 0;
              for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
              return (h % 1000) / 1000;
            };
            const DOT_COLORS = { "New Generations": "#8B7FD9", "Variations": "#D9B45B", "Replications": "#8B93A1" };
            const colorFor = (c, i) => DOT_COLORS[c.sceneType] || ["#8B7FD9", "#D9B45B", "#8B93A1"][i % 3];

            const cols = [
              { key: "newTest", label: "New Test", sub: "fresh + worth retesting", stages: ["idea", "script"], yAxis: "signal score", xLabel: "newer  ·  older", spread: "volatile", spreadBias: 0.9 },
              { key: "testing", label: "Winner In Testing", sub: "hit cycle 1 → 3", stages: ["filming", "edited"], yAxis: "signal score", xLabel: "retest progress", spread: "medium", spreadBias: 0.5 },
              { key: "golden", label: "Golden Winner", sub: "winners", stages: ["posted"], yAxis: "use count", xLabel: "older  ·  newer", spread: "consistent", spreadBias: 0.15 },
            ].map((col) => {
              const items = own.filter((c) => col.stages.includes(c.stage)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
              const n = items.length;
              const dots = items.map((c, i) => {
                const h = hashOf(c.id);
                const x = n > 1 ? i / (n - 1) : 0.5;
                const y = Math.min(0.95, Math.max(0.05, (1 - col.spreadBias) * 0.6 + h * col.spreadBias + (col.key === "golden" ? 0.25 : 0)));
                return { id: c.id, x, y, color: colorFor(c, i), size: 5 + Math.round(h * 5) };
              });
              const best = dots.reduce((m, d) => (!m || d.y > m.y ? d : m), null);
              return { ...col, dots, n, best };
            });

            const chartW = 300, chartH = 170;

            return (
              <div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-2">
                  {cols.map((col) => (
                    <div key={col.key} className="rounded-2xl p-4" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>

                          <line x1="0" y1={chartH - 14} x2={chartW} y2={chartH - 14} stroke="rgba(255,255,255,0.12)" strokeWidth="1" />
                          {col.dots.map((d) => (
                            <circle key={d.id} cx={8 + d.x * (chartW - 16)} cy={8 + (1 - d.y) * (chartH - 30)} r={d.size}
                              fill={d.color} opacity={d === col.best ? 0.95 : 0.55}
                              stroke={d === col.best ? "#fff" : "none"} strokeWidth={d === col.best ? 1.5 : 0} />
                          ))}
                          {col.n === 0 && (
                            <text x={chartW / 2} y={chartH / 2} textAnchor="middle" fontSize="10" fontFamily="'JetBrains Mono', monospace" fill="#4a5260">empty</text>

                        <div className="flex items-center justify-between fs-8 font-mono c-faint mt-1">
                          <span>{col.xLabel.split("  ·  ")[0]}</span>
                          <span className="c-faint">spread: {col.spread}</span>
                          {col.xLabel.split("  ·  ")[1] && <span>{col.xLabel.split("  ·  ")[1]}</span>}
                        </div>
                      </div>
                    </div>
                  ))}

                {/* full-width illustrative mean-performance line */}

                  <button onClick={() => setPresetByModel((pm) => ({ ...pm, [selectedModel]: p.id }))}

      {/* ==================================================================== */}
      {/* RULES */}
      {/* ==================================================================== */}
      {tab === "rules" && (
        <div className="space-y-6">
          <div>
            <div className="fs-13 font-semibold c-text mb-1">Phase machine</div>
            <p className="fs-11 c-muted mb-3">Every model moves through 3 phases. What fills the 5 daily slots depends on which phase she's in.</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <div className="fs-14 font-mono font-bold c-text">Day 1</div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Cold start</div>
                <div className="fs-11 c-muted">No slots yet. All 5 slots = random from references, balanced across verticals.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <div className="fs-14 font-mono font-bold c-text">&lt;{rules.goldenHits} goldens</div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Early hunting</div>
                <div className="fs-11 c-muted">Days 2+. Yesterday's top 2 fill winner slots until enough goldens exist.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <div className="fs-14 font-mono font-bold c-text">{rules.goldenHits}+ goldens</div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Mature</div>
                <div className="fs-11 c-muted">Stable. Winner slots = goldens rotating through the queue.</div>
              </div>
            </div>
          </div>

          <div>
            <div className="fs-13 font-semibold c-text mb-1">Winner detection</div>
            <p className="fs-11 c-muted mb-3">Every post on every handle gets measured against the model's aggregated average.</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(57,230,115,0.3)" }}>
                <div className="flex items-center justify-between mb-1">
                  <IGStepper value={rules.winnerThreshold} onChange={(v) => setRule("winnerThreshold", v)} min={2} max={20} />
                  <span className="fs-14 font-mono font-bold c-text">x</span>
                </div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Winner threshold</div>
                <div className="fs-11 c-muted">Views ≥ threshold × aggregated avg within {rules.retestWindowHours}h = declared Winner.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(226,114,91,0.3)" }}>
                <div className="flex items-center justify-between mb-1">
                  <IGStepper value={rules.outlierOverride} onChange={(v) => setRule("outlierOverride", v)} min={5} max={50} />
                  <span className="fs-14 font-mono font-bold c-text">x</span>
                </div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Outlier override</div>
                <div className="fs-11 c-muted">At any time post-publish — immediate winner even in week 1.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <div className="flex items-center justify-between mb-1">
                  <IGStepper value={rules.rollingAvgDays} onChange={(v) => setRule("rollingAvgDays", v)} min={3} max={30} />
                  <span className="fs-14 font-mono font-bold c-text">d</span>
                </div>
                <div className="fs-9 font-mono uppercase c-faint mb-2">Rolling average window</div>
                <div className="fs-11 c-muted">Per-account avg + aggregated across the handle.</div>
              </div>
            </div>
          </div>

          <div>
            <div className="fs-13 font-semibold c-text mb-1">Retest cycle</div>
            <p className="fs-11 c-muted mb-3">Once a winner is detected, it runs {rules.retestCount} retests every {rules.retestCadenceDays} day{rules.retestCadenceDays === 1 ? "" : "s"}. Each window is {rules.retestWindowHours}h.</p>
            <div className="flex items-center gap-3 mb-3 flex-wrap">
              <div>
                <div className="fs-9 font-mono uppercase c-faint mb-1.5">Retests</div>
                <IGStepper value={rules.retestCount} onChange={(v) => setRule("retestCount", v)} min={1} max={10} />
              </div>
              <div>
                <div className="fs-9 font-mono uppercase c-faint mb-1.5">Cadence (days)</div>
                <IGStepper value={rules.retestCadenceDays} onChange={(v) => setRule("retestCadenceDays", v)} min={1} max={7} />
              </div>
              <div>
                <div className="fs-9 font-mono uppercase c-faint mb-1.5">Window (hours)</div>
                <IGStepper value={rules.retestWindowHours} onChange={(v) => setRule("retestWindowHours", v)} min={12} max={96} />
              </div>
            </div>
            <div className="flex items-center gap-2 overflow-x-auto pb-1">
              <div className="fs-9 font-mono uppercase px-2.5 py-1.5 rounded-full flex-shrink-0" style={{ background: "rgba(57,230,115,0.1)", color: "#39e673", border: "1px solid rgba(57,230,115,0.3)" }}>Detected</div>
              {Array.from({ length: rules.retestCount }).map((_, i) => (
                <React.Fragment key={i}>
                  <ChevronRight size={12} className="c-faint flex-shrink-0" />
                  <div className="fs-9 font-mono uppercase px-2.5 py-1.5 rounded-full c-muted flex-shrink-0" style={{ border: "1px solid rgba(255,255,255,0.1)" }}>
                    Retest {i + 1}
                  </div>
                </React.Fragment>
              ))}
            </div>
          </div>

          <div>
            <div className="fs-13 font-semibold c-text mb-1">After {rules.retestCount} retests</div>
            <p className="fs-11 c-muted mb-3">Outcome is determined by how many retests hit ≥ winner threshold.</p>
            <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(57,230,115,0.3)" }}>
                <IGStepper value={rules.goldenHits} onChange={(v) => setRule("goldenHits", v)} min={1} max={rules.retestCount} />
                <div className="fs-9 font-mono uppercase c-faint mt-2 mb-1" style={{ color: "#39e673" }}>Golden winner</div>
                <div className="fs-11 c-muted">Promoted to golden pool, rotated daily, proven content.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <IGStepper value={rules.borderlineHits} onChange={(v) => setRule("borderlineHits", v)} min={0} max={rules.retestCount} />
                <div className="fs-9 font-mono uppercase c-faint mt-2 mb-1">Wait + retry</div>
                <div className="fs-11 c-muted">Borderline — cycle restarts after a 7 day cooldown.</div>
              </div>
              <div className="rounded-xl p-3.5" style={{ background: "rgba(255,255,255,0.02)", border: "1px solid rgba(226,114,91,0.3)" }}>
                <IGStepper value={rules.recycleDays} onChange={(v) => setRule("recycleDays", v)} min={7} max={60} />
                <div className="fs-9 font-mono uppercase c-faint mt-2 mb-1" style={{ color: "#E2725B" }}>Recycle (days)</div>
                <div className="fs-11 c-muted">Cooldown, then re-enters ride-test from scratch.</div>
              </div>
            </div>
          </div>

          <div>
            <div className="fs-13 font-semibold c-text mb-1">The 3 verticals</div>
            <p className="fs-11 c-muted mb-3">Every reference video gets classified into exactly one. Drives ideation, weighting, and reasoning.</p>
            <div className="flex flex-wrap gap-2">
              {TT_VERTICALS.map((v) => (
                <span key={v} className="fs-11 font-mono px-3 py-1.5 rounded-full c-text" style={{ background: "rgba(255,255,255,0.03)", border: "1px solid rgba(255,255,255,0.1)" }}>{v}</span>
              ))}
            </div>
          </div>

          <div className="fs-10 font-mono c-faint italic pt-2" style={{ borderTop: "1px solid rgba(255,255,255,0.08)" }}>
            These parameters are editable now but not yet persisted or scored against real posts — that's the next phase.
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- model manager ----------

function ModelManager({ models, persistModels, cards, reels, agency, bufferDailyStats }) {
  const [adding, setAdding] = useState(false);
  const [name, setName] = useState("");
  const [note, setNote] = useState("");
  const [pin, setPin] = useState("");
  const [detailName, setDetailName] = useState(null);
  const [editName, setEditName] = useState(null);
  const [mmTab, setMmTab] = useState("models"); // models | accounts
  const [platformFocus, setPlatformFocus] = useState("tt"); // tt | ig | x — which handle shows under each name
  const [syncingNow, setSyncingNow] = useState(false);
  const [syncResult, setSyncResult] = useState("");
  const clock = useLiveClock();

  const runSyncNow = async () => {
    setSyncingNow(true);
    setSyncResult("");
    try {
      const { data, error } = await supabaseClient.functions.invoke("publer-sync", { body: {} });
      if (error) {
        const body = await error.context?.json?.().catch(() => null);
        throw new Error(body?.error || error.message);
      }
      if (data?.error) throw new Error(data.error);
      setSyncResult(`✓ synced ${data?.accountsFound ?? "?"} account${data?.accountsFound === 1 ? "" : "s"} just now`);
    } catch (e) {
      setSyncResult(`Sync failed: ${e.message || "unknown error"}`);
    } finally {
      setSyncingNow(false);
    }
  };

  const addModel = async () => {
    if (!name.trim()) return;
    await persistModels([...models, {
      name: name.trim(), note, pin: pin.trim(), onboarded: false, addedAt: Date.now(), agency: agency || "CZ",
      igHandle: "", xHandle: "", tiktokHandle: "", ofUrl: "", driveUrl: "", bio: "",
    }]);
    setName(""); setNote(""); setPin(""); setAdding(false);
  };
  const removeModel = async (n) => {
    await persistModels(models.filter((m) => m.name !== n));
  };
  const setModelPin = async (n, newPin) => {
    await persistModels(models.map((m) => (m.name === n ? { ...m, pin: newPin } : m)));
  };
  const toggleAlwaysOnboard = async (n) => {
    await persistModels(models.map((m) => (m.name === n ? { ...m, alwaysOnboard: !m.alwaysOnboard } : m)));
  };
  const saveDetail = async (updated) => {
    await persistModels(models.map((m) => (m.name === updated.name ? updated : m)));
    setDetailName(null);
  };

  const detailModel = models.find((m) => m.name === detailName);
  const editModel = models.find((m) => m.name === editName);

  // ---- real derived stats — Views 7d / Last active / Link scale come from
  // bufferDailyStats (Publer-synced, hourly), filtered to whichever platform
  // the TT/IG toggle has selected. Cards-derived cadence stays as before. ----
  const MM_COLORS = ["#39e673", "#5B8FA8", "#8B7FD9", "#E2725B", "#D9B45B", "#5BD9C0", "#D95B9E", "#7FD95B"];
  const colorFor = (n) => {
    let hash = 0;
    for (let i = 0; i < n.length; i++) hash = (hash * 31 + n.charCodeAt(i)) >>> 0;
    return MM_COLORS[hash % MM_COLORS.length];
  };
  const dayStart = new Date(); dayStart.setHours(0, 0, 0, 0);
  const platformKey = platformFocus === "tt" ? "tiktok" : platformFocus === "x" ? "x" : "ig";
  const handleKeyFor = platformFocus === "tt" ? "tiktokHandle" : platformFocus === "x" ? "xHandle" : "igHandle";
  const cutoff7d = new Date(); cutoff7d.setDate(cutoff7d.getDate() - 6);
  const cutoff7dStr = toISO(cutoff7d);

  const rows = models.map((m) => {
    const own = cards.filter((c) => c.model === m.name);
    const active = own.filter((c) => c.stage !== "posted").length;
    const posted = own.filter((c) => c.stage === "posted").length;
    const myStats = (bufferDailyStats || []).filter((r) => r.model === m.name && r.platform === platformKey);
    const views7d = myStats.filter((r) => r.statDate >= cutoff7dStr).reduce((s, r) => s + (r.impressions || 0), 0);
    const lastActiveDate = myStats.filter((r) => (r.postCount || 0) > 0).map((r) => r.statDate).sort().pop();
    const lastActiveTs = lastActiveDate ? new Date(lastActiveDate + "T12:00:00").getTime() : 0;
    return { model: m, own, active, posted, views7d, lastActiveTs, color: colorFor(m.name) };
  }).sort((a, b) => b.views7d - a.views7d);

  const maxViews = Math.max(1, ...rows.map((r) => r.views7d));
  const weeklyAvgPct = rows.length ? Math.round(rows.reduce((s, r) => s + Math.round((r.views7d / maxViews) * 100), 0) / rows.length) : 0;
  const cardsToday = cards.filter((c) => (c.createdAt || 0) >= dayStart.getTime()).length;
  const onTheRiseCount = rows.filter((r) => r.views7d > 0 && r.views7d >= maxViews * 0.5).length;
  const connectedCount = models.filter((m) => (bufferDailyStats || []).some((r) => r.model === m.name)).length;

  // bufferDailyStats' syncedAt is a raw ISO string (not a ms timestamp like
  // most *Ts fields elsewhere), so it needs an explicit Date parse — Math.max
  // coerces its arguments to Number() directly, and Number("2026-...") is
  // NaN, which silently made this always show "never yet" otherwise.
  const lastSyncedTs = Math.max(0, ...(bufferDailyStats || []).map((r) => (r.syncedAt ? new Date(r.syncedAt).getTime() : 0))) || null;

  return (

                const imp7d = platRows.filter((r) => r.statDate >= cutoff7dStr).reduce((s, r) => s + (r.impressions || 0), 0);

}

function ModelProfileDashboard({ model, cards, reels, maxViewsAcrossModels, onClose, onEdit }) {
  const [tab, setTab] = useState("overview"); // overview | journey
  const clock = useLiveClock();

  const own = cards.filter((c) => c.model === model.name);
  const myReels = (reels || []).filter((r) => r.model === model.name);

  const weekMs = 7 * 86400000;
  const views7d = myReels.filter((r) => Date.now() - (r.createdAt || 0) < weekMs).reduce((s, r) => s + (r.views || 0), 0);
  const weeklyPct = Math.min(100, Math.round((views7d / Math.max(1, maxViewsAcrossModels)) * 100));

  const totalViews = myReels.reduce((s, r) => s + (r.views || 0), 0);
  const totalLikes = myReels.reduce((s, r) => s + (r.likes || 0), 0);
  const totalComments = myReels.reduce((s, r) => s + (r.comments || 0), 0);
  const totalShares = myReels.reduce((s, r) => s + (r.shares || 0), 0);
  const accountsLinked = [model.igHandle, model.tiktokHandle, model.xHandle, model.ofUrl].filter(Boolean).length;

  const recentPosts = [...myReels].sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 10);

  // ---- 14-day normalized multi-metric chart, built from real reel logs ----
  const days = Array.from({ length: 14 }).map((_, i) => {
    const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - (13 - i));
    return d.getTime();
  });
  const bucketFor = (metric) => days.map((dayStart) => {
    const dayEnd = dayStart + 86400000;
    return myReels.filter((r) => (r.createdAt || 0) >= dayStart && (r.createdAt || 0) < dayEnd)
      .reduce((s, r) => s + (metric === "posts" ? 1 : (r[metric] || 0)), 0);
  });
  const series = [
    { key: "posts", label: "Posts", color: "#f2f5f0", total: own.length, data: bucketFor("posts") },
    { key: "views", label: "Views", color: "#39e673", total: totalViews, data: bucketFor("views") },
    { key: "likes", label: "Likes", color: "#D95B9E", total: totalLikes, data: bucketFor("likes") },
    { key: "comments", label: "Comments", color: "#5BD9C0", total: totalComments, data: bucketFor("comments") },
    { key: "shares", label: "Shares", color: "#8B7FD9", total: totalShares, data: bucketFor("shares") },
    { key: "linkClicks", label: "Link clicks", color: "#D9B45B", total: 0, data: days.map(() => 0) },
  ];
  const chartW = 600, chartH = 160;
  const pathFor = (data) => {
    const max = Math.max(...data, 1);
    return data.map((v, i) => `${(i / (data.length - 1)) * chartW},${chartH - (v / max) * chartH}`).join(" ");
  };

  const fmt = (n) => (n >= 1000 ? `${(n / 1000).toFixed(1).replace(/\.0$/, "")}k` : `${n}`);

  return (
    <div className="fixed inset-0 bg-black/70 flex items-start md:items-center justify-center z-50 p-3 md:p-6 overflow-y-auto" onClick={onClose}>
      <div className="rounded-2xl p-5 md:p-7 relative overflow-hidden w-full max-w-4xl my-4"
        style={{
          background: "radial-gradient(ellipse 120% 100% at 15% 0%, rgba(18,179,76,0.10), transparent 60%), #0b0f0d",
          border: "1px solid rgba(57,230,115,0.16)",
        }}
        onClick={(e) => e.stopPropagation()}>

        {/* ---- header ---- */}
        <div className="flex items-start justify-between gap-3 mb-5 flex-wrap">
          <div>
            <button onClick={onClose} className="flex items-center gap-1 fs-10 font-mono uppercase c-faint hover-accent-text mb-1.5 transition-colors">
              <ChevronLeft size={12} /> Model Manager
            </button>
            <div className="text-2xl font-extrabold tracking-tight c-text">{model.name}</div>
          </div>
          <div className="flex items-start gap-3">
            <div className="text-right flex-shrink-0">
              <div className="flex items-center justify-end gap-1.5 fs-10 font-mono uppercase tracking-wide"
                style={{ color: "#39e673", textShadow: "0 0 6px rgba(57,230,115,0.5)" }}>
                <span className="w-1.5 h-1.5 rounded-full" style={{ background: "#39e673", boxShadow: "0 0 6px #39e673" }} />
                All systems online
              </div>
              <div className="fs-13 font-mono c-muted mt-1">{clock.toLocaleTimeString("en-GB")}</div>
            </div>
            <button onClick={onClose} className="c-muted hover-text-primary"><X size={18} /></button>
          </div>
        </div>

        {/* ---- tabs ---- */}
        <div className="flex items-center gap-1.5 mb-6">
          {[{ id: "overview", label: "Overview" }, { id: "journey", label: "Journey" }].map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className="fs-11 font-mono uppercase tracking-wide px-3.5 py-1.5 rounded-full border transition-colors"
              style={tab === t.id
                ? { borderColor: "rgba(57,230,115,0.5)", color: "#39e673", background: "rgba(57,230,115,0.08)" }
                : { borderColor: "rgba(255,255,255,0.1)", color: "#8B93A1" }}>
              {t.label}
            </button>
          ))}
        </div>

        {tab === "overview" && (
          <div>
            {/* ---- gauge + name + stat mini-cards ---- */}
            <div className="flex items-center gap-5 flex-wrap mb-6">
              <div className="relative w-20 h-20 flex-shrink-0">
                <svg viewBox="0 0 80 80" className="w-20 h-20 -rotate-90">

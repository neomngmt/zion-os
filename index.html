// ---------- title generator (transcribes creators' own reels into scripts) ----------

function cleanIgUrl(url) {
  try {
    const u = new URL(url.trim());
    u.search = ""; // strips ?igsh=... and any other tracking params
    return u.toString();
  } catch {
    return url.trim().split("?")[0];
  }
}

const ORDINALS_CS = ["První", "Druhé", "Třetí", "Čtvrté", "Páté", "Šesté", "Sedmé", "Osmé", "Deváté", "Desáté"];

function TitleGeneratorPage() {
  const [linksText, setLinksText] = useState("");
  const [lang, setLang] = useState("cs"); // "cs" or "en"
  const [results, setResults] = useState([]); // [{url, script, status, error}]
  const [running, setRunning] = useState(false);
  const stopRequestedRef = useRef(false);
  const [copiedMsg, setCopiedMsg] = useState("");

  const runOne = async (i, urlForLookup) => {
    setResults((prev) => prev.map((r, idx) => idx === i ? { ...r, status: "pending", error: null } : r));
    try {
      const { data, error } = await supabaseClient.functions.invoke("reel-transcribe-ts", {
        body: { url: urlForLookup, lang },
      });
      if (error) {
        // supabase-js only gives a generic message by default — the real
        // reason (from our function's own error response) is in
        // error.context, which is the raw fetch Response object.
        let detail = error.message || "failed";
        try {
          if (error.context && typeof error.context.json === "function") {
            const body = await error.context.json();
            if (body?.error) detail = body.error;
          }
        } catch {}
        setResults((prev) => prev.map((r, idx) => idx === i ? { ...r, status: "error", error: detail } : r));
        return;
      }
      setResults((prev) => prev.map((r, idx) => idx === i ? { ...r, script: data?.script || "", status: "done" } : r));
    } catch (e) {
      setResults((prev) => prev.map((r, idx) => idx === i ? { ...r, status: "error", error: e.message || "failed" } : r));
    }
  };

  const runGenerate = async () => {
    const urls = linksText.split("\n").map((l) => l.trim()).filter((l) => l && /^https?:\/\//i.test(l)).map(cleanIgUrl);
    if (!urls.length) return;
    stopRequestedRef.current = false;
    setRunning(true);
    setResults(urls.map((url) => ({ url, script: "", status: "pending" })));
    for (let i = 0; i < urls.length; i++) {
      if (stopRequestedRef.current) {
        setResults((prev) => prev.map((r, idx) => idx >= i ? { ...r, status: "error", error: "zastaveno" } : r));
        break;
      }
      if (i > 0) await new Promise((res) => setTimeout(res, 8000)); // space requests out — back-to-back scraping is what was triggering Instagram's block
      await runOne(i, urls[i]);
    }
    setRunning(false);
  };

  const exportText = results
    .filter((r) => r.status === "done")
    .map((r, i) => `${ORDINALS_CS[i] || `${i + 1}.`} video: \n${r.url}\nScénář: \n${r.script}`)
    .join("\n\n");

  const copyExport = async () => {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopiedMsg("Zkopírováno!");
      setTimeout(() => setCopiedMsg(""), 2000);
    } catch {
      setCopiedMsg("Nepodařilo se zkopírovat — zkopíruj ručně níže.");
    }
  };

  return (
    <div>
      <div className="flex items-center justify-end mb-4 flex-wrap gap-2">
        <div className="flex rounded-lg border c-border overflow-hidden">
          {[["cs", "Česky"], ["en", "English"]].map(([val, label]) => (
            <button key={val} onClick={() => setLang(val)}
              className={`tap px-3 py-1.5 fs-11 font-mono uppercase transition-colors ${lang === val ? "c-bg-accent c-onaccent" : "c-muted hover-bg-surface"}`}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div className="c-bg-surface border c-border rounded-xl p-5 mb-5">
        <label className="block fs-11 uppercase tracking-widest c-muted font-mono mb-2">
          IG Reel odkazy (jeden na řádek)
        </label>
        <textarea value={linksText} onChange={(e) => setLinksText(e.target.value)}
          placeholder={"https://www.instagram.com/reel/.../?igsh=...\nhttps://www.instagram.com/reel/.../?igsh=..."}
          className="w-full min-h-[160px] c-bg-app border c-border rounded-lg px-3 py-2 text-sm c-text font-mono outline-none focus-border-accent" />
        <div className="flex gap-2 mt-3">
          <button onClick={runGenerate} disabled={running || !linksText.trim()}
            className="tap px-4 py-2 rounded-lg c-bg-accent c-onaccent fs-12 font-bold disabled:opacity-40">
            {running ? "Zpracovávám…" : "Vygenerovat scénáře"}
          </button>
          {running && (
            <button onClick={() => { stopRequestedRef.current = true; }}
              className="tap px-4 py-2 rounded-lg fs-12 font-bold" style={{ background: "#e07a5f", color: "#1a0a05" }}>
              Zastavit
            </button>
          )}
        </div>
      </div>

      {results.length > 0 && (
        <div className="c-bg-surface border c-border rounded-xl p-5 mb-5">
          <div className="fs-11 uppercase tracking-widest c-muted font-mono mb-3">Výsledky</div>
          <div className="flex flex-col gap-3">
            {results.map((r, i) => (
              <div key={i} className="c-bg-app border c-border rounded-lg p-3">
                <div className="fs-11 font-mono c-muted mb-1 truncate">{r.url}</div>
                {r.status === "pending" && <div className="fs-12 c-muted italic">zpracovávám…</div>}
                {r.status === "error" && <div className="fs-12" style={{ color: "#e07a5f" }}>chyba: {r.error}</div>}
                {r.status === "done" && <div className="fs-13 c-text whitespace-pre-wrap">{r.script}</div>}
              </div>
            ))}
          </div>
        </div>
      )}

      {results.some((r) => r.status === "done") && (
        <div className="c-bg-surface border c-border rounded-xl p-5">
          <div className="flex items-center justify-between mb-3">
            <div className="fs-11 uppercase tracking-widest c-muted font-mono">Export</div>
            <button onClick={copyExport} className="tap px-3 py-1.5 rounded-lg c-bg-accent c-onaccent fs-11 font-bold">
              {copiedMsg || "Zkopírovat"}
            </button>
          </div>
          <pre className="fs-12 c-text whitespace-pre-wrap font-mono c-bg-app border c-border rounded-lg p-3" style={{ maxHeight: 300, overflowY: "auto" }}>
            {exportText}
          </pre>
        </div>
      )}
    </div>
  );
}

function ReelSorterPage() {
  const rootRef = useRef(null);

  useEffect(() => {
    const root = rootRef.current;
    if (!root) return;

    // Load Instagram's embed script once (shared across the whole app / repeat visits)
    if (!window.instgrm && !document.querySelector('script[src="https://www.instagram.com/embed.js"]')) {
      const s = document.createElement("script");
      s.src = "https://www.instagram.com/embed.js";
      s.async = true;
      document.body.appendChild(s);
    }

    const DEFAULT_CATEGORIES = ["Text on screen", "POV skit", "Talking head", "Omegle", "Ragebait", "Half text format", "Ostatní"];
    let categories = DEFAULT_CATEGORIES.slice();
    let items = [];
    let seq = 0;
    let currentIndex = 0;

    const setupPanel = root.querySelector("#rsSetupPanel");
    const urlInput = root.querySelector("#rsUrlInput");
    const loadBtn = root.querySelector("#rsLoadBtn");
    const catListEl = root.querySelector("#rsCatList");
    const newCatInput = root.querySelector("#rsNewCatInput");
    const addCatBtn = root.querySelector("#rsAddCatBtn");

    const stageWrap = root.querySelector("#rsStageWrap");
    const stageContent = root.querySelector("#rsStageContent");
    const progressText = root.querySelector("#rsProgressText");
    const progressFill = root.querySelector("#rsProgressFill");
    const exportBtn = root.querySelector("#rsExportBtn");
    const listToggleBtn = root.querySelector("#rsListToggleBtn");
    const listView = root.querySelector("#rsListView");

    const modalOverlay = root.querySelector("#rsModalOverlay");
    const modalCloseBtn = root.querySelector("#rsModalCloseBtn");
    const resultText = root.querySelector("#rsResultText");
    const copyBtn = root.querySelector("#rsCopyBtn");
    const downloadBtn = root.querySelector("#rsDownloadBtn");

    function renderCatList() {
      catListEl.innerHTML = "";
      categories.forEach((c) => {
        const tag = document.createElement("span");
        tag.className = "cat-tag";
        tag.textContent = c;
        catListEl.appendChild(tag);
      });
    }

    function normalizeUrl(raw) {
      let u = raw.trim();
      if (!u) return null;
      if (!/^https?:\/\//i.test(u)) u = "https://" + u;
      u = u.split("?")[0].split("#")[0];
      u = u.replace(/\/+$/, "") + "/";
      return u;
    }

    function addCategory() {
      const val = newCatInput.value.trim();
      if (!val) return;
      if (!categories.includes(val)) categories.push(val);
      renderCatList();
      newCatInput.value = "";
      renderStage();
    }

    function loadUrls() {
      const lines = urlInput.value.split("\n");
      const existing = new Set(items.map((i) => i.url));
      lines.forEach((line) => {
        const url = normalizeUrl(line);
        if (!url || existing.has(url)) return;
        existing.add(url);
        items.push({ id: ++seq, url, category: null });
      });
      if (items.length === 0) return;
      setupPanel.style.display = "none";
      stageWrap.style.display = "block";
      root.classList.remove("setup-mode");
      currentIndex = 0;
      renderStage();
    }

    function processEmbeds() {
      if (window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
    }

    function checkEmbedLoaded(wrapEl, blockquoteEl, item) {
      let tries = 0;
      const interval = setInterval(() => {
        tries++;
        const hasIframe = wrapEl.querySelector("iframe");
        if (hasIframe) {
          const ph = wrapEl.querySelector(".embed-placeholder");
          if (ph) ph.remove();
          clearInterval(interval);
          return;
        }
        if (tries >= 5) {
          clearInterval(interval);
          wrapEl.innerHTML =
            '<div style="padding:26px 14px;text-align:center;color:var(--rs-text-dim);font-size:13px;">' +
            "Náhled se nepodařilo načíst (soukromé, smazané nebo omezené video).<br><br>" +
            '<a href="' + item.url + '" target="_blank" rel="noopener" style="color:var(--rs-accent);">Otevřít Reel v nové kartě ↗</a>' +
            "</div>";
        }
      }, 300);
    }

    function updateProgress() {
      const total = items.length;
      const assigned = items.filter((i) => i.category).length;
      progressText.innerHTML = `<b>${Math.min(currentIndex + 1, total)}</b> / ${total} &middot; zařazeno ${assigned}`;
      progressFill.style.width = total ? (assigned / total) * 100 + "%" : "0%";
    }

    function goTo(index) {
      if (index < 0) index = 0;
      currentIndex = index;
      renderStage();
    }

    function assignAndAdvance(item, cat) {
      item.category = cat;
      updateProgress();
      setTimeout(() => {
        if (currentIndex < items.length - 1) {
          goTo(currentIndex + 1);
        } else {
          renderStage();
        }
      }, 220);
    }

    function renderStage() {
      updateProgress();
      stageContent.innerHTML = "";

      if (items.length === 0) return;

      if (currentIndex >= items.length) {
        const done = document.createElement("div");
        done.className = "done-screen";
        const assigned = items.filter((i) => i.category).length;
        done.innerHTML = `
          <h2 class="rs-display">Hotovo</h2>
          <p>Zařazeno ${assigned} z ${items.length}. Můžeš zobrazit výsledek, nebo se vrátit a doplnit zbytek.</p>
        `;
        const btnRow = document.createElement("div");
        btnRow.style.display = "flex";
        btnRow.style.gap = "10px";
        btnRow.style.justifyContent = "center";
        const backBtn = document.createElement("button");
        backBtn.className = "btn-ghost";
        backBtn.textContent = "Zpět na poslední";
        backBtn.addEventListener("click", () => goTo(items.length - 1));
        const resultBtn = document.createElement("button");
        resultBtn.className = "btn-primary";
        resultBtn.textContent = "Zobrazit výsledek";
        resultBtn.addEventListener("click", openResults);
        btnRow.appendChild(backBtn);
        btnRow.appendChild(resultBtn);
        done.appendChild(btnRow);
        stageContent.appendChild(done);
        renderListView();
        return;
      }

      const item = items[currentIndex];
      const card = document.createElement("div");
      card.className = "stage-card";

      const embedWrap = document.createElement("div");
      embedWrap.className = "stage-embed";
      embedWrap.style.minHeight = "160px";
      embedWrap.style.width = "100%";
      const placeholder = document.createElement("div");
      placeholder.className = "embed-placeholder";
      placeholder.style.color = "var(--rs-text-dim)";
      placeholder.style.fontSize = "13px";
      placeholder.textContent = "Načítám náhled...";
      embedWrap.appendChild(placeholder);
      const blockquote = document.createElement("blockquote");
      blockquote.className = "instagram-media";
      blockquote.setAttribute("data-instgrm-permalink", item.url);
      blockquote.setAttribute("data-instgrm-version", "14");
      blockquote.style.width = "100%";
      blockquote.style.margin = "0";
      embedWrap.appendChild(blockquote);
      card.appendChild(embedWrap);
      checkEmbedLoaded(embedWrap, blockquote, item);

      const manualLink = document.createElement("a");
      manualLink.href = item.url;
      manualLink.target = "_blank";
      manualLink.rel = "noopener";
      manualLink.textContent = "Nejde přehrát? Otevřít v Instagramu ↗";
      manualLink.style.display = "block";
      manualLink.style.textAlign = "center";
      manualLink.style.fontSize = "11px";
      manualLink.style.color = "var(--rs-text-dim)";
      manualLink.style.margin = "4px 0 10px";
      card.appendChild(manualLink);

      const urlLine = document.createElement("div");
      urlLine.className = "stage-url";
      urlLine.textContent = item.url;
      card.appendChild(urlLine);

      const currentCat = document.createElement("div");
      currentCat.className = "stage-current-cat" + (item.category ? "" : " empty");
      currentCat.innerHTML = item.category ? `Zařazeno: <b>${item.category}</b>` : "Zatím nezařazeno, vyber kategorii";
      card.appendChild(currentCat);

      const catRow = document.createElement("div");
      catRow.className = "cat-buttons";
      categories.forEach((cat) => {
        const btn = document.createElement("button");
        btn.className = "cat-btn" + (item.category === cat ? " active" : "");
        btn.textContent = cat;
        btn.addEventListener("click", () => assignAndAdvance(item, cat));
        catRow.appendChild(btn);
      });
      card.appendChild(catRow);

      const nav = document.createElement("div");
      nav.className = "stage-nav";
      const navLeft = document.createElement("div");
      navLeft.className = "stage-nav-left";
      const prevBtn = document.createElement("button");
      prevBtn.className = "btn-ghost";
      prevBtn.textContent = "← Zpět";
      prevBtn.disabled = currentIndex === 0;
      prevBtn.addEventListener("click", () => goTo(currentIndex - 1));
      const skipBtn = document.createElement("button");
      skipBtn.className = "btn-ghost";
      skipBtn.textContent = "Přeskočit";
      skipBtn.addEventListener("click", () => goTo(currentIndex + 1));
      navLeft.appendChild(prevBtn);
      navLeft.appendChild(skipBtn);

      const removeBtn = document.createElement("button");
      removeBtn.className = "remove-current";
      removeBtn.textContent = "Odstranit tento odkaz";
      removeBtn.addEventListener("click", () => {
        items.splice(currentIndex, 1);
        if (currentIndex >= items.length) currentIndex = Math.max(0, items.length - 1);
        renderStage();
      });

      nav.appendChild(navLeft);
      nav.appendChild(removeBtn);
      card.appendChild(nav);

      stageContent.appendChild(card);
      renderListView();
      setTimeout(processEmbeds, 50);
    }

    function renderListView() {
      listView.innerHTML = "";
      items.forEach((item, idx) => {
        const row = document.createElement("div");
        row.className = "list-row";
        const url = document.createElement("span");
        url.className = "lurl";
        url.textContent = item.url;
        const cat = document.createElement("span");
        cat.className = "lcat" + (item.category ? "" : " empty");
        cat.textContent = item.category || "nezařazeno";
        const editBtn = document.createElement("button");
        editBtn.className = "btn-ghost";
        editBtn.textContent = "Upravit";
        editBtn.addEventListener("click", () => goTo(idx));
        row.appendChild(url);
        row.appendChild(cat);
        row.appendChild(editBtn);
        listView.appendChild(row);
      });
    }

    function buildResultText() {
      const groups = {};
      categories.forEach((c) => (groups[c] = []));
      const unassigned = [];
      items.forEach((item) => {
        if (item.category) {
          if (!groups[item.category]) groups[item.category] = [];
          groups[item.category].push(item.url);
        } else {
          unassigned.push(item.url);
        }
      });
      let out = "";
      categories.forEach((cat) => {
        const list = groups[cat] || [];
        if (list.length === 0) return;
        out += `## ${cat} (${list.length})\n`;
        list.forEach((u) => (out += u + "\n"));
        out += "\n";
      });
      if (unassigned.length) {
        out += `## Nezařazeno (${unassigned.length})\n`;
        unassigned.forEach((u) => (out += u + "\n"));
      }
      return out.trim() || "Zatím nic k exportu.";
    }

    function openResults() {
      resultText.value = buildResultText();
      modalOverlay.classList.add("open");
    }

    loadBtn.addEventListener("click", loadUrls);
    // Some mobile browsers (notably iOS Safari) flatten a multi-line clipboard
    // of URLs into a single line with literal "%0A" text instead of real line
    // breaks. Clean that up immediately after paste so it displays properly
    // line-by-line right away, not just when "Spustit" is clicked.
    urlInput.addEventListener("input", () => {
      if (/%0D%0A|%0A|%0D/i.test(urlInput.value)) {
        const cursor = urlInput.selectionStart;
        const before = urlInput.value;
        urlInput.value = urlInput.value.replace(/%0D%0A|%0A|%0D/gi, "\n");
        const diff = before.length - urlInput.value.length;
        urlInput.selectionStart = urlInput.selectionEnd = Math.max(0, cursor - diff);
      }
    });
    addCatBtn.addEventListener("click", addCategory);
    newCatInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addCategory(); });
    exportBtn.addEventListener("click", openResults);
    listToggleBtn.addEventListener("click", () => {
      listView.classList.toggle("open");
      listToggleBtn.textContent = listView.classList.contains("open") ? "Skrýt seznam" : "Zobrazit celý seznam";
    });
    modalCloseBtn.addEventListener("click", () => modalOverlay.classList.remove("open"));
    modalOverlay.addEventListener("click", (e) => { if (e.target === modalOverlay) modalOverlay.classList.remove("open"); });
    copyBtn.addEventListener("click", () => {
      resultText.select();
      document.execCommand("copy");
      copyBtn.textContent = "Zkopírováno!";
      setTimeout(() => (copyBtn.textContent = "Zkopírovat"), 1500);
    });
    downloadBtn.addEventListener("click", () => {
      const blob = new Blob([resultText.value], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "reel-sorter-vysledek.txt";
      a.click();
    });

    renderCatList();
  }, []);

  return (
    <div ref={rootRef} className="reel-sorter-root setup-mode" style={{ position: "relative", minHeight: "70vh" }}>
      <style>{REEL_SORTER_CSS}</style>
      <div dangerouslySetInnerHTML={{ __html: REEL_SORTER_BODY }} />
    </div>
  );
}

function TrendsPage({ weeklyTrendReels, onReload }) {
  const [filter, setFilter] = useState("all");
  const [topN, setTopN] = useState(15);
  const [generating, setGenerating] = useState(false);
  const [generateError, setGenerateError] = useState("");
  const [scrapeErrors, setScrapeErrors] = useState([]);
  const [rosterCopied, setRosterCopied] = useState(false);
  const [verifying, setVerifying] = useState(false);
  const [verifyBroken, setVerifyBroken] = useState(null); // null = not run yet
  const [verifyError, setVerifyError] = useState("");
  const [justStartedGenerate, setJustStartedGenerate] = useState(false);
  const fmt = (n) => (!n ? "0" : n >= 1000000 ? `${(n / 1000000).toFixed(1)}M` : n >= 1000 ? `${(n / 1000).toFixed(1)}K` : String(n));
  const all = justStartedGenerate ? [] : [...(weeklyTrendReels || [])].sort((a, b) => (b.ratio || 0) - (a.ratio || 0) || new Date(b.timestamp || 0) - new Date(a.timestamp || 0));
  const inCategory = filter === "all" ? all : all.filter((r) => (r.category || "Other") === filter);
  const sorted = filter === "all" ? inCategory : inCategory.slice(0, topN);
  const lastSync = all.reduce((latest, r) => (r.syncedAt && (!latest || r.syncedAt > latest) ? r.syncedAt : latest), null);
  const counts = TREND_CATEGORIES.reduce((acc, c) => { acc[c] = all.filter((r) => (r.category || "Other") === c).length; return acc; }, {});

  const generateNow = async () => {
    setGenerating(true);
    setGenerateError("");
    setScrapeErrors([]);
    setJustStartedGenerate(true); // hide the old (now stale) reels immediately
    const failedChunks = [];
    const allScrapeErrors = [];
    try {
      // Chunks run one at a time (not in parallel) — running all 4 at once,
      // each firing several concurrent Apify calls internally, was enough
      // simultaneous pay-per-event requests to trip Apify's 402 rate limit
      // even with credit remaining.
      for (const chunk of Array.from({ length: 17 }, (_, i) => i)) {
        try {
          const r = await fetch(`${SUPABASE_URL}/functions/v1/weekly-trends-scrape?chunk=${chunk}`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
            body: "{}",
          });
          if (!r.ok) throw new Error(`chunk ${chunk}: HTTP ${r.status}`);
          const data = await r.json();
          allScrapeErrors.push(...(data.errors || []));
        } catch (e) {
          failedChunks.push(e);
        }
      }
      if (failedChunks.length) setGenerateError(`${failedChunks.length} of 17 chunks failed outright — check Edge Function logs.`);
      setScrapeErrors(allScrapeErrors);
      if (onReload) await onReload();
      setJustStartedGenerate(false); // fresh data is in now, safe to show again
    } catch (e) {
      setGenerateError(e.message || "Failed to trigger scrape.");
      setJustStartedGenerate(false);
    }
    setGenerating(false);
  };

  const verifyProfiles = async () => {
    setVerifying(true);
    setVerifyError("");
    setVerifyBroken(null);
    const allChecks = [];
    try {
      for (const chunk of Array.from({ length: 17 }, (_, i) => i)) {
        const r = await fetch(`${SUPABASE_URL}/functions/v1/weekly-trends-scrape?chunk=${chunk}&verify=1`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
          body: "{}",
        });
        if (!r.ok) throw new Error(`chunk ${chunk}: HTTP ${r.status}`);
        const data = await r.json();
        allChecks.push(...(data.checks || []));
      }
      setVerifyBroken(allChecks.filter((c) => !c.ok));
    } catch (e) {
      setVerifyError(e.message || "Failed to verify profiles.");
    }
    setVerifying(false);
  };

  const copyRoster = async () => {
    // Strips Instagram's igsh= tracking query string, one clean link per line.
    const links = sorted.map((p) => (p.url || "").split("?")[0]).filter(Boolean);
    if (!links.length) return;
    try {
      await navigator.clipboard.writeText(links.join("\n"));
      setRosterCopied(true);
      setTimeout(() => setRosterCopied(false), 2000);
    } catch (e) {
      setGenerateError("Couldn't copy to clipboard.");
    }
  };

  return (
    <div>
      <div className="c-bg-surface border c-border rounded-xl p-4 mb-5">
        <p className="fs-11 c-muted">
          Actively scans the last 7 days of posts from every profile tracked in the <span className="c-text">weekly-trends-scrape</span> edge function, and surfaces the ones that beat that profile's own average — a fresh read on what's working right now, not a stale weekly snapshot.
        </p>
        <div className="flex justify-center mt-3">
          <button onClick={generateNow} disabled={generating}
            className="flex items-center gap-2 px-5 py-2.5 rounded-lg c-bg-accent c-onaccent fs-11 font-mono uppercase tracking-wide font-semibold hover-bg-accent2 disabled:opacity-40 tap">
            {generating ? <><Loader2 size={13} className="animate-spin" /> Generating...</> : <><Flame size={13} /> Generate now</>}
          </button>
        </div>
        {lastSync && <p className="fs-10 c-faint font-mono mt-2 text-center">Last synced {new Date(lastSync).toLocaleString("en-US")}</p>}
        {generating && <p className="fs-10 c-muted font-mono mt-2 text-center">Scraping all tracked profiles via Apify — this takes 10-15 min now that it runs sequentially to avoid rate limits, feel free to check back.</p>}
        {generateError && <p className="fs-10 c-warn font-mono mt-2 text-center">{generateError}</p>}
        {scrapeErrors.length > 0 && (
          <div className="mt-2 text-center px-2" style={{ minWidth: 0 }}>
            <p className="fs-10 c-warn font-mono">{scrapeErrors.length} profile(s) failed this run:</p>
            <p className="fs-9 c-faint font-mono mt-1" style={{ overflowWrap: "anywhere", wordBreak: "break-word" }}>{scrapeErrors.map((e) => `${e.handle} (${e.error})`).join("  ·  ")}</p>
          </div>
        )}
      </div>

      <div className="fs-10 c-muted font-mono uppercase mb-2">Style</div>
      <div className="flex flex-wrap gap-2 mb-4">
        <button onClick={() => setFilter("all")}
          className={`px-3 py-1.5 rounded-full border fs-11 font-mono font-semibold transition-colors ${filter === "all" ? "c-border-accent c-accent c-bg-accent-a2" : "c-border c-muted hover-bg-surface"}`}>
          All ({all.length})
        </button>
        {TREND_CATEGORIES.map((c) => (
          <button key={c} onClick={() => setFilter(c)}
            className={`px-3 py-1.5 rounded-full border fs-11 font-mono font-semibold transition-colors ${filter === c ? "c-border-accent c-accent c-bg-accent-a2" : "c-border c-muted hover-bg-surface"}`}>
            {c} ({counts[c] || 0})
          </button>
        ))}
      </div>

      {filter !== "all" && (
        <>
          <div className="fs-10 c-muted font-mono uppercase mb-2">How many</div>
          <div className="flex flex-wrap gap-2 mb-2">
            {[10, 15, 20, 30].map((n) => (
              <button key={n} onClick={() => setTopN(n)}
                className={`px-3 py-1.5 rounded-full border fs-11 font-mono font-semibold transition-colors ${topN === n ? "c-border-accent c-accent c-bg-accent-a2" : "c-border c-muted hover-bg-surface"}`}>
                Top {n}
              </button>
            ))}
          </div>
          <div className="flex flex-wrap items-center justify-between gap-2 mb-5">
            <p className="fs-10 c-faint font-mono">Showing top {Math.min(topN, inCategory.length)} of {inCategory.length}</p>
            <button onClick={copyRoster} disabled={sorted.length === 0}
              className="px-3 py-1.5 rounded-full border c-border c-muted hover-bg-surface fs-10 font-mono font-semibold transition-colors disabled:opacity-40 tap shrink-0">
              {rosterCopied ? "Copied!" : "Get Roster"}
            </button>
          </div>
        </>
      )}
      {filter === "all" && <div className="mb-5" />}

      {sorted.length === 0 && (
        <div className="fs-12 c-faint font-mono italic py-16 text-center border border-dashed c-border rounded-xl">
          {all.length === 0 ? "No trends synced yet. Add profiles in Settings, and check back after the next Sunday scan." : "Nothing in this category yet."}
        </div>
      )}

      {sorted.length > 0 && (
        <div className="grid grid-cols-1 sm:grid-cols-3 xl:grid-cols-5 gap-3">
          {sorted.map((post, i) => (
            <TrendReelCard key={post.id || i} post={post} fmt={fmt} />
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- persistent login (7 days) ----------
// Uses real browser localStorage since this needs to survive closing the tab/browser.
// Note: localStorage is disabled inside the Claude artifact preview sandbox, so this
// only actually persists once the site is deployed for real (e.g. on GitHub Pages).

const SESSION_KEY = "agencyos_session";
const SESSION_DAYS = 7;

function loadSavedSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed.expiresAt || parsed.expiresAt < Date.now()) {
      localStorage.removeItem(SESSION_KEY);
      return null;
    }
    return { role: parsed.role, name: parsed.name, agency: parsed.agency };
  } catch {
    return null;
  }
}

function saveSession(session) {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      ...session,
      expiresAt: Date.now() + SESSION_DAYS * 24 * 60 * 60 * 1000,
    }));
  } catch {
    // localStorage unavailable (e.g. inside the Claude preview sandbox) — session just won't persist here.
  }
}

function clearSavedSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
  } catch {}
}

    : persistTasks;
  const scopedPersistStats = isAdmin
    ? async (next) => persistStats([...stats.filter((s) => !agencyModelNameSet.has(s.model)), ...next])
    : persistStats;
  const scopedPersistReels = isAdmin
    ? async (next) => persistReels([...reels.filter((r) => !agencyModelNameSet.has(r.model)), ...next])
    : persistReels;
  const scopedPersistModels = isAdmin
    ? async (next) => persistModels([...models.filter((m) => (m.agency || "CZ") !== session.agency), ...next])
    : persistModels;
  return (
    <div className="min-h-screen c-bg-app flex flex-col" style={{ fontFamily: "Inter, sans-serif" }}>
      <style>{fontImport}</style>

      {currentView === "neo" ? (
        <div className="fixed inset-0 z-40" style={{ background: "#030705", overflowX: "hidden", maxWidth: "100vw" }}>
          {neoBooting && <NeoBootSequence onDone={() => setNeoBooting(false)} />}
          <CircuitBoardBG />
          <button onClick={() => setView("dashboard")}
            className="tap fixed top-4 right-4 z-50 flex items-center gap-2 px-3 py-2 rounded-lg border font-mono fs-11 uppercase tracking-widest transition-colors"
            style={{ borderColor: "rgba(57,230,115,0.35)", color: "#39e673", background: "rgba(3,7,5,0.6)", backdropFilter: "blur(6px)" }}>
            <X size={14} /> Leave Neo
          </button>
          <div className="relative z-10 h-full overflow-y-auto overflow-x-hidden px-4 md:px-6 py-4 md:py-6 sm:pt-10 neo-scroll-container" style={{ maxWidth: "100vw" }}>
            {!neoBooting && (
              <NeoPage agency={session.agency} session={session} onNavigate={setView}
                onSignOut={() => { clearSavedSession(); setSession(null); setView(null); setOnboardingDismissed(false); }}
                cards={scopedCards} tasks={scopedTasks} models={agencyModels} stats={scopedStats} reels={scopedReels} trends={trends} bufferDailyStats={bufferDailyStats} inflowwDailyStats={inflowwDailyStats} settings={settings} persistSettings={persistSettings} />
            )}
          </div>
        </div>
      ) : (
      <>
      {/* Full-width top bar (desktop + mobile — sidebar nav now covers both) */}
      <div className="flex items-center justify-between c-bg-panel flex-shrink-0">
        <button onClick={() => setView("dashboard")} title="Go to Dashboard"
          className="tap w-14 sm:w-56 flex items-center justify-center sm:justify-start sm:pl-4 py-3 flex-shrink-0 hover-bg-surface transition-colors">
          <div className="flex items-center gap-2" style={{ position: "relative" }}>
            <ZionMark size={18} gradId="zionMarkGradTopbar" />
            <span className="text-lg font-extrabold tracking-tight c-text hidden sm:inline">
              ZION OS
            </span>
            <span className="hidden sm:inline" style={{
              position: "absolute", right: 0, top: "100%", marginTop: "-2px",
              lineHeight: 1, whiteSpace: "nowrap",
              fontFamily: "'Dancing Script', cursive", fontWeight: 700, fontSize: "10px",
              color: "var(--accent, #12b34c)", textShadow: "0 0 3px currentColor, 0 0 6px currentColor",
              pointerEvents: "none",
            }}>by neomngmt</span>
          </div>
        </button>
        <div className="flex items-center gap-1.5 px-4 py-3 flex-1 justify-end min-w-0">
          <GlobalSearch cards={isAdmin ? scopedCards : cards} tasks={isAdmin ? scopedTasks : tasks}
            models={isAdmin ? agencyModels : models} trends={weeklyTrendReels} onNavigate={setView}
            trendsNavId="weeklytrends" showModels={isAdmin} showTrends={isAdmin} navItems={NAV} />
          {session.role === "admin" && (
            <AdminNotificationBell cards={scopedCards} tasks={scopedTasks} onNavigate={setView} />
          )}
          {session.role === "creator" && (
            <NotificationBell model={models.find((m) => m.name === session.name)} cards={cards} tasks={tasks} trends={trends}
              agency={session.agency} models={models} persistModels={persistModels} onNavigate={setView} />
          )}
          <div className="flex items-center gap-2 pl-1">
            <div title={`${session.name} — ${session.agency}`} className="w-7 h-7 rounded-full c-bg-accent c-onaccent flex items-center justify-center fs-12 font-mono font-bold flex-shrink-0">
              {(session.name || "?").slice(0, 1).toUpperCase()}
            </div>
            <div className="leading-tight hidden sm:block">
              <div className="fs-12 font-semibold c-text">{session.name}</div>
              <div className="fs-9 font-mono uppercase tracking-wide c-faint">{session.agency} {session.role === "admin" ? "team" : ""}</div>
            </div>
          </div>
          <button onClick={() => { clearSavedSession(); setSession(null); setView(null); setOnboardingDismissed(false); }}
            title="Sign out" className="tap hidden sm:flex p-1.5 rounded-lg c-muted hover-warn hover-bg-surface transition-colors ml-1">
            <LogOut size={15} />
          </button>
          <button onClick={() => setMobileNavOpen((v) => !v)}
            title="Menu" className="tap sm:hidden flex items-center justify-center p-1.5 rounded-lg c-muted hover-text-primary hover-bg-surface transition-colors ml-1">
            {mobileNavOpen ? <X size={20} /> : <Menu size={20} />}
          </button>
        </div>
      </div>

      <div className="flex flex-1 min-h-0">
        {/* Backdrop for the mobile popup menu — always mounted so opacity can transition; tapping it closes the menu */}
        <div onClick={() => setMobileNavOpen(false)}
          className={`fixed inset-0 z-40 bg-black/60 sm:hidden transition-opacity duration-300 ${mobileNavOpen ? "opacity-100" : "opacity-0 pointer-events-none"}`} />

        {/* Sidebar — slides in from the left on phones when the top-right
            menu button is tapped; always visible (static) from sm up. */}
        <aside className={`fixed inset-y-0 left-0 z-50 w-56 shadow-2xl flex c-bg-panel flex-shrink-0 flex-col transition-transform duration-300 ease-out sm:static sm:z-auto sm:shadow-none sm:translate-x-0 ${mobileNavOpen ? "translate-x-0" : "-translate-x-full"}`}>
          {mobileNavOpen && (
            <div className="sm:hidden flex items-center justify-center pt-6 pb-5">
              <div style={{ position: "relative", display: "inline-flex", alignItems: "center", gap: "8px", transform: "translateX(-6px)" }}>
                <ZionMark size={26} gradId="zionMarkGradMobileNav" />
                <span className="font-extrabold tracking-tight c-text" style={{ fontSize: "22px" }}>ZION OS</span>
                <span style={{
                  position: "absolute", right: 0, top: "100%", marginTop: "-3px",
                  display: "inline-block", lineHeight: 1, whiteSpace: "nowrap",
                  fontFamily: "'Dancing Script', cursive", fontWeight: 700, fontSize: "11px",
                  color: "var(--accent, #39ffa0)", textShadow: "0 0 3px currentColor, 0 0 6px currentColor",
                  WebkitClipPath: "inset(0 100% 0 0)", clipPath: "inset(0 100% 0 0)",
                  animation: "writeOn 1.2s steps(20,end) forwards, neoFlicker 3.5s ease-in-out infinite 1.2s",
                }}>by neomngmt</span>
              </div>
            </div>
          )}
          <nav className="flex-1 px-2 py-3 space-y-1 overflow-y-auto">
            {NAV.map((n) => {
              const Icon = n.icon;
              const activeNav = currentView === n.id;
              const labelCls = mobileNavOpen ? "" : "hidden sm:inline";
              if (n.id === "content") {
                return (
                  <div key={n.id}>
                    <button
                      onClick={() => { setMobileNavOpen(true); setContentNavOpen((v) => !v); }}
                      className={`tap w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg fs-13 transition-colors ${activeNav ? "c-bg-accent-a1 c-accent" : "c-muted hover-bg-surface hover-text-primary"}`}>
                      <Icon size={20} />
                      <span className={`flex-1 text-left ${labelCls}`}>{n.label}</span>
                      <ChevronRight size={15} className={`transition-transform ${labelCls}`} style={{ transform: contentNavOpen ? "rotate(90deg)" : "none" }} />
                    </button>
                    {contentNavOpen && (
                      <div className={`ml-6 mt-1 space-y-0.5 border-l c-border pl-2 ${mobileNavOpen ? "" : "hidden sm:block"}`}>
                        {PLATFORMS.map((p) => {
                          const PIcon = p.icon === "Instagram" ? Instagram : p.icon === "TikTokLogo" ? TikTokLogo : XLogo;
                          const platformActive = activeNav && contentPlatform === p.id;
                          return (
                            <button key={p.id}
                              onClick={() => { setView("content"); setContentPlatform(p.id); setMobileNavOpen(false); }}
                              className={`tap w-full flex items-center gap-2 px-2.5 py-1.5 rounded-lg fs-12 font-mono transition-colors ${platformActive ? "c-bg-accent-a2 c-accent font-semibold" : "c-muted hover-bg-surface"}`}>
                              <PIcon size={16} />{p.label}
                            </button>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              }
              return (
                <button key={n.id} onClick={() => {
                  if (n.id === "neo") {
                    primeNeoAudioUnlock();
                    setNeoBooting(true);
                    const gName = session.role === "admin" ? "Boss" : (session.name || "there");
                    prefetchNeoGreeting(`Hi ${gName}! How can I help you today?`);
                  }
                  setView(n.id); setMobileNavOpen(false);
                }}
                  className={`tap w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg fs-13 transition-colors ${activeNav ? "c-bg-accent-a1 c-accent" : "c-muted hover-bg-surface hover-text-primary"} ${n.id === "neo" ? "nav-neo-item" : ""}`}>
                  <Icon size={20} />
                  <span className={labelCls}>{n.label}</span>
                </button>
              );
            })}
          </nav>
          <div className="px-2 py-3 border-t c-border sm:hidden">
            <button
              onClick={() => { clearSavedSession(); setSession(null); setView(null); setOnboardingDismissed(false); }}
              className="tap w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg fs-13 c-muted hover-warn hover-bg-surface transition-colors">
              <LogOut size={20} />
              <span>Log out</span>
            </button>
          </div>
          <div className="px-4 py-3 hidden sm:block">
            <div className="flex items-center gap-2">
              <Circle size={7} fill="#39e673" color="#39e673" className="anim-pulse-dot" />
              <span className="fs-10 font-mono uppercase tracking-widest c-muted">All systems online</span>
            </div>
          </div>
        </aside>

        <div className="flex-1 flex flex-col min-w-0">
          <main key={currentView} className="flex-1 px-4 md:px-6 py-4 md:py-6 overflow-x-hidden pb-6 anim-view">
            {currentView !== "neo" && currentView !== "content" && (
              <div className="mb-5 md:mb-6">
                <h1 className="text-2xl md:text-3xl font-extrabold tracking-tight c-text">
                  {NAV.find((n) => n.id === currentView)?.label}
                </h1>
              </div>
            )}

            {currentView === "dashboard" && (session.role === "admin"
              ? <Dashboard cards={scopedCards} models={agencyModels} stats={scopedStats} reels={scopedReels} onNavigate={setView} inflowwDailyStats={inflowwDailyStats} inflowwSyncing={inflowwSyncing} refreshInfloww={refreshInfloww} bufferDailyStats={bufferDailyStats} bufferTopPosts={bufferTopPosts} settings={settings} />
              : <CreatorDashboard stats={stats} tasks={tasks} restrictModel={restrictModel} onNavigate={setView} bufferDailyStats={bufferDailyStats} bufferTopPosts={bufferTopPosts} ofDailyStats={ofDailyStats} inflowwDailyStats={inflowwDailyStats} />)}
            {currentView === "content" && <ContentDirector cards={isAdmin ? scopedCards : cards} persistCards={isAdmin ? scopedPersistCards : persistCards} models={isAdmin ? agencyModels : models} restrictModel={restrictModel} forcedNetwork={contentPlatform} reels={isAdmin ? scopedReels : reels} persistReels={isAdmin ? scopedPersistReels : persistReels} xCompetitors={xCompetitors} persistXCompetitors={persistXCompetitors} bufferDailyStats={bufferDailyStats} bufferTopPosts={bufferTopPosts} />}
            {currentView === "calendar" && <CalendarView cards={isAdmin ? scopedCards : cards} tasks={isAdmin ? scopedTasks : tasks} onNavigate={setView} restrictModel={restrictModel} />}
            {currentView === "tasks" && <TaskManager tasks={isAdmin ? scopedTasks : tasks} persistTasks={isAdmin ? scopedPersistTasks : persistTasks} models={isAdmin ? agencyModels : models} restrictModel={restrictModel} />}
            {currentView === "stats" && <StatsManager stats={scopedStats} persistStats={scopedPersistStats} models={agencyModels} reels={scopedReels} persistReels={scopedPersistReels} />}
            {currentView === "reelsorter" && isAdmin && <ReelSorterPage />}
            {currentView === "titlegen" && isAdmin && <TitleGeneratorPage />}
            {currentView === "weeklytrends" && isAdmin && <TrendsPage weeklyTrendReels={weeklyTrendReels} onReload={reloadWeeklyTrendReels} />}
            {currentView === "trending" && <CreatorTrending trends={trends} agency={session.agency} />}
            {currentView === "models" && <ModelManager models={agencyModels} persistModels={scopedPersistModels} cards={scopedCards} reels={scopedReels} agency={session.agency} bufferDailyStats={bufferDailyStats} />}
            {currentView === "whatsnew" && <WhatsNewPage />}
            {currentView === "settings" && (isAdmin
              ? <SettingsPanel settings={settings} persistSettings={persistSettings} agency={session.agency} />
              : <CreatorSettingsPanel model={models.find((m) => m.name === session.name)} persistModels={persistModels} models={models} />)}
          </main>
        </div>
      </div>
      </>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>

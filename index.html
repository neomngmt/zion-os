}

function CircuitBoardBG() {
  // Generated once per mount (Math.random(), not a fixed seed) — a
  // full-screen, non-repeating layout of grid-aligned traces plus a few
  // "chip" rectangles, so it reads like an actual motherboard rather than
  // one small tile stamped across the screen.
  const { traces, dots, chips } = useMemo(() => {
    const W = 1600, H = 900, STEP = 40;
    const cols = W / STEP, rows = H / STEP;
    const gx = (c) => c * STEP;
    const gy = (r) => r * STEP;
    const rand = (n) => Math.floor(Math.random() * n);

    const traces = [];
    const dots = [];
    for (let i = 0; i < 46; i++) {
      let c = rand(cols), r = rand(rows);
      const segs = 2 + rand(3); // 2-4 segments
      let d = `M${gx(c)} ${gy(r)}`;
      for (let s = 0; s < segs; s++) {
        if (Math.random() < 0.5) c = Math.max(0, Math.min(cols, c + (rand(5) - 2) * 2));
        else r = Math.max(0, Math.min(rows, r + (rand(5) - 2) * 2));
        d += ` L${gx(c)} ${gy(r)}`;
      }
      const len = 500; // fixed — must match the neoCircuitTrace keyframe's dash values
      traces.push({
        d, len,
        opacity: 0.14 + Math.random() * 0.16,
        delay: -(Math.random() * 6).toFixed(2),
        dur: (4 + Math.random() * 3).toFixed(2),
      });
      dots.push({ x: gx(c), y: gy(r), r: 2 + Math.random() * 1.8, delay: -(Math.random() * 3.5).toFixed(2) });
    }

    const chips = Array.from({ length: 7 }, () => {
      const cw = (2 + rand(3)) * STEP, ch = (2 + rand(2)) * STEP;
      const x = gx(rand(cols - cw / STEP)), y = gy(rand(rows - ch / STEP));
      const pins = Math.max(2, Math.floor(cw / STEP) - 1);
      return { x, y, w: cw, h: ch, pins };
    });

    return { traces, dots, chips };
  }, []);

  return (
    <div className="fixed inset-0" style={{ zIndex: 0, pointerEvents: "none", background: "#050a06" }}>
      <svg width="100%" height="100%" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice"
        style={{ position: "absolute", inset: 0 }}>
        {traces.map((t, i) => (
          <path key={i} className="circuit-line" d={t.d} fill="none" stroke="rgba(57,230,115,1)" strokeWidth="1.4"
            style={{ opacity: t.opacity, strokeDasharray: t.len, strokeDashoffset: t.len, animationDelay: `${t.delay}s`, animationDuration: `${t.dur}s` }} />
        ))}
        {dots.map((d, i) => (
          <circle key={i} className="circuit-dot" cx={d.x} cy={d.y} r={d.r} fill="rgba(120,255,160,0.55)"
            style={{ animationDelay: `${d.delay}s` }} />
        ))}
        {chips.map((c, i) => (
          <g key={i} style={{ opacity: 0.3 }}>
            <rect x={c.x} y={c.y} width={c.w} height={c.h} fill="none" stroke="rgba(57,230,115,0.5)" strokeWidth="1.2" rx="2" />
            {Array.from({ length: c.pins }, (_, p) => (
              <line key={p} x1={c.x + ((p + 1) * c.w) / (c.pins + 1)} y1={c.y - 6} x2={c.x + ((p + 1) * c.w) / (c.pins + 1)} y2={c.y}
                stroke="rgba(57,230,115,0.4)" strokeWidth="1.2" />
            ))}
          </g>
        ))}
      </svg>
    </div>
  );
}

function MatrixRain({ opacity = 0.16 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    if (!ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ZION";
    const fontSize = 15;
    let cols, drops;

    const resize = () => {
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = "100%";
      canvas.style.height = "100%";
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.scale(dpr, dpr);
      cols = Math.floor(window.innerWidth / fontSize);
      drops = Array.from({ length: cols }, () => Math.random() * -window.innerHeight / fontSize);
    };
    resize();
    window.addEventListener("resize", resize);

    let raf;
    const draw = () => {
      ctx.fillStyle = "rgba(3,7,5,0.09)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      ctx.font = `${fontSize}px 'JetBrains Mono', monospace`;
      for (let i = 0; i < cols; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const y = drops[i] * fontSize;
        ctx.fillStyle = Math.random() > 0.985 ? "rgba(200,255,220,0.9)" : "rgba(57,230,115,0.55)";
        ctx.fillText(char, i * fontSize, y);
        if (y > window.innerHeight && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
      raf = requestAnimationFrame(draw);
    };
    draw();
    return () => { cancelAnimationFrame(raf); window.removeEventListener("resize", resize); };
  }, []);
  return <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, zIndex: 0, opacity, pointerEvents: "none" }} />;
}

function NeoBootSequence({ onDone }) {
  const lines = [
    "INITIALIZING N.E.O. CORE...",
    "ESTABLISHING NEURAL LINK...",
    "LOADING AGENCY DATASTREAM...",
    "CALIBRATING VOICE MATRIX...",
    "ALL SYSTEMS ONLINE.",
  ];
  const [shown, setShown] = useState(0);
  const audioCtxRef = useRef(null);

  const playBeep = (freq, duration, delay = 0, type = "sine", volume = 0.06) => {
    try {
      if (!audioCtxRef.current) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        audioCtxRef.current = new AudioCtx();
      }
      const ctx = audioCtxRef.current;
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(volume, t0 + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    } catch {}
  };

  useEffect(() => {
    // A quick rising power-up sweep the instant this mounts (the click that
    // opened Neo counts as the user gesture Web Audio needs).
    playBeep(220, 0.5, 0, "sawtooth", 0.035);
    playBeep(440, 0.4, 0.05, "sine", 0.03);
    return () => { if (audioCtxRef.current) audioCtxRef.current.close(); };
  }, []);

  useEffect(() => {
    if (shown >= lines.length) {
      playBeep(880, 0.35, 0, "sine", 0.05);
      playBeep(1320, 0.3, 0.08, "sine", 0.04);
      const t = setTimeout(onDone, 350);
      return () => clearTimeout(t);
    }
    if (shown > 0) playBeep(560 + shown * 40, 0.09, 0, "square", 0.025);
    const t = setTimeout(() => setShown((s) => s + 1), 260);
    return () => clearTimeout(t);
  }, [shown]);
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center" style={{ background: "#030705" }}>
      <MatrixRain opacity={0.3} />
      <div className="relative z-10 font-mono text-left" style={{ minWidth: 320 }}>
        {lines.slice(0, shown).map((l, i) => (
          <div key={i} className="fs-13" style={{ color: "#39e673", textShadow: "0 0 6px rgba(57,230,115,0.6)", marginBottom: 6 }}>
            <span style={{ opacity: 0.6 }}>{">"}</span> {l}
          </div>
        ))}
      </div>
    </div>
  );
}

function NeoPage({ agency, session, onNavigate, onSignOut, cards, tasks, models, stats, reels, trends, bufferDailyStats, inflowwDailyStats, settings, persistSettings }) {
  const [messages, setMessages] = useState([]);
  const [winWidth, setWinWidth] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  const rosterRef = useRef(null);
  useEffect(() => {
    const onResize = () => setWinWidth(window.innerWidth);
    window.addEventListener("resize", onResize);
    return () => window.removeEventListener("resize", onResize);
  }, []);
  const isDesktopViewport = winWidth >= 641;
  const [neoMemories, setNeoMemories] = useState([]);
  const loadNeoMemories = useCallback(async () => {
    try {
      let query = supabaseClient.from("neo_memory").select("*").eq("agency", agency).order("created_at", { ascending: false }).limit(50);
      if (session.role === "creator") query = query.or(`model.eq.${session.name},model.is.null`);
      const { data, error } = await query;
      if (error) throw error;
      setNeoMemories(data || []);
    } catch (e) {
      console.error("failed to load neo memories", e);
    }
  }, [agency, session.role, session.name]);
  useEffect(() => { loadNeoMemories(); }, [loadNeoMemories]);
  const [thinking, setThinking] = useState(false);
  const [showThinkingLabel, setShowThinkingLabel] = useState(false);
  const [queriesToday, setQueriesToday] = useState(0);
  const [listening, setListening] = useState(false);
  const [heard, setHeard] = useState("");
  const greetedRef = useRef(false);

  // Stop everything the moment this page unmounts (Leave Neo, or navigating
  // away any other way) — otherwise TTS audio and/or the mic keep running
  // in the background since they're plain browser objects with their own
  // lifecycle, not tied to React unmounting them automatically.
  useEffect(() => {
    return () => {
      if (audioRef.current) { try { audioRef.current.pause(); } catch {} }
      if (activeOneShotRef.current) { try { activeOneShotRef.current.stop(); } catch {} }
      if (recognitionRef.current) { try { recognitionRef.current.stop(); } catch {} }
      activeListenRef.current = false;
    };
  }, []);

  // Auto-greeting: the moment this page mounts (right after the boot
  // sequence clears), Neo speaks first instead of waiting to be clicked —
  // and speakText's own onended handler already chains into hands-free
  // listening once the greeting finishes, so no extra wiring needed there.
  // greetedRef guards against ever firing this twice, in case the effect
  // somehow re-runs (defensive — the actual cause of a double-greeting
  // would be a remount, which this can't fix, but it stops the symptom).
  useEffect(() => {
    if (greetedRef.current) return;
    greetedRef.current = true;
    unlockAudio();
    const name = session.role === "admin" ? "Boss" : (session.name || "there");
    const greeting = `Hi ${name}! How can I help you today?`;
    setMessages([{ role: "neo", text: greeting }]);
    // If the nav click already kicked off a prefetch, wait for that instead
    // of starting a brand new (slower) fetch — this is what keeps the delay
    // between the original tap and actual audio.play() short enough for
    // strict mobile autoplay policies.
    if (prefetchedGreetingUrl) {
      prefetchedGreetingUrl.then((url) => speakText(greeting, url));
    } else {
      speakText(greeting);
    }
  }, []);
  const [voiceError, setVoiceError] = useState("");
  const [speaking, setSpeaking] = useState(false);
  useEffect(() => {
    if (speaking || listening) { setShowThinkingLabel(false); return; }
    if (!thinking) return; // don't hide here — stay up through the thinking→speaking gap
    const id = setTimeout(() => setShowThinkingLabel(true), 500);
    return () => clearTimeout(id);
  }, [thinking, speaking, listening]);
  const speakingRef = useRef(false);
  const speakBumpRef = useRef(0);
  const glowElRef = useRef(null);
  const scrollRef = useRef(null);
  const recognitionRef = useRef(null);
  const listeningDebounceRef = useRef(null);
  const activeListenRef = useRef(false);
  const thinkingRef = useRef(false);
  const speechSupported = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages, thinking]);

  const requestIdRef = useRef(0);
  const audioRef = useRef(null);
  const speakPulseTimerRef = useRef(null);
  const liveAmpRef = useRef(0);

  const stopSpeakPulse = () => {
    if (speakPulseTimerRef.current) { clearInterval(speakPulseTimerRef.current); speakPulseTimerRef.current = null; }
    liveAmpRef.current = 0;
  };

  const speakText = async (text, prefetchedUrl) => {
    try {
      // Stop anything currently playing before starting the next line.
      if (audioRef.current) audioRef.current.pause();
      stopSpeakPulse();

      let url = prefetchedUrl;
      if (!url) {
        const { data, error } = await supabaseClient.functions.invoke("neo-tts", {
          body: { text },
        });
        if (error) {
          // supabase-js's FunctionsHttpError hides the real response body
          // behind a generic "non-2xx status code" message — the actual
          // reason (e.g. a Groq error) is in error.context, the raw Response.
          let detail = error.message;
          try {
            if (error.context && typeof error.context.text === "function") {
              const bodyText = await error.context.text();
              try {
                const parsed = JSON.parse(bodyText);
                detail = parsed.error || bodyText;
              } catch {
                detail = bodyText || detail;
              }
            }
          } catch {}
          throw new Error(detail);
        }

        // supabase-js returns edge function binary responses as a Blob.
        const rawBytes = data instanceof Blob ? await data.arrayBuffer() : data;

        // Sanity check: a real MP3 starts with an ID3 tag or an MPEG frame
        // sync byte. If it doesn't, something upstream (OpenAI or the edge
        // function) likely returned an error body instead of audio.
        const header = new Uint8Array(rawBytes.slice(0, 3));
        const isId3 = header[0] === 0x49 && header[1] === 0x44 && header[2] === 0x33; // "ID3"
        const isMpegSync = header[0] === 0xFF && (header[1] & 0xE0) === 0xE0;
        if (!isId3 && !isMpegSync) {
          const errText = new TextDecoder().decode(rawBytes).slice(0, 300);
          throw new Error(`unexpected response (${rawBytes.byteLength} bytes): ${errText || "empty"}`);
        }

        const blob = new Blob([rawBytes], { type: "audio/mpeg" });
        url = URL.createObjectURL(blob);
      }

      // Reuse the single persistent <audio> element created on the user's
      // first click (unlockAudio) — creating a fresh Audio() each turn is
      // what triggers the browser's autoplay block on later, gesture-less
      // turns of the hands-free loop.
      if (!audioRef.current) audioRef.current = new Audio();
      const audio = audioRef.current;
      // Best-effort nudge for iOS Safari, which sometimes routes audio to
      // the earpiece speaker instead of the main one after the mic has been
      // used — there's no reliable web API to force this, so this only
      // helps sometimes.
      audio.setAttribute("playsinline", "");
      audio.setAttribute("webkit-playsinline", "");
      const prevUrl = audio.dataset.blobUrl;
      audio.src = url;
      audio.dataset.blobUrl = url;

      audio.onplay = () => {
        setVoiceError("");
        setSpeaking(true);
        speakingRef.current = true;
        // Simple synthetic pulse so the orb animates while speaking —
        // reliable across all browsers, no Web Audio graph involved (which
        // can silently swallow audio output if its context gets suspended).
        speakPulseTimerRef.current = setInterval(() => {
          speakBumpRef.current = Date.now();
          liveAmpRef.current = 0.4 + Math.random() * 0.6;
        }, 160);
      };
      audio.onended = () => {
        setSpeaking(false);
        speakingRef.current = false;
        stopSpeakPulse();
        if (prevUrl) URL.revokeObjectURL(prevUrl);
        // Hands-free loop: once Neo finishes talking, start listening again
        // automatically — no need to click the orb for each turn.
        startActiveListen();
      };
      audio.onerror = () => {
        setSpeaking(false);
        speakingRef.current = false;
        stopSpeakPulse();
        const mediaErr = audio.error;
        const codeNames = { 1: "ABORTED", 2: "NETWORK", 3: "DECODE", 4: "SRC_NOT_SUPPORTED" };
        const codeName = mediaErr ? (codeNames[mediaErr.code] || `code ${mediaErr.code}`) : "unknown";
        setVoiceError(`failed to play audio — ${codeName}, ${rawBytes.byteLength} bytes`);
      };
      await audio.play();
    } catch (err) {
      setSpeaking(false);
      speakingRef.current = false;
      stopSpeakPulse();
      setVoiceError(err?.message || "failed to speak");
    }
  };

  const send = async (text) => {
    if (!text || thinkingRef.current) return;
    thinkingRef.current = true;
    setThinking(true);
    const myRequestId = ++requestIdRef.current;
    setMessages((m) => [...m, { role: "user", text }]);

    // Memory: if the person explicitly asked Neo to remember something,
    // save it as its own fact — scoped to this creator if she said it,
    // or agency-wide if the Boss said it — and re-load so it's available
    // in context on this very request too.
    const rememberMatch = text.match(/\b(?:remember|pamatuj(?:\s+si)?|zapamatuj(?:\s+si)?)\b\s*(?:that|,|:)?\s*(.+)/i);
    if (rememberMatch && rememberMatch[1] && rememberMatch[1].trim().length > 2) {
      try {
        await supabaseClient.from("neo_memory").insert({
          agency,
          model: session.role === "creator" ? session.name : null,
          content: rememberMatch[1].trim(),
        });
        await loadNeoMemories();
      } catch (e) {
        console.error("failed to save neo memory", e);
      }
    }

    // heroModels (defined below) already scopes creators down to just their
    // own record — reused here so Neo's context matches what's on screen.
    try {
      const { data, error } = await supabaseClient.functions.invoke("clever-service", {
        body: {
          message: text,
          agency,
          context: {
            viewerRole: session.role,
            viewerName: session.name,
            memories: neoMemories.map((m) => m.content),
            primaryObjective: {
              monthlyRevenueSoFar: Math.round(monthRevenue),
              monthlyRevenueGoal: Math.round(monthGoal),
              percentToGoal: monthPct,
              dayOfMonth,
              daysInMonth,
            },
            cardCount: cards.length,
            openTasks: tasks.filter((t) => t.status !== "done").length,
            overdueTasks: tasks.filter((t) => t.status !== "done" && t.dueDate && t.dueDate < todayISO()).length,
            modelNames: heroModels.map((m) => m.name),
            // Per-model earnings/subs history, most recent week first, so Neo can
            // answer "how much did X earn" or "who's growing fastest" directly.
            earningsByModel: heroModels.map((m) => ({
              model: m.name,
              weeks: stats.filter((s) => s.model === m.name)
                .sort((a, b) => (b.weekOf || "").localeCompare(a.weekOf || ""))
                .slice(0, 6)
                .map((s) => ({ weekOf: s.weekOf, ofEarnings: s.ofEarnings, ofSubs: s.ofSubs, igFollowers: s.igFollowers, igReach: s.igReach })),
            })),
            // Best/worst performing reels so Neo can say what's working.
            topReels: [...(reels || [])].filter((r) => heroModels.some((m) => m.name === r.model)).sort((a, b) => (b.views || 0) - (a.views || 0)).slice(0, 12)
              .map((r) => ({ model: r.model, title: r.title, weekOf: r.weekOf, views: r.views, likes: r.likes, shares: r.shares, comments: r.comments })),
            recentTrends: trends.filter((t) => (agency === "US" ? t.showUS : t.showCZ)).slice(-6).map((t) => ({ title: t.title, category: t.category })),
            // Buffer-synced social reach per model, last 7 days, so Neo can
            // answer "how's Anna's X doing" or "who's growing on Instagram."
            socialImpressions7d: heroModels.map((m) => ({
              model: m.name,
              instagram: impressionsFor(m.name, "ig"),
              x: impressionsFor(m.name, "x"),
              tiktok: impressionsFor(m.name, "tiktok"),
            })),
            // Real OnlyFans earnings synced from Infloww (Free + Paid accounts
            // combined), last 7 and last 30 days per model — this is the
            // primary source of truth for "how much did X earn" now.
            inflowwEarningsByModel: heroModels.map((m) => {
              const rows = (inflowwDailyStats || []).filter((r) => r.model === m.name);
              const sum = (days) => {
                const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
                const cutoffStr = cutoff.toISOString().slice(0, 10);
                return rows.filter((r) => r.statDate >= cutoffStr).reduce((t, r) => t + (r.earningsNet || 0), 0);
              };
              return rows.length ? { model: m.name, last7Days: Math.round(sum(7)), last30Days: Math.round(sum(30)) } : null;
            }).filter(Boolean),
            // Day-by-day breakdown, last 14 calendar days, per model — this is what lets Neo
            // answer "how much did X earn yesterday" or "on Tuesday" instead of only knowing
            // rolled-up 7/30-day totals. today/yesterday dates are spelled out explicitly so
            // Neo doesn't have to (mis)calculate them itself from a day-of-week guess.
            todayDate: new Date().toISOString().slice(0, 10),
            yesterdayDate: (() => { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); })(),
            dailyEarningsByModel: heroModels.map((m) => {
              const rows = (inflowwDailyStats || []).filter((r) => r.model === m.name);
              const byDate = new Map();
              rows.forEach((r) => byDate.set(r.statDate, (byDate.get(r.statDate) || 0) + (r.earningsNet || 0)));
              const days = Array.from({ length: 14 }, (_, i) => {
                const d = new Date(); d.setDate(d.getDate() - (13 - i));
                const dateStr = d.toISOString().slice(0, 10);
                return { date: dateStr, earnings: Math.round(byDate.get(dateStr) || 0) };
              });
              return rows.length ? { model: m.name, days } : null;
            }).filter(Boolean),
          },
        },
      });
      if (error) throw error;
      if (myRequestId !== requestIdRef.current) return; // cancelled — ignore this response
      const reply = data?.reply || "...";
      setMessages((m) => [...m, { role: "neo", text: reply }]);
      setQueriesToday((n) => n + 1);
      speakText(reply);
    } catch (e) {
      if (myRequestId !== requestIdRef.current) return;
      const detail = e?.message || e?.context?.error || (typeof e === "string" ? e : JSON.stringify(e));
      setMessages((m) => [...m, { role: "neo", text: `Couldn't reach Neo — ${detail || "unknown error"}. Check the clever-service function and GROQ_API_KEY secret in Supabase.` }]);
    } finally {
      if (myRequestId === requestIdRef.current) {
        thinkingRef.current = false;
        setThinking(false);
      }
    }
  };

  // Clicking the orb: if Neo is currently thinking, cancel it (matches "click
  // the orb to stop"). If idle, start a one-shot listen — no wake word needed,
  // just talk right after clicking.
  // Click-to-talk. Click once: it listens for what you say and answers.
  // Click again while it's listening, thinking, or speaking: it stops
  // whatever it's doing right then. No wake word, no always-on background
  // listener — the mic is only ever active between a click and the answer.
  const setActiveListeningDebounced = (val) => {
    if (listeningDebounceRef.current) clearTimeout(listeningDebounceRef.current);
    listeningDebounceRef.current = setTimeout(() => setListening(val), val ? 0 : 150);
  };

  const activeOneShotRef = useRef(null);

  const micPrimedRef = useRef(false);

  const startActiveListen = () => {
    if (!speechSupported) return;

    const begin = () => {
      activeListenRef.current = true;
      setActiveListeningDebounced(true);
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const oneShot = new SR();
    activeOneShotRef.current = oneShot;
    oneShot.lang = "en-US";
    // continuous + manual stop-on-final, instead of relying on the browser's
    // own silence detection to end the session — Safari's built-in silence
    // detection is much shorter/less predictable than Chrome's and can cut
    // the session before you've finished a sentence.
    oneShot.continuous = true;
    oneShot.interimResults = true;
    oneShot.maxAlternatives = 1;
    let finalized = false;
    const safety = setTimeout(() => { try { oneShot.stop(); } catch {} }, 12000);
    oneShot.onresult = (e) => {
      const res = e.results[e.results.length - 1];
      // Chrome/Safari speech recognition frequently mishears "Neo" as similar-
      // sounding names since it's not a common English word — correct the
      // most frequent mishearings before it ever reaches the heard-text
      // display or gets sent to the model.
      const text = res[0].transcript.trim().replace(/\b(neil|neal|niall|neo['\u2019]?s|nio)\b/gi, (m) =>
        /['\u2019]s$/i.test(m) ? "Neo's" : "Neo"
      );
      setHeard(text);
      if (res.isFinal && text && !finalized) {
        finalized = true;
        clearTimeout(safety);
        send(text);
        try { oneShot.stop(); } catch {}
      }
    };
    const stopActive = (reason) => {
      clearTimeout(safety);
      activeListenRef.current = false;
      activeOneShotRef.current = null;
      setActiveListeningDebounced(false);
      if (reason) setHeard(`(mic stopped: ${reason})`);
    };
    oneShot.onend = () => stopActive();
    oneShot.onerror = (e) => stopActive(e?.error || "unknown error");
    try { oneShot.start(); } catch (err) { stopActive(err?.message || "failed to start"); }
    };

    // First time ever: explicitly ask for the mic via getUserMedia so Safari
    // shows its native permission prompt reliably, then release the stream
    // immediately (SpeechRecognition manages its own audio capture).
    if (!micPrimedRef.current && navigator.mediaDevices?.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          micPrimedRef.current = true;
          stream.getTracks().forEach((t) => t.stop());
          begin();
        })
        .catch(() => begin());
    } else {
      begin();
    }
  };

  const unlockAudio = () => {
    // Browsers (Safari especially) only allow audio.play() without a fresh
    // click if the very first successful play() on this exact element
    // happened inside a real user gesture. A src-less element doesn't count
    // as "successful" — it needs an actual (even silent) audio source.
    // Reuse the element already unlocked by the nav click if one exists,
    // instead of creating a brand-new (still-locked) one.
    if (!audioRef.current) {
      if (sharedNeoAudioEl) {
        audioRef.current = sharedNeoAudioEl;
      } else {
        audioRef.current = new Audio(
          "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
        );
        audioRef.current.play().catch(() => {});
      }
    }
  };

  const orbClick = () => {
    unlockAudio();
    if (thinking) {
      requestIdRef.current++; // invalidates the in-flight response
      thinkingRef.current = false;
      setThinking(false);
      setMessages((m) => [...m, { role: "neo", text: "(stopped)" }]);
      return;
    }
    if (speakingRef.current) {
      if (audioRef.current) { audioRef.current.pause(); }
      stopSpeakPulse();
      speakingRef.current = false;
      setSpeaking(false);
      return;
    }
    if (activeListenRef.current) {
      // Already listening — clicking again means "never mind, cancel that."
      try { activeOneShotRef.current?.stop(); } catch {}
      activeListenRef.current = false;
      activeOneShotRef.current = null;
      setActiveListeningDebounced(false);
      return;
    }
    startActiveListen();
  };

  const neoGreen = "#39e673";
  const textDim = "#6f9a7a";
  const border = "rgba(18,179,76,0.25)";
  const bgPanel = "#0e1310";
  const amber = "#39e673";

  // ---- real telemetry ----
  // Creators only ever see numbers derived from their own record here —
  // never the rest of the roster's tasks, revenue, or performance.
  const heroModels = session.role === "creator" ? models.filter((m) => m.name === session.name) : models;
  const openTasksCount = (session.role === "creator" ? tasks.filter((t) => t.model === session.name) : tasks).filter((t) => t.status !== "done").length;
  const relevantTrends = trends.filter((t) => (agency === "US" ? t.showUS : t.showCZ));

  // ---- financial strip: this calendar month's real Infloww revenue (all
  // models, Free + Paid combined) vs a fixed $20k agency goal ----
  const now = new Date();
  const monthStart = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-01`;
  const agencyModelNames = new Set(heroModels.map((m) => m.name));
  const inflowwThisMonth = (inflowwDailyStats || []).filter((r) => agencyModelNames.has(r.model) && r.statDate >= monthStart);
  const monthRevenue = inflowwThisMonth.reduce((sum, r) => sum + (r.earningsNet || 0), 0);
  const ownGoal = session.role === "creator" ? heroModels[0]?.monthlyGoal : null;
  const monthGoal = (ownGoal != null && ownGoal !== "") ? Number(ownGoal) : ((settings && settings.monthlyRevenueGoal) || 20000);
  const monthPct = Math.min(100, Math.round((monthRevenue / monthGoal) * 100));
  const dayOfMonth = now.getDate();

  // Creator-facing replacements for the two agency-wide tiles (active model count,
  // trends shared) that a model should never see about the rest of the roster —
  // her own Infloww numbers instead, from data already synced for her account(s).
  const last7Str = (() => { const d = new Date(); d.setDate(d.getDate() - 7); return d.toISOString().slice(0, 10); })();
  const heroInflowwRows7d = (inflowwDailyStats || []).filter((r) => agencyModelNames.has(r.model) && r.statDate >= last7Str);
  const messages7d = heroInflowwRows7d.reduce((s, r) => s + (r.messagesCount || 0), 0);
  const tips7d = heroInflowwRows7d.reduce((s, r) => s + (r.tipsCount || 0), 0);

  // last-7-days revenue series, for a small sparkline in the HUD panel
  const last7Series = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i));
    const dayStr = d.toISOString().slice(0, 10);
    return (inflowwDailyStats || []).filter((r) => agencyModelNames.has(r.model) && r.statDate === dayStr).reduce((s, r) => s + (r.earningsNet || 0), 0);
  });
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();

  // ---- agency stats grid ----
  const latestPerModel = heroModels.map((m) => stats.filter((s) => s.model === m.name).sort((a, b) => (b.weekOf || "").localeCompare(a.weekOf || ""))[0]).filter(Boolean);
  const prevPerModel = heroModels.map((m) => stats.filter((s) => s.model === m.name).sort((a, b) => (b.weekOf || "").localeCompare(a.weekOf || ""))[1]).filter(Boolean);
  const activeSubs = latestPerModel.reduce((a, s) => a + (s.ofSubs || 0), 0);
  const prevSubs = prevPerModel.reduce((a, s) => a + (s.ofSubs || 0), 0);
  const newSubs7d = activeSubs - prevSubs;
  const topReel = [...(reels || [])].filter((r) => heroModels.some((m) => m.name === r.model)).sort((a, b) => (b.views || 0) - (a.views || 0))[0];
  const revLastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().slice(0, 10);
  const revThisMonthPrior = stats.filter((s) => (s.weekOf || "") >= revLastMonthStart && (s.weekOf || "") < monthStart).reduce((a, s) => a + (s.ofEarnings || 0), 0);
  const revMomPct = revThisMonthPrior > 0 ? Math.round(((monthRevenue - revThisMonthPrior) / revThisMonthPrior) * 100) : null;

  // ---- model table: revenue / subs / IG impressions / X impressions ----
  const bufWeekAgo = new Date(); bufWeekAgo.setDate(bufWeekAgo.getDate() - 7);
  const bufWeekAgoStr = bufWeekAgo.toISOString().slice(0, 10);
  const impressionsFor = (modelName, platform) => (bufferDailyStats || [])
    .filter((r) => r.model === modelName && r.platform === platform && r.statDate >= bufWeekAgoStr)
    .reduce((a, r) => a + (r.impressions || 0), 0);
  const fmtK = (n) => (n >= 1000000 ? (n / 1000000).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "K" : n ? String(n) : "—");

  // ---- ambient/real log feed ----
  const logLines = [];
  messages.slice(-4).forEach((m) => logLines.unshift(m.role === "user" ? `you :: "${m.text.slice(0, 40)}"` : `neo :: "${m.text.slice(0, 40)}"`));
  if (logLines.length < 4) {
    [...(reels || [])].sort((a, b) => b.createdAt - a.createdAt).slice(0, 2).forEach((r) => logLines.push(`reel.logged :: ${r.model} — ${(r.views || 0).toLocaleString()} views`));
    relevantTrends.slice(-2).forEach((t) => logLines.push(`trend.posted :: ${t.title?.slice(0, 30)}`));
  }

  return (
    <div className="-m-6 p-6" style={{ background: "rgba(3,8,5,0.72)", minHeight: "calc(100vh - 160px)", fontFamily: "'JetBrains Mono', monospace" }}>
      {/* mini topbar */}
      <div className="flex items-center justify-between pb-3 mb-5 neo-fade-in relative" style={{ borderBottom: `1px solid ${border}`, animationDelay: "0.05s", zIndex: 1 }}>
        <div className="font-bold tracking-widest" style={{ color: neoGreen, textShadow: `0 0 8px ${neoGreen}88`, fontSize: "20px" }}>
          NEO <span style={{ color: textDim, fontWeight: 400 }}>// ZION OS INTELLIGENCE SYSTEM</span>
        </div>
        <NeoClock />
      </div>

      {/* status row — simple flow, no absolute positioning so it can never end up far from the orb */}
      <div className="flex items-center justify-end flex-wrap gap-2 mb-6 neo-fade-in relative" style={{ animationDelay: "0.15s", zIndex: 1 }}>
        <div className="text-right">
          <div className="fs-9 tracking-widest" style={{ color: textDim, letterSpacing: "2px" }}>OPEN TASKS / CARDS</div>
          <div className="text-xl font-bold" style={{ color: neoGreen, textShadow: `0 0 8px ${neoGreen}88` }}>{openTasksCount} <span style={{ color: textDim, fontSize: "14px" }}>/</span> {cards.length}</div>
        </div>
      </div>

      {/* Hero: left = identity/status text, right = the orb. Vertically
          centered together. Mobile stacks (orb on top, text below); desktop
          sits side by side. Status/heard text has a fixed-height box so a
          long reply can never push anything else around. */}
      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-center items-center" style={{ gap: "3rem", minHeight: "70vh" }}>

          {/* left: identity + live status — desktop only now; mobile keeps
              its earlier simpler version below instead */}
          <div className="hidden sm:flex sm:flex-col items-center sm:items-start text-center sm:text-left" style={{ width: 280, flexShrink: 0 }}>
            <div style={{ transform: isDesktopViewport ? `translate(12px, -12px)` : "none" }}>
              <div className="flex items-baseline gap-2 neo-fade-in" style={{ animationDelay: "0.15s" }}>
                <span style={{
                  width: 8, height: 8, borderRadius: "50%", flexShrink: 0,
                  background: thinking ? amber : neoGreen,
                  boxShadow: `0 0 8px ${thinking ? amber : neoGreen}`,
                  animation: (thinking || speaking || listening) ? "neoDotBlink 0.8s ease-in-out infinite" : "neoDotBlink 1.6s ease-in-out infinite",
                }} />
                <span className="font-bold tracking-widest" style={{ color: neoGreen, textShadow: `0 0 12px ${neoGreen}aa`, fontSize: "18px" }}>
                  NEO
                </span>
                <span className="fs-11 tracking-widest" style={{ color: thinking ? amber : (speaking || listening) ? neoGreen : textDim, letterSpacing: "2px" }}>
                  — {thinking ? "THINKING" : speaking ? "SPEAKING" : listening ? "LISTENING" : "ONLINE"}
                </span>
              </div>
              {/* fixed-height status area — content changes but the box never does, so it can't shove other elements around */}
              <div className="mt-3 neo-fade-in overflow-hidden" style={{ height: 40, maxWidth: 280, animationDelay: "0.4s" }}>
                <div className="fs-13 italic" style={{ color: neoGreen, opacity: 0.9 }}>
                  {thinking ? "thinking — click the orb to stop." : speaking ? "speaking — click the orb to stop." : listening ? "listening — click the orb to stop." : "click the orb to ask something."}
                </div>
              </div>
            </div>
          </div>

          {/* mobile-only text block — exactly how it worked before, unchanged */}
          <div className="sm:hidden flex flex-col items-center text-center order-2">
            <div className="fs-10 tracking-widest mt-4 neo-fade-in" style={{ color: textDim, letterSpacing: "3px", animationDelay: "0.5s" }}>
              N.E.O. — <b style={{ color: amber }}>NEURAL ENGAGEMENT ORCHESTRATOR</b>
            </div>
            <div className="fs-13 italic mt-3 max-w-sm neo-fade-in" style={{ color: neoGreen, opacity: 0.9, animationDelay: "0.6s" }}>
              {thinking ? "thinking — click the orb to stop." : speaking ? "speaking — click the orb to stop." : listening ? "listening — click the orb to stop." : "click the orb to ask something."}
            </div>
            {heard && <div className="fs-10 italic mt-1" style={{ color: neoGreen, opacity: 0.4 }}>heard: "{heard}"</div>}
            {voiceError && <div className="fs-10 italic mt-1" style={{ color: "#e07a5f" }}>voice error: {voiceError}</div>}
          </div>

          {/* center: the orb + a glow that's kept in lockstep with the orb's
              own scale/pulse via direct refs (not React state), so it
              breathes as one thing with the mesh instead of just sitting
              there statically. */}
      <div className="flex flex-col items-center">
          <div className="relative neo-orb-fade-in order-1 sm:order-none mt-6 sm:mt-8" style={{
            animationDelay: "0.3s",
            width: (isDesktopViewport ? Math.min(winWidth * 0.32, 650) : 300) * 0.98,
            height: (isDesktopViewport ? Math.min(winWidth * 0.32, 650) : 300) * 0.98,
            flexShrink: 0,
            zIndex: 100,
          }}>
            <div style={{ position: "absolute", inset: 0, transform: isDesktopViewport ? `scale(1.14)` : "none" }}>
              <div ref={glowElRef} style={{ position: "absolute", inset: "8%", background: "radial-gradient(circle, rgba(57,230,115,0.65) 0%, rgba(57,230,115,0.3) 45%, transparent 75%)", filter: "blur(36px)", pointerEvents: "none", willChange: "transform, opacity" }} />
            </div>
            {/* tick-mark dial ring behind the orb — a bit of HUD/instrument-panel flair. Independently adjustable via the edit panel. */}
            <div style={{ position: "absolute", inset: 0, transform: isDesktopViewport ? `scale(1.14)` : "none" }}>
              <svg className="neo-ring-size" viewBox="0 0 400 400" style={{ position: "absolute", inset: "-6%", width: "112%", height: "112%", pointerEvents: "none" }}>
                <circle cx="200" cy="200" r="196" fill="none" stroke="rgba(57,230,115,0.18)" strokeWidth="1" />
                <circle cx="200" cy="200" r="182" fill="none" stroke="rgba(57,230,115,0.14)" strokeWidth="1" strokeDasharray="1,7" />
                {Array.from({ length: 48 }, (_, i) => {
                  const a = (Math.PI * 2 * i) / 48;
                  const isMajor = i % 4 === 0;
                  const r1 = isMajor ? 160 : 168;
                  const r2 = 178;
                  return (
                    <line key={i}
                      x1={200 + Math.cos(a) * r1} y1={200 + Math.sin(a) * r1}
                      x2={200 + Math.cos(a) * r2} y2={200 + Math.sin(a) * r2}
                      stroke={isMajor ? "rgba(120,255,160,0.5)" : "rgba(57,230,115,0.25)"}
                      strokeWidth={isMajor ? 2 : 1} />
                  );
                })}
                <circle cx="200" cy="200" r="148" fill="none" stroke="rgba(57,230,115,0.22)" strokeWidth="1" />
              </svg>
            </div>
            {showThinkingLabel && (
              <div className="absolute left-1/2 -translate-x-1/2 font-mono uppercase tracking-widest flex items-baseline"
                style={{ top: "-130px", color: amber, fontSize: "14px", letterSpacing: "5px", fontFamily: "'Orbitron', 'JetBrains Mono', monospace", fontWeight: 700, textShadow: `0 0 10px ${amber}aa`, animation: "neoThinkPulse 1.1s ease-in-out infinite", zIndex: 21 }}>
                THINKING
                <span style={{ display: "inline-block", width: "3px", height: "3px", borderRadius: "50%", background: amber, marginLeft: "6px", animation: "neoDotBlink 1.2s ease-in-out infinite" }} />
                <span style={{ display: "inline-block", width: "3px", height: "3px", borderRadius: "50%", background: amber, marginLeft: "3px", animation: "neoDotBlink 1.2s ease-in-out infinite 0.2s" }} />
                <span style={{ display: "inline-block", width: "3px", height: "3px", borderRadius: "50%", background: amber, marginLeft: "3px", animation: "neoDotBlink 1.2s ease-in-out infinite 0.4s" }} />
              </div>

function timeAgo(ts) {
  if (!ts) return "";
  const diffMs = Date.now() - ts;
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function NotificationBell({ model, cards, tasks, trends, agency, models, persistModels, onNavigate }) {
  const [open, setOpen] = useState(false);
  const [frozen, setFrozen] = useState(null);
  const { value: changelogEntries } = useSupaChangelog();
  const bellRef = useRef(null);
  const lastSeen = model?.notifLastSeen || 0;
  const myName = model?.name;

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (bellRef.current && !bellRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);

  const newIdeas = cards.filter((c) => c.model === myName && c.source === "team" && c.createdAt > lastSeen);
  const newCalendar = tasks.filter((t) => t.model === myName && t.createdAt > lastSeen);
  const newTrends = trends.filter((t) => (agency === "US" ? t.showUS : t.showCZ) && t.createdAt > lastSeen);
  const newChangelog = changelogEntries.filter((e) => new Date(e.createdAt).getTime() > lastSeen);
  const live = { newIdeas, newCalendar, newTrends, newChangelog };
  const total = newIdeas.length + newCalendar.length + newTrends.length + newChangelog.length;

  const markAllRead = async () => {
    if (total > 0) {
      await persistModels(models.map((m) => (m.name === myName ? { ...m, notifLastSeen: Date.now() } : m)));
    }
  };

  const toggle = async () => {
    if (!open) {
      setFrozen(live); // snapshot what's new before marking as seen, so items don't disappear mid-view
      setOpen(true);
    } else {
      setOpen(false);
    }
  };

  const shown = frozen || live;
  const shownTotal = shown.newIdeas.length + shown.newCalendar.length + shown.newTrends.length + shown.newChangelog.length;

  return (
    <div className="relative" ref={bellRef}>
      <button onClick={toggle} className="tap relative p-1.5 rounded-lg c-muted hover-text-primary hover-bg-surface transition-colors">
        <Bell size={16} />
        {total > 0 && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[15px] h-[15px] px-1 rounded-full c-bg-accent c-onaccent fs-9 font-mono font-bold flex items-center justify-center">
            {total > 9 ? "9+" : total}
          </span>
        )}
      </button>
      {open && (
        <div className="fixed left-3 right-3 top-14 sm:absolute sm:left-auto sm:top-full sm:right-0 sm:mt-2 sm:w-80 c-bg-surface border c-border rounded-xl shadow-2xl z-50 overflow-hidden">
          <div className="flex items-center justify-between px-3 py-2.5 border-b c-border">
            <div className="flex items-center gap-2">
              <span className="fs-13 font-semibold c-text">Notifications</span>
              {total > 0 && (
                <span className="fs-9 font-mono font-bold px-1.5 py-0.5 rounded-full c-bg-accent c-onaccent">{total > 99 ? "99+" : total}</span>
              )}
            </div>
            {total > 0 && (
              <button onClick={markAllRead} className="fs-10 font-mono c-accent hover-accent-text tap">Mark all read</button>
            )}
          </div>
          <div className="max-h-80 overflow-y-auto p-2">
            {shownTotal === 0 && (
              <div className="fs-12 c-faint font-mono italic text-center py-6">You're all caught up.</div>
            )}
            {shown.newIdeas.map((c) => (
              <button key={c.id} onClick={() => { onNavigate("content"); setOpen(false); }}
                className="w-full flex items-start gap-2.5 text-left px-2.5 py-2.5 rounded-lg hover-bg-app transition-colors">
                <Film size={16} className="c-accent flex-shrink-0 mt-0.5" />
                <div className="flex-1 min-w-0">
                  <div className="fs-12 font-semibold c-text">New idea</div>
                  <div className="fs-11 c-muted truncate">{c.title || "Untitled scene"}</div>
                </div>
                <div className="flex flex-col items-end gap-1 flex-shrink-0">
                  <span className="fs-9 font-mono c-faint">{timeAgo(c.createdAt)}</span>
                  {c.createdAt > lastSeen && <span className="w-1.5 h-1.5 rounded-full" style={{ background: "#ffb432" }} />}
                </div>
              </button>
            ))}
            {shown.newCalendar.map((t) => (
              <button key={t.id} onClick={() => { onNavigate("calendar"); setOpen(false); }}
                className="w-full flex items-start gap-2.5 text-left px-2.5 py-2.5 rounded-lg hover-bg-app transition-colors">
                <Calendar size={16} className="c-success flex-shrink-0 mt-0.5" />

// Team/admin version of the notification bell — flags things that need
// attention right now (overdue tasks, ideas nobody's picked up) rather than
// tracking a per-model "seen" timestamp like the creator one does. "Mark all
// read" is session-only (dismissed set, not persisted) since Team logins
// share one PIN rather than individual accounts.
function AdminNotificationBell({ cards, tasks, onNavigate }) {
  const [open, setOpen] = useState(false);
  const { value: dismissedArr, persist: persistDismissedArr } = useSupaAppState("admin_notif_dismissed", []);
  const dismissed = new Set(dismissedArr);
  const { value: changelogEntries } = useSupaChangelog();
  const bellRef = useRef(null);

  const persistDismissed = (nextSet) => {
    persistDismissedArr([...nextSet]);
  };

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (bellRef.current && !bellRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);

  const overdueAll = tasks.filter((t) => t.status !== "done" && t.dueDate && t.dueDate < todayISO());
  const stuckIdeasAll = cards.filter((c) => c.stage === "idea");
  const sevenDaysAgoTs = Date.now() - 7 * 24 * 60 * 60 * 1000;
  const recentChangelogAll = changelogEntries.filter((e) => new Date(e.createdAt).getTime() > sevenDaysAgoTs);
  const overdue = overdueAll.filter((t) => !dismissed.has(`t_${t.id}`));
  const stuckIdeas = stuckIdeasAll.filter((c) => !dismissed.has(`c_${c.id}`));
  const recentChangelog = recentChangelogAll.filter((e) => !dismissed.has(`w_${e.id}`));
  const total = overdue.length + stuckIdeas.length + recentChangelog.length;

  const markAllRead = () => {
    persistDismissed(new Set([
      ...overdueAll.map((t) => `t_${t.id}`),
      ...stuckIdeasAll.map((c) => `c_${c.id}`),
      ...recentChangelogAll.map((e) => `w_${e.id}`),
    ]));
  };

  return (
    <div className="relative" ref={bellRef}>
      <button onClick={() => setOpen((v) => !v)} className="tap relative p-1.5 rounded-lg c-muted hover-text-primary hover-bg-surface transition-colors">
        <Bell size={16} />
        {total > 0 && (
          <span className="absolute -top-0.5 -right-0.5 min-w-[15px] h-[15px] px-1 rounded-full c-bg-accent c-onaccent fs-9 font-mono font-bold flex items-center justify-center">
            {total > 9 ? "9+" : total}
          </span>
        )}
      </button>
      {open && (
        <div className="fixed left-3 right-3 top-14 sm:absolute sm:left-auto sm:top-full sm:right-0 sm:mt-2 sm:w-80 c-bg-surface border c-border rounded-xl shadow-2xl z-50 overflow-hidden">
          <div className="flex items-center justify-between px-3 py-2.5 border-b c-border">
            <div className="flex items-center gap-2">
              <span className="fs-13 font-semibold c-text">Notifications</span>
              {total > 0 && (
                <span className="fs-9 font-mono font-bold px-1.5 py-0.5 rounded-full c-bg-accent c-onaccent">{total > 99 ? "99+" : total}</span>
              )}
            </div>
            {total > 0 && (
              <button onClick={markAllRead} className="fs-10 font-mono c-accent hover-accent-text tap">Mark all read</button>
            )}
          </div>
          <div className="max-h-80 overflow-y-auto p-2">
            {total === 0 && <div className="fs-12 c-faint font-mono italic text-center py-6">Nothing needs attention.</div>}
            {overdue.map((t) => (
              <button key={t.id} onClick={() => { onNavigate("tasks"); setOpen(false); }}
                className="w-full flex items-start gap-2.5 text-left px-2.5 py-2.5 rounded-lg hover-bg-app transition-colors">
                <Calendar size={16} style={{ color: "#E2725B" }} className="flex-shrink-0 mt-0.5" />
                <div className="flex-1 min-w-0">
                  <div className="fs-12 font-semibold c-text">Overdue</div>
                  <div className="fs-11 c-muted truncate">{t.title}{t.model ? ` — ${t.model}` : ""}</div>
                </div>
                <span className="fs-9 font-mono c-faint flex-shrink-0">{fmtDay(t.dueDate)}</span>
              </button>
            ))}
            {stuckIdeas.map((c) => (
              <button key={c.id} onClick={() => { onNavigate("content"); setOpen(false); }}
                className="w-full flex items-start gap-2.5 text-left px-2.5 py-2.5 rounded-lg hover-bg-app transition-colors">
                <Film size={16} className="c-accent flex-shrink-0 mt-0.5" />
                <div className="flex-1 min-w-0">
                  <div className="fs-12 font-semibold c-text">Idea, unclaimed</div>
                  <div className="fs-11 c-muted truncate">{c.title || "Untitled scene"}{c.model ? ` — ${c.model}` : ""}</div>
                </div>
              </button>
            ))}
            {recentChangelog.map((e) => (
              <button key={e.id} onClick={() => { onNavigate("whatsnew"); setOpen(false); }}
                className="w-full flex items-start gap-2.5 text-left px-2.5 py-2.5 rounded-lg hover-bg-app transition-colors">

                  <div className="fs-12 font-semibold c-text">OF News</div>
                  <div className="fs-11 c-muted truncate">{e.title}</div>
                </div>
                <span className="fs-9 font-mono c-faint flex-shrink-0">{timeAgo(new Date(e.createdAt).getTime())}</span>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// Global search across cards, tasks, models, and trends — click the icon to
// open a small dropdown search box, results are grouped and clickable.
function GlobalSearch({ cards, tasks, models, trends, onNavigate, trendsNavId, showModels, showTrends, navItems }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ref = useRef(null);

  useEffect(() => {
    if (!open) return;
    const onDocClick = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", onDocClick);
    return () => document.removeEventListener("mousedown", onDocClick);
  }, [open]);

  const query = q.trim().toLowerCase();
  const matchPages = query ? (navItems || []).filter((n) => n.label.toLowerCase().includes(query)).slice(0, 5) : [];
  const matchCards = query ? cards.filter((c) => (c.title || "").toLowerCase().includes(query)).slice(0, 5) : [];
  const matchTasks = query ? tasks.filter((t) => (t.title || "").toLowerCase().includes(query)).slice(0, 5) : [];
  const matchModels = query && showModels ? models.filter((m) => (m.name || "").toLowerCase().includes(query)).slice(0, 5) : [];
  const matchTrends = query && showTrends ? trends.filter((t) =>
    (t.caption || "").toLowerCase().includes(query) || (t.profile || "").toLowerCase().includes(query) || (t.category || "").toLowerCase().includes(query)
  ).slice(0, 5) : [];
  const totalMatches = matchPages.length + matchCards.length + matchTasks.length + matchModels.length + matchTrends.length;

  const go = (view) => { onNavigate(view); setOpen(false); setQ(""); };

  return (
    <div className="relative" ref={ref}>
      <button onClick={() => setOpen((v) => !v)}
        className="tap flex items-center gap-1.5 px-3 py-1.5 rounded-full border c-border c-muted hover-text-primary hover-bg-surface transition-colors">
        <Search size={14} />
        <span className="fs-12 font-mono">Search</span>
      </button>
      {open && (
        <div className="fixed left-3 right-3 top-14 sm:absolute sm:left-auto sm:top-full sm:right-0 sm:mt-2 sm:w-80 c-bg-surface border c-border rounded-xl shadow-2xl z-50 p-2">
          <input autoFocus value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search pages, scenes, tasks, models, trends..."
            className="w-full c-bg-app border c-border rounded-lg px-2.5 py-2 text-sm c-text outline-none focus-border-accent mb-1" />
          {query && totalMatches === 0 && <div className="fs-12 c-faint font-mono italic text-center py-4">No matches.</div>}
          <div className="max-h-72 overflow-y-auto">
            {matchPages.map((n) => (
              <button key={n.id} onClick={() => go(n.id)} className="w-full text-left px-2.5 py-2 rounded-lg hover-bg-app transition-colors">
                <div className="fs-10 font-mono uppercase" style={{ color: "#8b93a1" }}>Page</div>
                <div className="fs-12 c-text">{n.label}</div>
              </button>
            ))}
            {matchCards.map((c) => (
              <button key={c.id} onClick={() => go("content")} className="w-full text-left px-2.5 py-2 rounded-lg hover-bg-app transition-colors">
                <div className="fs-10 font-mono uppercase c-accent">Scene</div>
                <div className="fs-12 c-text">{c.title}{c.model ? ` — ${c.model}` : ""}</div>
              </button>
            ))}
            {matchTasks.map((t) => (
              <button key={t.id} onClick={() => go("tasks")} className="w-full text-left px-2.5 py-2 rounded-lg hover-bg-app transition-colors">
                <div className="fs-10 font-mono uppercase c-success">Task</div>
                <div className="fs-12 c-text">{t.title}{t.model ? ` — ${t.model}` : ""}</div>
              </button>
            ))}
            {matchModels.map((m) => (
              <button key={m.name} onClick={() => go("models")} className="w-full text-left px-2.5 py-2 rounded-lg hover-bg-app transition-colors">
                <div className="fs-10 font-mono uppercase c-accent">Model</div>
                <div className="fs-12 c-text">{m.name}</div>
              </button>
            ))}
            {matchTrends.map((t) => (
              <button key={t.id} onClick={() => go(trendsNavId)} className="w-full text-left px-2.5 py-2 rounded-lg hover-bg-app transition-colors">
                <div className="fs-10 font-mono uppercase" style={{ color: "#E2725B" }}>Trend</div>
                <div className="fs-12 c-text">@{t.profile}{t.category ? ` — ${t.category}` : ""}</div>
              </button>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ---------- creator dashboard ----------

function DeltaTag({ current, previous }) {
  if (previous === undefined || previous === null) return null;
  const diff = current - previous;
  const pct = previous !== 0 ? (diff / previous) * 100 : 0;
  if (diff === 0) return <span className="flex items-center gap-0.5 fs-10 font-mono c-muted"><Minus size={10} />0%</span>;
  const up = diff > 0;
  return (
    <span className={`flex items-center gap-0.5 fs-10 font-mono ${up ? "c-success" : "c-warn"}`}>
      {up ? <TrendingUp size={10} /> : <TrendingDown size={10} />}
      {up ? "+" : ""}{pct.toFixed(0)}%
    </span>
  );
}

function StatCardBig({ icon: Icon, label, value, delta, color }) {
  return (
    <div className="c-bg-surface border c-border rounded-xl p-4 flex-1 minw-150">
      <div className="flex items-center justify-between mb-2">
        <Icon size={15} style={{ color }} />
        {delta}
      </div>
      <div className="fs-10 uppercase tracking-widest c-muted font-mono mb-1">{label}</div>
      <div className="text-xl md:text-2xl font-semibold c-text">{value}</div>
    </div>
  );
}

function GoalCard({ latest }) {
  const goal = latest.earningsGoal || 0;
  const actual = latest.ofEarnings || 0;
  if (!goal) return null;
  const pct = Math.min(150, Math.round((actual / goal) * 100));
  const hit = actual >= goal;
  return (
    <div className="c-bg-surface border rounded-xl p-5 mb-6" style={{ borderColor: hit ? "#39e673" : undefined }}>
      <div className="flex items-center justify-between mb-2">
        <span className="fs-11 uppercase tracking-widest c-muted font-mono">This week's earnings goal</span>
        {hit && <span className="fs-11 font-mono c-success uppercase tracking-wide">🔥 Goal hit!</span>}
      </div>
      <div className="flex items-baseline gap-2 mb-3">
        <span className="text-3xl font-extrabold c-text">${actual.toLocaleString()}</span>
        <span className="c-faint fs-12 font-mono">/ ${goal.toLocaleString()} goal</span>
      </div>
      <div className="h-3 c-bg-app rounded-full overflow-hidden">
        <div className="h-full rounded-full" style={{ width: `${Math.min(100, pct)}%`, backgroundColor: hit ? "#39e673" : "#12b34c", transition: "width 0.6s ease" }} />
      </div>
      <div className="fs-11 font-mono c-faint mt-1.5">{pct}% of goal{hit ? ", nice work" : ""}</div>
    </div>
  );
}

function ThisWeeksAsks({ tasks, restrictModel, onNavigate }) {
  const open = tasks.filter((t) => t.model === restrictModel && t.status !== "done")
    .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  if (open.length === 0) return null;
  return (
    <div className="c-bg-surface border c-border rounded-xl p-4 mb-6">
      <div className="flex items-center justify-between mb-3">
        <span className="fs-11 uppercase tracking-widest c-muted font-mono">This week, we need from you</span>
        <button onClick={() => onNavigate("tasks")} className="fs-11 font-mono uppercase c-accent hover:underline">All tasks →</button>
      </div>
      <div className="space-y-2">
        {open.slice(0, 5).map((t) => (
          <div key={t.id} className="flex items-center gap-2 text-sm">
            <CheckSquare size={14} className="c-faint flex-shrink-0" />
            <span className="c-text flex-1">{t.title}</span>
            {t.dueDate && <span className="fs-10 font-mono c-faint">{fmtDay(t.dueDate)}</span>}
          </div>
        ))}
      </div>

}

function useSupaOfDailyStats() {
  const [value, setValue] = useState([]);
  const [loading, setLoading] = useState(true);
  useEffect(() => {
    (async () => {
      setLoading(true);
      try {
        const { data, error } = await supabaseClient.from("of_daily_stats").select("*");
        if (error) throw error;
        setValue((data || []).map((r) => ({
          id: r.id, model: r.model, statDate: r.stat_date, earnings: r.earnings || 0,
          fansChatted: r.fans_chatted || 0, ppvsSent: r.ppvs_sent || 0, ppvsUnlocked: r.ppvs_unlocked || 0,
          newSubs: r.new_subs || 0, syncedAt: r.synced_at,
        })));
      } catch (e) {
        console.error("load failed for of_daily_stats", e);
        setValue([]);
      }
      setLoading(false);
    })();
  }, []);
  return { value, loading };
}

function useSupaChangelog() {
  const [value, setValue] = useState([]);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data, error } = await supabaseClient.from("changelog").select("*").order("created_at", { ascending: false });
      if (error) throw error;
      setValue((data || []).map((r) => ({
        id: r.id, title: r.title, description: r.description || "",
        category: r.category || "improvement", createdAt: r.created_at,
      })));
    } catch (e) {
      console.error("load failed for changelog", e);
      setValue([]);
    }
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const addEntry = async ({ title, description, category }) => {
    const id = `cl_manual_${Date.now()}`;
    const { error } = await supabaseClient.from("changelog").insert({
      id, title, description: description || "", category: category || "improvement",
    });
    if (error) throw error;
    await load();
  };

  return { value, loading, reload: load, addEntry };
}

function useSupaInflowwDailyStats() {
  const [value, setValue] = useState([]);
  const [loading, setLoading] = useState(true);
  const [syncing, setSyncing] = useState(false);

  const load = useCallback(async () => {
    try {
      const { data, error } = await supabaseClient.from("infloww_daily_stats").select("*");
      if (error) throw error;
      setValue((data || []).map((r) => ({
        id: r.id, model: r.model, accountType: r.account_type || "paid", statDate: r.stat_date,
        earningsNet: Number(r.earnings_net) || 0, earningsGross: Number(r.earnings_gross) || 0,
        transactionCount: r.transaction_count || 0, messagesCount: r.messages_count || 0,
        tipsCount: r.tips_count || 0, subsCount: r.subs_count || 0, syncedAt: r.synced_at,
        messagesNet: Number(r.messages_net) || 0, tipsNet: Number(r.tips_net) || 0, subsNet: Number(r.subs_net) || 0,
        refundsNet: Number(r.refunds_net) || 0,
        automatedMessagesCount: r.automated_messages_count || 0, automatedMessagesNet: Number(r.automated_messages_net) || 0,
        priorityMassMessagesCount: r.priority_mass_messages_count || 0, priorityMassMessagesNet: Number(r.priority_mass_messages_net) || 0,
        trackingLinksCount: r.tracking_links_count || 0,
        activeFans: r.active_fans, expiredFans: r.expired_fans,
        newSubscribers: r.new_subscribers, subscriberRenewals: r.subscriber_renewals,
        fansWithRenewOn: r.fans_with_renew_on, avgSubscriptionLengthDays: r.avg_subscription_length_days != null ? Number(r.avg_subscription_length_days) : null,
        profileVisitors: r.profile_visitors, guestProfileVisitors: r.guest_profile_visitors, loggedInProfileVisitors: r.logged_in_profile_visitors,
        performanceRank: r.performance_rank,
        replyTimeMs: r.reply_time_ms, fansChatted: r.fans_chatted, dailyMessagesSent: r.daily_messages_sent, ppvsSent: r.ppvs_sent,
      })));
    } catch (e) {
      console.error("load failed for infloww_daily_stats", e);
      setValue([]);
    }
  }, []);

  useEffect(() => {
    (async () => { setLoading(true); await load(); setLoading(false); })();
  }, [load]);

  // Manual refresh: pokes the infloww-sync Edge Function (the same job that runs on its
  // own schedule) so today's numbers pull fresh from Infloww right now, then re-reads
  // the table once that finishes instead of waiting for the next scheduled sync.
  const refresh = useCallback(async () => {
    setSyncing(true);
    try {
      const r = await fetch(`${SUPABASE_URL}/functions/v1/infloww-sync`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${SUPABASE_ANON_KEY}` },
        body: "{}",
      });
      if (!r.ok) throw new Error(`infloww-sync: HTTP ${r.status}`);
    } catch (e) {
      console.error("infloww-sync failed", e);
    }
    await load();
    setSyncing(false);
  }, [load]);

  return { value, loading, syncing, refresh };
}

// Defined at module scope (not inline inside CreatorDashboard's render body) so
// it keeps a stable identity across CreatorDashboard re-renders — an inline
// component gets a fresh function identity every render, which makes React
// treat it as a brand-new component type and remount it, discarding this
// card's own range state (the 7D/30D toggle) every time the parent re-renders.
function InflowwRevenueCard({ myInflowwRows, accountType, title, last7Dates, dayList30, sumInfloww }) {
  const rowsAll = myInflowwRows.filter((r) => r.accountType === accountType);
  const [range, setRange] = useState(7);
  if (!rowsAll.length) return null;
  const days = range === 7 ? last7Dates : dayList30;
  const sumForDay = (day) => rowsAll.filter((r) => r.statDate === day).reduce((t, r) => t + (r.earningsNet || 0), 0);
  const chartData = days.map((day) => ({ date: day, value: sumForDay(day) }));
  const rangeTotal = chartData.reduce((t, d) => t + d.value, 0);
  const prevDays = (range === 7
    ? Array.from({ length: 7 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return d.toISOString().slice(0, 10); })
    : Array.from({ length: 30 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (59 - i)); return d.toISOString().slice(0, 10); }));
  const prevTotal = prevDays.reduce((t, day) => t + sumForDay(day), 0);
  const rangeRows = rowsAll.filter((r) => days.includes(r.statDate));

  return (
    <div className="c-bg-surface border c-border rounded-xl p-4 mb-3">
      <div className="flex items-center justify-between mb-1 flex-wrap gap-2">
        <span className="fs-10 uppercase tracking-widest c-muted font-mono">
          {title}
          <span className="fs-9 ml-2 normal-case c-muted" style={{ opacity: 0.6 }}>· synced hourly</span>
        </span>
        <div className="flex items-center gap-2">
          <DeltaTag current={rangeTotal} previous={prevTotal} />
          <div className="flex rounded-lg border c-border overflow-hidden">
            {[7, 30].map((n) => (
              <button key={n} onClick={() => setRange(n)}
                className={`tap px-2 py-0.5 fs-9 font-mono uppercase transition-colors ${range === n ? "c-bg-accent c-onaccent" : "c-muted hover-bg-surface"}`}>
                {n}D
              </button>
            ))}
          </div>
        </div>
      </div>
      <div className="text-2xl font-extrabold c-accent mb-1">$<CountUp value={rangeTotal} /></div>
      <div className="mb-2"><RevenueChart data={chartData} height={200} /></div>
      <div className="flex gap-4 fs-10 font-mono c-faint uppercase">
        <span><CountUp value={sumInfloww(rangeRows, "messagesCount")} /> messages</span>
        <span><CountUp value={sumInfloww(rangeRows, "tipsCount")} /> tips</span>
        <span><CountUp value={sumInfloww(rangeRows, "subsCount")} /> subs</span>
      </div>
    </div>
  );
}

function CreatorDashboard({ stats, tasks, restrictModel, onNavigate, bufferDailyStats, bufferTopPosts, ofDailyStats, inflowwDailyStats }) {
  const mine = stats.filter((s) => s.model === restrictModel).sort((a, b) => b.weekOf.localeCompare(a.weekOf));
  const latest = mine[0];
  const prev = mine[1];

  const sevenDaysAgo = new Date();
  sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
  const sevenDaysAgoStr = sevenDaysAgo.toISOString().slice(0, 10);

  const todayStr = new Date().toISOString().slice(0, 10);
  const monthStr = todayStr.slice(0, 7);
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayStr = yesterday.toISOString().slice(0, 10);
  const last7Dates = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (6 - i)); return d.toISOString().slice(0, 10);
  });

  const myInflowwRows = (inflowwDailyStats || []).filter((r) => r.model === restrictModel);
  const sumInfloww = (rows, field) => rows.reduce((t, r) => t + (r[field] || 0), 0);
  const thirtyDaysAgo = new Date();
  thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
  const thirtyDaysAgoStr = thirtyDaysAgo.toISOString().slice(0, 10);

  const dayList30 = Array.from({ length: 30 }, (_, i) => {
    const d = new Date(); d.setDate(d.getDate() - (29 - i)); return d.toISOString().slice(0, 10);
  });

  const hasFreeInfloww = myInflowwRows.some((r) => r.accountType === "free");
  const hasPaidInfloww = myInflowwRows.some((r) => r.accountType === "paid");
  const inflowwSection = (hasFreeInfloww || hasPaidInfloww) && (
    <div className="mb-6">
      {hasPaidInfloww && <InflowwRevenueCard myInflowwRows={myInflowwRows} last7Dates={last7Dates} dayList30={dayList30} sumInfloww={sumInfloww} accountType="paid" title="OnlyFans · Paid" />}

    </div>
  );
  const myBufferRows = (bufferDailyStats || []).filter((r) => r.model === restrictModel && r.statDate >= sevenDaysAgoStr);
  const platformTotals = {};
  myBufferRows.forEach((r) => {
    const p = platformTotals[r.platform] || { platform: r.platform, impressions: 0, comments: 0, reactions: 0, reposts: 0, postCount: 0 };
    p.impressions += r.impressions; p.comments += r.comments; p.reactions += r.reactions; p.reposts += r.reposts; p.postCount += r.postCount;
    platformTotals[r.platform] = p;
  });
  const platformLabel = { ig: "Instagram", x: "X", tiktok: "TikTok", fb: "Facebook" };
  // X gets the rich panel (chart + post of the week) below instead of a plain tile here.
  const otherPlatformTotals = Object.values(platformTotals).filter((p) => p.platform !== "x");
  const bufferSection = otherPlatformTotals.length > 0 && (
    <div className="flex gap-3 flex-wrap mb-6">
      {otherPlatformTotals.map((p) => (
        <div key={p.platform} className="c-bg-surface border c-border rounded-xl px-4 py-3.5 flex-1 minw-180 hover-lift">
          <div className="fs-10 uppercase tracking-widest c-muted font-mono mb-2">This week on {platformLabel[p.platform] || p.platform}</div>
          <div className="flex gap-4">
            <div>
              <div className="text-xl font-semibold c-text"><CountUp value={p.impressions} /></div>
              <div className="fs-9 c-faint font-mono uppercase">impressions</div>
            </div>
            <div>
              <div className="text-xl font-semibold c-text"><CountUp value={p.comments} /></div>
              <div className="fs-9 c-faint font-mono uppercase">replies</div>
            </div>
            <div>
              <div className="text-xl font-semibold c-text"><CountUp value={p.reactions} /></div>
              <div className="fs-9 c-faint font-mono uppercase">reactions</div>
            </div>
            <div>
              <div className="text-xl font-semibold c-text"><CountUp value={p.postCount} /></div>
              <div className="fs-9 c-faint font-mono uppercase">posts</div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );

  if (!latest) {
    return (
      <div className="creator-glow-scope">
        <ThisWeeksAsks tasks={tasks} restrictModel={restrictModel} onNavigate={onNavigate} />
        {inflowwSection}
        <CreatorInsightsSection models={[{ name: restrictModel }]} inflowwDailyStats={inflowwDailyStats} days={30} periodLabel="30d" />
        <XStatsSection models={[{ name: restrictModel }]} bufferDailyStats={bufferDailyStats} bufferTopPosts={bufferTopPosts} restrictModel={restrictModel} />
        {bufferSection}
        <div className="fs-12 c-faint font-mono italic py-16 text-center border border-dashed c-border rounded-xl">
          No stats yet. Ask your manager to add this week's numbers.
        </div>
      </div>

  }

  return (
    <div className="creator-glow-scope">
      <GoalCard latest={latest} />
      <ThisWeeksAsks tasks={tasks} restrictModel={restrictModel} onNavigate={onNavigate} />
      {inflowwSection}
      <CreatorInsightsSection models={[{ name: restrictModel }]} inflowwDailyStats={inflowwDailyStats} days={30} periodLabel="30d" />
      <XStatsSection models={[{ name: restrictModel }]} bufferDailyStats={bufferDailyStats} bufferTopPosts={bufferTopPosts} restrictModel={restrictModel} />
      {bufferSection}

      <div className="flex gap-3 flex-wrap mb-6">
        <StatCardBig icon={DollarSign} label="OF earnings this week" value={`$${latest.ofEarnings.toLocaleString()}`}

        <StatCardBig icon={Users} label="OF subscribers" value={latest.ofSubs.toLocaleString()}

      <div className="c-bg-surface border c-border rounded-xl p-4">
        <span className="fs-11 uppercase tracking-widest c-muted font-mono mb-3 block">History</span>

function OnboardingScreen({ name, url, onContinue, onQuestionnaireReceived }) {
  const [received, setReceived] = useState(false);

  useEffect(() => {
    function handleMessage(event) {
      const data = event.data;
      if (!data || data.source !== "creator-bible") return;
      if (data.type === "submitted") {
        onQuestionnaireReceived(data.celyFormular || data.chatterSheet || "");
        setReceived(true);
        setTimeout(() => setReceived(false), 4000);
      } else if (data.type === "continue") {
        onContinue();
      }
    }
    window.addEventListener("message", handleMessage);
    return () => window.removeEventListener("message", handleMessage);
  }, [onContinue, onQuestionnaireReceived]);

  return (
    <div className="c-bg-app" style={{ fontFamily: "Inter, sans-serif", height: "100vh", display: "flex", flexDirection: "column", overflow: "hidden" }}>

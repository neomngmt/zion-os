.mono{ font-family:'JetBrains Mono', monospace; }
.wrap{ max-width:1180px; margin:0 auto; padding:0 32px; }
a{ color:inherit; }
a:focus-visible, button:focus-visible{ outline:2px solid var(--lp-green); outline-offset:3px; }
@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }

/* ---------- nav ---------- */
.nav{ display:flex; align-items:center; justify-content:space-between; padding:26px 0; }
.nav .brand{ display:flex; align-items:center; gap:11px; font-size:16px; font-weight:700; letter-spacing:2.5px; cursor:pointer; }
.nav .brand .mark{ width:22px; height:22px; position:relative; }
.nav .brand .mark svg{ width:100%; height:100%; }
.nav .links{ display:flex; gap:38px; font-size:14px; color:var(--lp-text-dim); }
.nav .links a{ text-decoration:none; transition:color .15s; }
.nav .links a:hover{ color:var(--lp-text); }
.nav .right{ display:flex; align-items:center; gap:22px; }
.nav .signin{ font-size:14px; color:var(--lp-text-dim); text-decoration:none; }
.nav .cta{
  font-size:14px; font-weight:600; color:#04140c;
  background:linear-gradient(135deg, var(--lp-green-soft), var(--lp-green));
  padding:10px 20px; border-radius:999px; text-decoration:none;
}
@media (max-width:860px){
  .nav{ flex-wrap:wrap; row-gap:14px; }
  .nav .links{ order:3; width:100%; justify-content:center; gap:24px; font-size:13px; }
}
@media (min-width:861px){
  .nav .brand{ font-size:21px; gap:14px; }
  .nav .brand .mark{ width:29px; height:29px; }
}

/* ---------- hero ---------- */
.hero{ padding:100px 0 0; text-align:center; }
.hero .eyebrow{
  font-size:12px; letter-spacing:3px; color:var(--lp-text-dim);
  display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:34px;
}
.hero .eyebrow::before, .hero .eyebrow::after{ content:""; width:34px; height:1px; background:var(--lp-border); }
.hero h1{
  font-size:clamp(38px, 6.4vw, 68px); font-weight:800; line-height:1.08; letter-spacing:-0.02em;
  max-width:920px; margin:0 auto 8px;
}
.hero h1 .script{
  display:block; font-family:'Playfair Display', serif; font-style:italic; font-weight:700;
  background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  margin-top:6px;
}
.hero p{ font-size:18px; color:var(--lp-text-dim); max-width:600px; margin:26px auto 38px; line-height:1.65; }
.hero-ctas{ display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
.btn-primary{
  font-size:14px; font-weight:700; color:#04140c;
  background:linear-gradient(135deg, var(--lp-green-soft), var(--lp-green));
  padding:16px 30px; border-radius:999px; text-decoration:none;
  box-shadow:0 0 26px var(--lp-green-glow);
}
.btn-ghost{
  font-size:14px; font-weight:600; color:var(--lp-text);
  border:1px solid var(--lp-border); padding:16px 30px; border-radius:999px; text-decoration:none;
}
.hero-note{ margin-top:20px; font-size:12px; letter-spacing:1.5px; color:var(--lp-text-dim); }
.hero-note b{ color:var(--lp-green); }

/* ---------- live floor panel ---------- */
.floor{ margin:70px auto 0; max-width:1120px; }
.floor-tilt{
  border:1px solid var(--lp-border); border-radius:12px;
  background:linear-gradient(180deg, rgba(18,179,76,0.05), transparent 40%), var(--lp-panel);
  padding:26px 30px 30px;
  transform:perspective(1400px) rotateX(10deg);
  transform-origin:center bottom;
  box-shadow:0 0 50px rgba(57,255,160,0.14), 0 35px 70px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(57,255,160,0.08);
}
@media (max-width:900px){ .floor-tilt{ transform:none; box-shadow:none; } }
.floor-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
.floor-head .label{ font-size:11px; letter-spacing:2px; color:var(--lp-text-dim); }
.floor-head .live{ font-size:11px; letter-spacing:2px; color:var(--lp-green); display:flex; align-items:center; gap:8px; }
.dot{ width:7px; height:7px; border-radius:50%; background:var(--lp-green); box-shadow:0 0 8px var(--lp-green); animation:pulse 1.8s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.4; } }
.floor-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--lp-border); border-radius:8px; overflow:hidden; }
.floor-cell{ background:var(--lp-panel); padding:22px 20px; }
.floor-cell .k{ font-size:11px; letter-spacing:1.2px; color:var(--lp-text-dim); margin-bottom:12px; display:flex; justify-content:space-between; }
.floor-cell .v{ font-size:28px; font-weight:700; }
.floor-cell .sub{ font-size:12px; color:var(--lp-text-dim); margin-top:8px; }
@media (max-width:760px){ .floor-grid{ grid-template-columns:repeat(2,1fr); } }

.floor-ticker{ margin-top:1px; border-top:1px solid var(--lp-border); overflow:hidden; }
.floor-ticker-track{ display:flex; white-space:nowrap; padding:15px 0; animation:scroll-left 24s linear infinite; }
.floor-ticker-track span{ font-size:11.5px; letter-spacing:1px; color:var(--lp-text-dim); padding:0 26px; flex-shrink:0; }
.floor-ticker-track span b{ color:var(--lp-green); font-weight:600; }

.band{ width:100vw; position:relative; left:50%; margin-left:-50vw; border-top:1px solid var(--lp-border); border-bottom:1px solid var(--lp-border); background:linear-gradient(180deg, rgba(18,179,76,0.04), transparent 60%); overflow:hidden; margin-top:74px; }
.band-track{ display:flex; white-space:nowrap; padding:22px 0; animation:scroll-left 38s linear infinite; }
.band-track span{ font-size:13px; letter-spacing:1.6px; color:var(--lp-text-dim); padding:0 38px; flex-shrink:0; }
.band-track span b{ color:var(--lp-green-soft); font-weight:700; }

@keyframes scroll-left{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

/* ---------- section shared ---------- */
.section{ padding:100px 0; }
.section-head{ text-align:center; max-width:640px; margin:0 auto 60px; }
.section-head .tag{ font-size:11px; letter-spacing:3px; color:var(--lp-text-dim); margin-bottom:14px; }
.section-head h2{ font-size:clamp(26px,4vw,38px); font-weight:800; letter-spacing:-0.01em; }
.section-head h2 .script-inline{ display:block; font-family:'Playfair Display', serif; font-style:italic; font-weight:700; margin-top:6px; background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.section-sub{ color:var(--lp-text-dim); font-size:16px; margin-top:18px; line-height:1.6; }

.connector{ width:60px; height:240px; margin:0 auto; position:relative; }
.connector-svg{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.connector-path{ fill:none; stroke:url(#connector-grad); stroke-width:2; filter:drop-shadow(0 0 3px rgba(18,179,76,0.5)); }
.connector-dot{ position:absolute; top:0; left:50%; transform:translate(-50%,-50%); width:9px; height:9px; border-radius:50%; background:var(--lp-green); box-shadow:0 0 10px var(--lp-green); opacity:0; }
.connector.desktop-only{ display:none; }
@media (min-width:861px){ .connector.desktop-only{ display:block; } }
.connector.connector-fork{ width:100%; }
@media (max-width:860px){ .connector{ display:none; } }


.panel{ margin-top:0; border:1px solid var(--lp-border); border-radius:16px; background:linear-gradient(180deg, rgba(18,179,76,0.04), transparent 40%), var(--lp-panel); overflow:hidden; position:relative; transition:box-shadow .6s ease, border-color .6s ease; }
.panel::after{
  content:""; position:absolute; top:0; left:50%; width:36px; height:36px; margin:-18px 0 0 -18px;
  border-radius:50%; background:radial-gradient(circle, rgba(57,230,115,0.9), rgba(18,179,76,0.4) 40%, transparent 72%);
  opacity:0; transform:scale(0); pointer-events:none; z-index:5;
}
.panel.connector-lit::after{ animation:panel-ripple 1.3s ease-out; }
@keyframes panel-ripple{
  0%{ opacity:0.95; transform:scale(0.2); }
  60%{ opacity:0.5; }
  100%{ opacity:0; transform:scale(16); }
}
.panel.connector-lit{ border-color:var(--lp-green); box-shadow:0 0 44px rgba(18,179,76,0.32), inset 0 0 30px rgba(18,179,76,0.08); }
.instruments-grid::before{ transition:box-shadow .4s ease, background-color .4s ease, border-color .4s ease; }
.instruments-grid.connector-lit::before{ background:var(--lp-green); border-color:var(--lp-green); box-shadow:0 0 18px var(--lp-green); }

/* ---------- system map ---------- */
.map-panel{ padding:26px 30px 36px; }
.panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.panel-head .label{ font-size:11px; letter-spacing:2px; color:var(--lp-text-dim); }
.panel-head .meta{ font-size:11px; letter-spacing:2px; color:var(--lp-text-dim); }
.map-body{ position:relative; height:380px; }
.map-lines{ position:absolute; inset:0; width:100%; height:100%; }
.map-lines path{ fill:none; stroke:var(--lp-border); stroke-width:1.5; }
.map-rows{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; justify-content:space-around; max-width:360px; }
.map-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
.row-label{ font-size:14px; letter-spacing:1px; color:var(--lp-text); }
.row-sub{ font-size:11px; letter-spacing:1px; color:var(--lp-text-dim); margin-top:5px; }
.dot-node{ width:11px; height:11px; border-radius:50%; border:1.5px solid var(--lp-green-dim); background:var(--lp-bg); flex-shrink:0; }
.map-brain{ position:absolute; top:50%; right:8%; transform:translateY(-50%); z-index:1; }
.brain-ring{ width:150px; height:150px; border-radius:50%; border:1px dashed var(--lp-border); display:flex; align-items:center; justify-content:center; }
.brain-ring::before{ content:""; position:absolute; inset:14px; border-radius:50%; border:1px solid var(--lp-green-dim); background:radial-gradient(circle at 40% 30%, rgba(18,179,76,0.28), transparent 70%); }
.brain-orbit{ position:absolute; inset:-16px; border-radius:50%; animation:spin 5s linear infinite; }
.brain-dot{ position:absolute; top:-3px; left:50%; width:7px; height:7px; border-radius:50%; background:var(--lp-green-soft); box-shadow:0 0 10px var(--lp-green-soft); transform:translateX(-50%); }
@keyframes spin{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }
.brain-core{ position:absolute; inset:14px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', serif; font-style:italic; font-weight:700; font-size:20px; color:var(--lp-green-soft); text-align:center; }
@media (max-width:860px){
  .map-body{ height:auto; }
  .map-lines{ display:none; }
  .map-rows{ max-width:none; gap:18px; margin-bottom:36px; }
  .map-brain{ position:relative; top:auto; right:auto; transform:none; margin:0 auto; width:150px; }
}

/* ---------- instruments grid ---------- */
.instruments-grid{ display:grid; grid-template-columns:1fr 1fr; position:relative; }
.instruments-grid::before{
  content:""; position:absolute; top:0; left:50%; transform:translate(-50%,-50%);
  width:11px; height:11px; border-radius:50%; background:var(--lp-panel); border:1.5px solid var(--lp-green);
  box-shadow:0 0 8px var(--lp-green); z-index:2;
}
.instrument{ padding:38px 40px; border-bottom:1px solid var(--lp-border); position:relative; }
.instrument:nth-child(odd){ border-right:1px solid var(--lp-border); }
.instrument:nth-child(3), .instrument:nth-child(4){ border-bottom:none; }
.instrument-head{ display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:6px; }
.instrument-no{ font-family:'Playfair Display', serif; font-style:italic; font-weight:700; font-size:26px; color:var(--lp-green-soft); }
.arrow-btn{
  width:34px; height:34px; border-radius:50%; border:1px solid var(--lp-border); display:flex; align-items:center; justify-content:center;
  color:var(--lp-text-dim); text-decoration:none; font-size:14px; transition:border-color .18s ease, color .18s ease, transform .18s ease;
}
.arrow-btn:hover{ border-color:var(--lp-green); color:var(--lp-green); transform:translate(2px,2px); }
.instrument h3{ font-size:19px; font-weight:700; margin:6px 0 10px; }
.instrument p{ color:var(--lp-text-dim); font-size:14px; line-height:1.65; }
.instrument-tags{ font-size:11px; letter-spacing:1.5px; color:var(--lp-text-dim); margin-top:16px; }
@media (max-width:760px){
  .instruments-grid{ grid-template-columns:1fr; }
  .instrument:nth-child(odd){ border-right:none; }
  .instrument:nth-child(3){ border-bottom:1px solid var(--lp-border); }
}

/* ---------- script accent variants ---------- */
.script-accent{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:700;
  background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.connector.small{ height:120px; }
@media (max-width:760px){ .connector.small{ height:80px; } }

/* ---------- detail blocks (the floor) ---------- */
.detail-block{ display:grid; grid-template-columns:1fr 1fr; gap:60px; align-items:center; padding:56px 0; }
.detail-block.reverse .detail-text{ order:2; }
.detail-block.reverse .detail-visual{ order:1; }
.badge-pill{
  display:inline-block; font-size:11px; letter-spacing:1.5px; color:var(--lp-text-dim);
  border:1px solid var(--lp-border); padding:8px 16px; border-radius:999px; margin-bottom:22px;
}
.detail-text h3{ font-size:clamp(22px,3vw,30px); font-weight:800; letter-spacing:-0.01em; line-height:1.2; margin-bottom:16px; }
.detail-text h3 .script-inline{
  display:block; margin-top:2px; font-family:'Playfair Display', serif; font-style:italic; font-weight:700;
  background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.detail-text p{ color:var(--lp-text-dim); font-size:15px; line-height:1.7; margin-bottom:20px; }
.diamond-list{ list-style:none; }
.diamond-list li{ font-size:14px; color:var(--lp-text-dim); padding:8px 0 8px 22px; position:relative; }
.diamond-list li::before{ content:"◆"; position:absolute; left:0; top:9px; font-size:8px; color:var(--lp-green); }
.diamond-list li b{ color:var(--lp-text); font-weight:600; }
.quote-box{
  border-left:2px solid var(--lp-green-dim); padding:4px 0 4px 18px; margin-top:22px;
  font-family:'Playfair Display', serif; font-style:italic; color:var(--lp-text-dim); font-size:15px; line-height:1.6;
}
@media (max-width:900px){ .detail-block, .detail-block.reverse{ grid-template-columns:1fr; }
  .detail-block.reverse .detail-text, .detail-block.reverse .detail-visual{ order:initial; } }

/* roster panel */
.roster-panel{ padding:22px 24px; }
.roster-row{ display:flex; align-items:center; gap:14px; padding:14px 0; border-top:1px solid var(--lp-border); }
.roster-row:first-of-type{ border-top:none; }
.avatar-sq{ width:36px; height:36px; border-radius:9px; background:linear-gradient(135deg, var(--lp-green-dim), var(--lp-bg)); border:1px solid var(--lp-border); display:flex; align-items:center; justify-content:center; font-family:'Playfair Display', serif; font-style:italic; font-weight:700; color:var(--lp-green-soft); flex-shrink:0; }
.roster-name{ flex:1; min-width:0; }
.roster-name .name{ font-size:14px; font-weight:600; }
.roster-name .handle{ font-size:11px; color:var(--lp-text-dim); margin-top:2px; }
.status-dots{ display:flex; gap:4px; flex-shrink:0; }
.sd{ width:6px; height:6px; border-radius:50%; background:var(--lp-border); }
.sd.on{ background:var(--lp-green); box-shadow:0 0 6px var(--lp-green); }
.status-pill{ font-size:10.5px; letter-spacing:0.5px; padding:5px 11px; border-radius:999px; white-space:nowrap; flex-shrink:0; }
.status-pill.ok{ color:var(--lp-green-soft); background:rgba(18,179,76,0.12); }
.status-pill.warn{ color:#e2a15b; background:rgba(226,161,91,0.12); }

/* winner board panel */
.winner-panel{ padding:22px 24px; }
.winner-row{ display:flex; align-items:center; gap:14px; padding:13px 0; border-top:1px solid var(--lp-border); }
.winner-row:first-of-type{ border-top:none; }
.winner-row .rank{ font-size:12px; color:var(--lp-text-dim); width:20px; flex-shrink:0; }
.winner-row .thumb{ width:30px; height:30px; border-radius:6px; background:linear-gradient(135deg, var(--lp-green-dim), var(--lp-bg)); border:1px solid var(--lp-border); flex-shrink:0; }
.winner-label{ flex:1; font-size:13px; color:var(--lp-text); min-width:0; }
.winner-label .bar{ height:3px; background:var(--lp-border); border-radius:2px; margin-top:8px; overflow:hidden; }
.winner-label .bar span{ display:block; height:100%; background:linear-gradient(90deg, var(--lp-green-dim), var(--lp-green)); width:0%; transition:width 1.1s cubic-bezier(.2,.7,.3,1); }
.winner-row .score{ font-size:14px; font-weight:700; color:var(--lp-green-soft); flex-shrink:0; }
.winner-stat{ display:flex; align-items:center; gap:16px; margin-top:16px; padding:16px; border:1px solid var(--lp-border); border-radius:10px; background:rgba(18,179,76,0.04); }
.winner-stat .big{ font-size:26px; font-weight:700; color:var(--lp-green-soft); }
.winner-stat .lead{ font-size:13px; font-weight:600; }
.winner-stat .sub{ font-size:11px; color:var(--lp-text-dim); margin-top:3px; }

/* ledger panel */
.ledger-panel{ padding:22px 24px; }
.ledger-total{ font-size:30px; font-weight:800; margin:14px 0 4px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.ledger-total .delta{ font-size:11px; font-weight:600; padding:5px 10px; border-radius:999px; }
.ledger-total .delta.up{ color:var(--lp-green-soft); background:rgba(18,179,76,0.12); }
.ledger-chart{ width:100%; height:60px; margin:14px 0 6px; }
.ledger-chart polyline{ fill:none; stroke:var(--lp-green); stroke-width:2; }
.ledger-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--lp-border); font-size:13px; }
.ledger-row .who{ flex:1; }
.ledger-row .pct.up{ color:var(--lp-green-soft); }
.ledger-row .pct.down{ color:#e2725b; }
.ledger-row .amt{ color:var(--lp-text-dim); }

/* orb */
.orb-wrap{ display:flex; align-items:center; justify-content:center; padding:20px; }
.orb{ width:220px; height:220px; animation:spin-orb 22s linear infinite; }
.orb ellipse, .orb circle{ opacity:0.7; }
@keyframes spin-orb{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } }

/* neo orb — mirrors the real Neo assistant: dial ring + glow + wireframe sphere */
.neo-orb-wrap{ position:relative; width:260px; height:260px; margin:0 auto; }
.neo-orb-glow{
  position:absolute; inset:6%; border-radius:50%;
  background:radial-gradient(circle, rgba(57,230,115,0.55) 0%, rgba(57,230,115,0.22) 45%, transparent 75%);
  filter:blur(28px); animation:neoOrbBreathe 3.2s ease-in-out infinite;
}
.neo-orb-dial{ position:absolute; inset:0; width:100%; height:100%; }
.neo-orb-mesh{ position:absolute; inset:0; width:100%; height:100%; animation:spin-orb 26s linear infinite; }
@keyframes neoOrbBreathe{ 0%,100%{ opacity:0.75; transform:scale(1); } 50%{ opacity:1; transform:scale(1.06); } }

/* ---------- protocol ---------- */
.protocol-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.protocol-card{ border:1px solid var(--lp-border); border-radius:16px; padding:32px; background:var(--lp-panel); }
.protocol-no{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:700; font-size:32px; margin-bottom:14px;
  background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.protocol-card h3{ font-size:18px; font-weight:700; margin-bottom:10px; }
.protocol-card p{ color:var(--lp-text-dim); font-size:14px; line-height:1.65; }
@media (max-width:860px){ .protocol-grid{ grid-template-columns:1fr; } }

/* ---------- founders quote ---------- */
.quote-section{ text-align:center; padding:70px 0; max-width:880px; margin:0 auto; }
.quote-section blockquote{
  font-family:'Playfair Display', serif; font-style:italic; font-weight:600;
  font-size:clamp(22px,3.4vw,32px); line-height:1.4; color:var(--lp-text); margin:0 0 20px;
}
.quote-section blockquote em{
  font-weight:700;
  background:linear-gradient(100deg, var(--lp-green-soft), var(--lp-green) 55%, var(--lp-green-dim));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.quote-attr{ font-size:11px; letter-spacing:2px; color:var(--lp-text-dim); }

/* ---------- access levels (two doors) ---------- */
.doors-grid{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
.door-card{ border:1px solid var(--lp-border); border-radius:16px; padding:34px; background:var(--lp-panel); }
.door-label{ font-size:11px; letter-spacing:2px; color:var(--lp-green-soft); margin-bottom:14px; }
.door-card h3{ font-size:22px; font-weight:800; margin-bottom:12px; }
.door-card p{ color:var(--lp-text-dim); font-size:14px; line-height:1.65; margin-bottom:18px; }
.door-tags{ font-size:11px; letter-spacing:1.5px; color:var(--lp-text-dim); }
@media (max-width:760px){ .doors-grid{ grid-template-columns:1fr; } }

/* ---------- closing ---------- */
.closing{ text-align:center; padding:90px 0 110px; }
.closing h2{ font-size:clamp(28px,5vw,44px); font-weight:800; margin-bottom:18px; letter-spacing:-0.01em; }
.closing p{ color:var(--lp-text-dim); margin-bottom:32px; }

.site-footer{ border-top:1px solid var(--lp-border); padding:26px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; font-size:11px; color:var(--lp-text-dim); letter-spacing:1px; max-width:1180px; margin:0 auto; }
.footer-mark{ color:var(--lp-green); }
.floor-ticker-track, .band-track{ -webkit-user-select:none; -moz-user-select:none; user-select:none; }
.brand{ position:relative; }
.by-neo-tag{
  position:absolute; right:0; top:100%; margin-top:0;
  display:inline-block; line-height:1;
  font-family:'Dancing Script', cursive; font-weight:700; font-size:9px; white-space:nowrap;
  color:var(--lp-green); text-shadow:0 0 3px var(--lp-green), 0 0 6px var(--lp-green);
  -webkit-clip-path:inset(0 100% 0 0); clip-path:inset(0 100% 0 0);
  animation:writeOn 1.2s steps(20,end) forwards, neoFlicker 3.5s ease-in-out infinite 1.2s;
  pointer-events:none;
}
@keyframes neoFlicker{
  0%,100%{ opacity:0.85; }
  50%{ opacity:1; }
  52%{ opacity:0.6; }
  54%{ opacity:1; }
}
@keyframes writeOn{
  to{ -webkit-clip-path:inset(0 0% 0 0); clip-path:inset(0 0% 0 0); }
}
.footer-links{ display:flex; align-items:center; gap:26px; flex-wrap:wrap; }
.footer-links a{ color:var(--lp-text-dim); text-decoration:none; transition:color .15s ease; }
.footer-links a:hover{ color:var(--lp-green-soft); }
.footer-copy{ color:var(--lp-text-dim); }
@media (max-width:700px){
  .site-footer{ flex-direction:column-reverse; align-items:center; gap:16px; }
  .footer-links{ flex-wrap:nowrap; justify-content:center; gap:16px; font-size:10px; width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .footer-links a, .footer-copy{ white-space:nowrap; flex-shrink:0; }
  .footer-brand{ width:100%; text-align:center; }
}

.legal-page{ display:none; min-height:100vh; }
.legal-page.active{ display:block; }
.legal-wrap{ max-width:760px; padding:60px 24px 100px; }
.contact-center{ text-align:center; display:flex; flex-direction:column; align-items:center; }
.contact-center .legal-back{ align-self:flex-start; }
.contact-center .legal-badge{ margin-left:auto; margin-right:auto; }
.contact-center .btn-primary{ margin-top:6px; }
.legal-back{ color:var(--lp-text-dim); text-decoration:none; font-size:13px; display:inline-block; margin-bottom:40px; }
.legal-back:hover{ color:var(--lp-green); }
.legal-badge{ display:inline-block; font-size:11px; letter-spacing:1.5px; color:var(--lp-green-soft); border:1px solid var(--lp-border); padding:6px 14px; border-radius:999px; margin-bottom:20px; }
.legal-page h1{ font-size:clamp(30px,5vw,44px); font-weight:800; margin-bottom:10px; }
.legal-date{ color:var(--lp-text-dim); font-size:13px; margin-bottom:32px; }
.legal-intro{ color:var(--lp-text-dim); font-size:16px; line-height:1.7; margin-bottom:40px; }
.legal-page h2{ font-size:20px; font-weight:700; margin:40px 0 14px; }

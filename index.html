// ---------- dashboard ----------

// sparseUntil: for a window that GROWS from 1 day up to its full length (calendar
// month-to-date), pass the real-days threshold below which the chart shows plain
// one-bar-per-day candles with no connecting line/curve — a trend line or a smoothed
// bar "forest" across 1-2 real days implies a shape that isn't there yet. Leave unset
// (0) for fixed-length windows (Week's rolling 7, Creator's rolling 7/30) where every
// slot always has a real day and the full curve treatment is correct from the start.
function RevenueChart({ data, height = 240, sparseUntil = 0 }) {
  // data: [{ date: 'YYYY-MM-DD', value: number, byModel?: [{model,value}] }], oldest first
  // The viewBox width tracks the container's real measured pixel width (not a fixed
  // constant scaled via CSS/viewBox tricks) — so 1 SVG unit is always 1 real pixel on
  // both axes. That's what keeps height fixed regardless of screen width, with no
  // letterboxing gaps and no non-uniform stretch/distortion of circles or blur.
  const containerRef = useRef(null);
  const [measuredWidth, setMeasuredWidth] = useState(700);
  useEffect(() => {
    if (!containerRef.current) return;
    const el = containerRef.current;
    const ro = new ResizeObserver((entries) => {
      const w = entries[0]?.contentRect?.width;
      if (w && Math.abs(w - measuredWidth) > 1) setMeasuredWidth(w);
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [measuredWidth]);
  // Replays the bar/dot/line entrance animation whenever the data actually changes
  // (Week/Month toggle, a fresh sync, ...) — without a `key` remount, which in this
  // page's React setup was leaving the previous chart's DOM behind as an orphaned
  // sibling instead of replacing it. Toggling `animation: none` then forcing a reflow
  // before clearing it back to '' is the standard vanilla-JS CSS-restart trick.
  useEffect(() => {
    if (!containerRef.current) return;
    const animated = containerRef.current.querySelectorAll(".rev-bar, .rev-dot, .rev-line");
    animated.forEach((el) => { el.style.animation = "none"; });
    void containerRef.current.offsetWidth;
    animated.forEach((el) => { el.style.animation = ""; });
  }, [data]);
  const width = measuredWidth;
  // padTop reserves a slim strip for the hover tooltip — small enough that it
  // doesn't waste space, but the tooltip always lives inside it, pinned to
  // the same spot, so it can never sit on top of the line/bars.
  const fontScale = height > 240 ? 1.2 : 1; // the 30D view gets a taller chart — scale text up to match, not just whitespace
  const padTop = 42 * fontScale, padBottom = 28 * fontScale, padLeft = 60 * fontScale, padRight = 40 * fontScale;
  const plotH = height - padTop - padBottom;
  const plotW = width - padLeft - padRight;
  const rawMax = Math.max(1, ...data.map((d) => d.value));
  const max = rawMax * 1.15; // small headroom so the tallest point isn't flush against the top edge
  const n = data.length || 1;
  const isSparse = sparseUntil > 0 && n <= sparseUntil;
  // Candles pack together at a fixed, readable width instead of stretching edge-to-edge
  // across the whole plot — 2 real days shouldn't look like they're straining to fill a
  // 30-day-wide chart. Left-anchored, same width the dense "forest" bars settle around.
  const stepX = n > 1 ? (isSparse ? Math.min(plotW / (n - 1), 64) : plotW / (n - 1)) : 0;

  // Round, human step (25/50/100/250/500/1000/2500/5000...) picked so the axis always
  // shows ~4 gridlines — a $157 month gets 0/50/100/150, a $16k month gets 0/5k/10k/15k.
  // Never a raw fraction, never an empty axis with nothing but "$0" on it. Based on the
  // REAL max (not the padded one) — padding it first was nudging borderline values like
  // $357 into the next step size up (e.g. 250 instead of 100) for no real reason.
  const niceStep = (m) => {
    const STEPS = [25, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];
    const rough = m / 4;
    return STEPS.find((s) => s >= rough) || Math.ceil(rough / 100000) * 100000;
  };
  const tickStep = niceStep(rawMax);
  const ticks = [];
  for (let v = 0; v <= max; v += tickStep) ticks.push(v);
  // Ticks near the peak used to get dropped to dodge a collision with it — but the tick
  // label sits at the far left edge while the peak can be anywhere along the width, so
  // in most layouts they were never actually close horizontally. Always show them all.
  const ticksFiltered = ticks;
  const fmtTick = (v) => `$${Math.round(v).toLocaleString()}`;

  const points = data.map((d, i) => {
    const x = padLeft + i * stepX;
    const y = padTop + plotH - (d.value / max) * plotH;
    return { x, y, ...d };
  });

  // Catmull-Rom -> cubic Bezier segments, so the line reads as a smooth curve instead of sharp angles.
  // Except: a segment touching a $0 day goes straight instead — the smooth spline's tangent gets
  // pulled by neighboring spikes and bows a phantom "hill" up out of a flat zero stretch, implying
  // revenue that was never there. A straight line into/out of $0 can't overshoot like that.
  const segments = [];
  for (let i = 0; i < points.length - 1; i++) {
    const p0 = points[i - 1] || points[i];
    const p1 = points[i];
    const p2 = points[i + 1];
    const p3 = points[i + 2] || p2;
    if (p1.value === 0 || p2.value === 0) {
      segments.push({ p1, c1: p1, c2: p2, p2 });
      continue;
    }
    const c1 = { x: p1.x + (p2.x - p0.x) / 6, y: p1.y + (p2.y - p0.y) / 6 };
    const c2 = { x: p2.x - (p3.x - p1.x) / 6, y: p2.y - (p3.y - p1.y) / 6 };
    segments.push({ p1, c1, c2, p2 });
  }
  const linePath = segments.length
    ? `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}` + segments.map((s) =>
        ` C ${s.c1.x.toFixed(1)} ${s.c1.y.toFixed(1)}, ${s.c2.x.toFixed(1)} ${s.c2.y.toFixed(1)}, ${s.p2.x.toFixed(1)} ${s.p2.y.toFixed(1)}`
      ).join("")
    : "";
  const bezierY = (s, t) => {
    const mt = 1 - t;
    return mt * mt * mt * s.p1.y + 3 * mt * mt * t * s.c1.y + 3 * mt * t * t * s.c2.y + t * t * t * s.p2.y;
  };
  const baseline = padTop + plotH;

  // dense bar "forest" under the curve — sampled along the smooth line, not 1:1 with data points.
  // Target a roughly constant total bar count regardless of how many days are plotted (7 or 30),
  // so bars stay visibly separated instead of blurring into a solid mass on narrow/mobile screens.
  // Skipped while sparse: one real day should be exactly one candle, not several interpolated ones.
  const samplesPerSeg = Math.max(1, Math.min(6, Math.round(40 / Math.max(1, n - 1))));
  const bars = isSparse
    ? points.map((p) => ({ x: p.x, y: p.y }))
    : (() => {
        const out = [];
        segments.forEach((s) => {
          for (let k = 0; k < samplesPerSeg; k++) {
            const t = k / samplesPerSeg;
            out.push({ x: s.p1.x + (s.p2.x - s.p1.x) * t, y: bezierY(s, t) });
          }
        });
        out.push({ x: points[points.length - 1].x, y: points[points.length - 1].y });
        return out;
      })();
  // capped at the same width bars normally are (roughly what Week shows) so day 1 of a new
  // month reads as one normal bar, not one giant blown-up blob filling the whole chart
  const barWidth = Math.min(14, Math.max(2, (plotW / bars.length) * 0.62));

  // Ideally every dot gets its own date — but "7. 8." is wide enough that on a narrow
  // phone screen even every-other-dot doesn't fit. Falls back to a compact "day number
  // only" format (which fits under nearly every dot) before resorting to skipping dots,
  // and only ever skips as a last resort on the tightest widths.
  const fullLabelW = 44 * fontScale;
  const compactLabelW = 20 * fontScale;
  let labelFormat, labelEvery;
  if (stepX >= fullLabelW) {
    labelFormat = "full"; labelEvery = 1;
  } else if (stepX >= compactLabelW) {
    labelFormat = "compact"; labelEvery = 1;
  } else {
    labelFormat = "compact";
    const maxLabelsThatFit = Math.max(2, Math.floor(plotW / compactLabelW));
    labelEvery = Math.max(1, Math.ceil(n / Math.min(n, maxLabelsThatFit)));
  }
  let lastShownMonth = null;
  const [hoverIdx, setHoverIdx] = useState(null);

  return (
    <div ref={containerRef} style={{ width: "100%" }}>
    <svg viewBox={`0 0 ${width} ${height}`} width={width} height={height} style={{ overflow: "visible", display: "block" }}
      onMouseLeave={() => setHoverIdx(null)}>
      <defs>
        <linearGradient id="revBarFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#39e673" stopOpacity="0.6" />
          <stop offset="100%" stopColor="#39e673" stopOpacity="0.04" />
        </linearGradient>
        <filter id="revGlowLine" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.2" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="revGlowDot" x="-250%" y="-250%" width="600%" height="600%">
          <feGaussianBlur stdDeviation="2.4" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        {/* The smooth Catmull-Rom curve can overshoot past a 0 value between two higher
            points (a real cardinal-spline artifact, not a data bug) — this clips anything
            that would dip below the $0 line so the line never visibly crosses under it. */}
        <clipPath id="revNoNegativeClip">
          <rect x={-1000} y={-1000} width={width + 2000} height={baseline + 1000} />
        </clipPath>
      </defs>

      {ticksFiltered.map((v, i) => {
        const ty = padTop + plotH - (v / max) * plotH;
        return (
          <g key={`tick-${i}`}>
            <line x1={padLeft} y1={ty} x2={width - padRight} y2={ty}
              stroke="#ffffff" strokeOpacity={v === 0 ? 0.14 : 0.07} strokeWidth="1" strokeDasharray={v === 0 ? "0" : "2,4"} />
            <text x={padLeft - 14} y={ty + 3} textAnchor="end" fontSize={10 * fontScale} fontFamily="'JetBrains Mono', monospace" fill="#5c6e65">
              {fmtTick(v)}
            </text>
          </g>
        );
      })}

      {bars.map((p, i) => (
        <rect key={`bar-${i}`} className="rev-bar" x={p.x - barWidth / 2} y={p.y} width={barWidth}
          height={Math.max(baseline - p.y, 0)} rx={barWidth / 2} fill="url(#revBarFill)"
          style={{ animationDelay: `${(i / bars.length) * 0.4}s` }} />
      ))}

      {/* A trend line across only 1-2 points (early days of a new month) implies a
          trend that isn't real yet — bars/dots alone are honest until there's
          enough of the month behind them to actually connect. Only gated for
          sparseUntil-enabled charts (Month); Week's fixed 7-point line is untouched. */}
      {linePath && !isSparse && (
        <path className="rev-line" d={linePath} fill="none" stroke="#39e673" strokeWidth="2.5"
          strokeLinejoin="round" strokeLinecap="round" filter="url(#revGlowLine)" clipPath="url(#revNoNegativeClip)"
          pathLength="1000" strokeDasharray="1000" />
      )}
      {points.map((p, i) => (
        <g key={i}
          onMouseEnter={() => setHoverIdx(i)}
          style={{ cursor: "pointer" }}>
          <rect x={p.x - stepX / 2} y={padTop} width={Math.max(stepX, 6)} height={plotH} fill="transparent" />
          <circle className="rev-dot" cx={p.x} cy={p.y} r={hoverIdx === i ? 5 : 3.5} fill="#39e673" stroke="#07090a" strokeWidth="1.5" filter="url(#revGlowDot)"
            style={{ animationDelay: `${0.15 + (i / Math.max(n - 1, 1)) * 1.0}s` }} />
          {(n - 1 - i) % labelEvery === 0 && (() => {
            const d = new Date(p.date + "T00:00:00");
            let label;
            if (labelFormat === "full") {
              label = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
            } else {
              // Compact mode: bare day number so a label fits under nearly every dot —
              // the month only reappears when it actually changes, so a week/month
              // spanning a boundary (e.g. Jul 31 → Aug 1) still reads unambiguously.
              const m = d.getMonth();
              const showMonth = lastShownMonth === null || m !== lastShownMonth;
              lastShownMonth = m;
              label = showMonth ? d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) : String(d.getDate());
            }
            return (
              <text x={p.x} y={height - 8} textAnchor="middle" fontSize={10 * fontScale} fontFamily="'JetBrains Mono', monospace" fill="#5c6e65">
                {label}
              </text>
            );
          })()}
        </g>
      ))}
      {hoverIdx !== null && (() => {
        const hp = points[hoverIdx];
        // % vs the average of every prior day in this view, not a single previous day —
        // a lone near-zero prior day would otherwise spike this to +800% and mean nothing.
        const priorValues = data.slice(0, hoverIdx).map((d) => d.value).filter((v) => v > 0);
        const priorAvg = priorValues.length ? priorValues.reduce((a, b) => a + b, 0) / priorValues.length : null;
        const growth = priorAvg ? ((hp.value - priorAvg) / priorAvg) * 100 : null;
        const dateLabel = new Date(hp.date + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
        const valueLabel = `$${hp.value.toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
        const growthLabel = growth !== null ? `${growth >= 0 ? "+" : ""}${growth.toFixed(1)}%` : "";
        // rough monospace width estimate, so the pill hugs its text instead of a fixed guess
        const charW = 7.6 * fontScale;
        const boxW = Math.max(110 * fontScale, (dateLabel.length + valueLabel.length + growthLabel.length) * charW + 40);
        const boxH = 28 * fontScale;
        const boxX = Math.min(Math.max(hp.x - boxW / 2, padLeft), width - boxW - 2);
        const boxY = 4; // pinned to the same slim strip every time — never tracks point.y, so it never overlaps the curve
        return (
          <g style={{ pointerEvents: "none" }}>
            <line x1={hp.x} y1={padTop} x2={hp.x} y2={padTop + plotH} stroke="#39e673" strokeWidth="1" strokeDasharray="3,3" opacity="0.3" />
            <rect x={boxX} y={boxY} width={boxW} height={boxH} rx={13} fill="#0b0f0d" stroke="#173425" strokeWidth="1" />
            <text x={boxX + 12} y={boxY + 19} fontSize={12 * fontScale} fontFamily="'JetBrains Mono', monospace" fill="#8B93A1">
              {dateLabel}
            </text>
            <text x={boxX + boxW - 12} y={boxY + 19} textAnchor="end" fontSize={13 * fontScale} fontFamily="'JetBrains Mono', monospace" fill="#39e673" fontWeight="700">
              {valueLabel}
              {growthLabel && <tspan fill={growth >= 0 ? "#39e673" : "#E2725B"} dx="8">{growthLabel}</tspan>}
            </text>
          </g>
        );
      })()}
    </svg>
    </div>
  );
}

// Per-model X (Twitter) stats, last 7 days — picker so you view one model at a
// time instead of a wall of numbers for the whole roster at once.
const fmtK = (n) => (n >= 1000000 ? (n / 1000000).toFixed(1) + "M" : n >= 1000 ? (n / 1000).toFixed(1) + "K" : n ? String(n) : "—");

function XStatsSection({ models, bufferDailyStats, bufferTopPosts, restrictModel }) {
  const xModels = restrictModel
    ? models.filter((m) => m.name === restrictModel)
    : models.filter((m) => (bufferDailyStats || []).some((r) => r.model === m.name && r.platform === "x"));
  const [selected, setSelected] = useState("");
  useEffect(() => {
    if (!selected && xModels.length) setSelected((restrictModel || xModels[0].name));
  }, [xModels.length]);

  if (!xModels.length) return null;
  if (restrictModel && !(bufferDailyStats || []).some((r) => r.model === restrictModel && r.platform === "x")) return null;

  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate() - 6);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(weekAgo); d.setDate(weekAgo.getDate() + i); return d.toISOString().slice(0, 10);
  });
  const prevWeekAgo = new Date(weekAgo); prevWeekAgo.setDate(weekAgo.getDate() - 7);
  const prevDays = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(prevWeekAgo); d.setDate(prevWeekAgo.getDate() + i); return d.toISOString().slice(0, 10);
  });
  const rows = (bufferDailyStats || []).filter((r) => r.model === selected && r.platform === "x" && days.includes(r.statDate));
  const prevRows = (bufferDailyStats || []).filter((r) => r.model === selected && r.platform === "x" && prevDays.includes(r.statDate));
  const byDay = (field) => days.map((day) => rows.filter((r) => r.statDate === day).reduce((s, r) => s + (r[field] || 0), 0));
  const totals = {
    impressions: rows.reduce((s, r) => s + (r.impressions || 0), 0),
    comments: rows.reduce((s, r) => s + (r.comments || 0), 0),
    reactions: rows.reduce((s, r) => s + (r.reactions || 0), 0),
    postCount: rows.reduce((s, r) => s + (r.postCount || 0), 0),
  };
  const prevImpressions = prevRows.reduce((s, r) => s + (r.impressions || 0), 0);
  // Only show a delta once there's a real prior week to compare against — a
  // zero-vs-zero or zero-vs-something comparison is noise, not a signal.
  const impressionsDelta = prevImpressions > 0 ? Math.round(((totals.impressions - prevImpressions) / prevImpressions) * 100) : null;
  // engagementRate comes from Buffer per-day already as a percentage (e.g. 3.4, not 0.034) —
  // averaged across the days that actually have data, not divided by all 7 regardless.
  const engagementDays = rows.filter((r) => r.engagementRate != null);
  const avgEngagement = engagementDays.length
    ? engagementDays.reduce((s, r) => s + r.engagementRate, 0) / engagementDays.length
    : null;
  const impressionsSeries = byDay("impressions");
  const postsSeries = byDay("postCount");
  const reactionsSeries = byDay("reactions");
  const commentsSeries = byDay("comments");
  const maxImpr = Math.max(1, ...impressionsSeries);
  const topPost = (bufferTopPosts || []).find((p) => p.model === selected && p.platform === "x");

  const peakIdx = impressionsSeries.reduce((best, v, i) => (v > impressionsSeries[best] ? i : best), 0);
  // Same "round, human step" idea as the Agency Revenue chart, in a smaller K-scale range
  // suited to impression counts (a few hundred to a few thousand) rather than dollars.
  // Bars and gridlines MUST share this exact same scale — they used to use two different
  // ones (bars scaled to the raw max, ticks stopped at/below it), so a 3.8K peak bar stood
  // taller than the "3.0K" line above it instead of sitting under a "4.0K" one.
  const BAR_BUDGET_PX = 116; // matches the pixel budget the bars themselves scale against
  const imprNiceStep = (m) => {
    const STEPS = [50, 100, 250, 500, 1000, 2500, 5000, 10000, 25000, 50000];
    const rough = m / 4;
    return STEPS.find((s) => s >= rough) || Math.ceil(rough / 50000) * 50000;
  };
  const imprTickStep = imprNiceStep(maxImpr);
  // Always at least one step ABOVE the real max — Math.floor+1 (not ceil) so an exact
  // multiple (maxImpr === 3000) still gets a step of headroom instead of landing flush.
  const imprAxisMax = (Math.floor(maxImpr / imprTickStep) + 1) * imprTickStep;
  const imprTicks = [];
  for (let v = 0; v <= imprAxisMax; v += imprTickStep) imprTicks.push(v);
  if (imprTicks.length < 2) imprTicks.push(imprTickStep);
  const statTiles = [
    { label: "impressions", value: totals.impressions },
    { label: "replies", value: totals.comments },
    { label: "reactions", value: totals.reactions },
    { label: "posts", value: totals.postCount },
    { label: "engagement", value: avgEngagement != null ? `${avgEngagement.toFixed(1)}%` : "—", raw: true },
  ];

  return (
    <div className="c-bg-surface border rounded-xl overflow-hidden mb-6" style={{
      borderColor: "rgba(57,230,115,0.25)",
      animation: "cardIn 0.4s ease-out, auroraGlow 9s ease-in-out 0.4s infinite",
    }}>
      <div className="flex items-center justify-between px-5 py-4 flex-wrap gap-2 border-b c-border">
        <div className="flex items-center gap-2">
          <span style={{ width: 7, height: 7, borderRadius: 999, background: "#39e673", boxShadow: "0 0 10px #39e673", animation: "softPulse 1.8s ease-in-out infinite" }} />
          <span className="fs-11 uppercase tracking-widest c-muted font-mono">X · last 7 days</span>
          <span className="fs-9 uppercase tracking-widest font-mono px-1.5 py-0.5 rounded"
            style={{ color: "#8B93A1", background: "rgba(139,147,161,0.12)" }}>posts only</span>
          {impressionsDelta != null && (
            <span className="fs-9 font-mono px-1.5 py-0.5 rounded flex items-center gap-1" style={{
              color: impressionsDelta >= 0 ? "#39e673" : "#ff6b6b",
              background: impressionsDelta >= 0 ? "rgba(57,230,115,0.12)" : "rgba(255,107,107,0.12)",
            }}>
              {impressionsDelta >= 0 ? <TrendingUp size={10} /> : <TrendingDown size={10} />}
              {impressionsDelta >= 0 ? "+" : ""}{impressionsDelta}% vs last week
            </span>
          )}
        </div>
        {!restrictModel && (
          <select value={selected} onChange={(e) => setSelected(e.target.value)}
            className="fs-11 font-mono c-bg-app border c-border rounded-lg px-2.5 py-1.5 c-text">
            {xModels.map((m) => <option key={m.name} value={m.name}>{m.name}</option>)}
          </select>
        )}
      </div>

      <div className="flex flex-col lg:flex-row lg:items-stretch">
        <div className="flex-1 min-w-0 p-5 flex flex-col">
          <div className="grid grid-cols-5 border c-border rounded-lg overflow-hidden mb-5">
            {statTiles.map((t, i) => (
              <div key={t.label} className={`px-3 py-2.5 ${i > 0 ? "border-l c-border" : ""}`}
                style={{ animation: `neoFadeInUp 0.35s ease-out ${i * 0.05}s both` }}>
                <div className="text-xl font-bold c-text leading-tight">{t.raw ? t.value : <CountUp value={t.value} />}</div>
                <div className="fs-9 c-faint font-mono uppercase truncate">{t.label}</div>
              </div>
            ))}
          </div>

          <div className="flex gap-2 flex-1" style={{ minHeight: 160 }}>
            <div className="flex flex-col justify-between font-mono c-faint flex-shrink-0" style={{ fontSize: 9, height: BAR_BUDGET_PX, marginBottom: 20 }}>
              {[...imprTicks].reverse().map((t) => <span key={t}>{t === 0 ? "0" : fmtK(t)}</span>)}
            </div>
            <div className="flex items-end gap-px flex-1 relative">
              {/* Dashed gridlines share the bars' own pixel budget (not a %) for the same
                  reason the bars had to move off percentages — no definite height to
                  anchor a % against once this column stacks under the photo on mobile. */}
              {imprTicks.map((t) => (
                <div key={`grid-${t}`} className="absolute left-0 right-0 border-t border-dashed"
                  style={{ bottom: 20 + (t / imprAxisMax) * BAR_BUDGET_PX, borderColor: "rgba(255,255,255,0.07)" }} />
              ))}
              {impressionsSeries.map((v, i) => (
              <div key={i} className="group relative flex-1 flex flex-col items-center justify-end gap-1.5" style={{ height: "100%" }}>
                {/* Hover/focus tooltip — per-mark hit target is the whole day column, not just
                    the painted bar, and every value here is also visible via the totals above
                    (aggregated) or the table view elsewhere, so nothing is hover-gated. */}
                <div className="absolute bottom-full left-1/2 mb-2 px-2.5 py-2 rounded-lg border pointer-events-none opacity-0 group-hover:opacity-100 transition-opacity z-10"
                  style={{
                    transform: "translateX(-50%)", background: "#0c0f0d", borderColor: "rgba(57,230,115,0.3)",
                    boxShadow: "0 8px 24px rgba(0,0,0,0.5)", whiteSpace: "nowrap",
                  }}>
                  <div className="fs-9 font-mono c-faint uppercase mb-1">{fmtDay ? fmtDay(days[i]) : days[i]}</div>
                  <div className="flex flex-col gap-0.5">
                    <div className="fs-11 font-mono flex items-center justify-between gap-3">
                      <span style={{ color: "#39e673" }}>impressions</span><span className="c-text font-bold">{v.toLocaleString()}</span>
                    </div>
                    <div className="fs-11 font-mono flex items-center justify-between gap-3">
                      <span className="c-faint">posts</span><span className="c-text">{postsSeries[i]}</span>
                    </div>
                    <div className="fs-11 font-mono flex items-center justify-between gap-3">
                      <span className="c-faint">reactions</span><span className="c-text">{reactionsSeries[i]}</span>
                    </div>
                    <div className="fs-11 font-mono flex items-center justify-between gap-3">
                      <span className="c-faint">replies</span><span className="c-text">{commentsSeries[i]}</span>
                    </div>
                  </div>
                </div>

                {i === peakIdx && v > 0 && (
                  <span className="font-mono" style={{ fontSize: 9, color: "#39e673", animation: "softPulse 1.8s ease-in-out infinite" }}>{fmtK(v)}</span>
                )}
                <div className="rounded-t w-full transition-opacity group-hover:opacity-80" style={{
                  maxWidth: 28,
                  // Fixed pixel height, not a percentage — on a stacked mobile layout (no
                  // sibling to stretch this column's flex parent against) the parent only
                  // has a min-height, which isn't a valid basis for percentage heights, so
                  // every bar was silently resolving to 0px. Pixels sidestep that entirely.
                  // Scaled against imprAxisMax (with headroom above the real max), the exact
                  // same reference the gridlines use — so a bar's top always lines up with
                  // whichever tick actually matches its value, never floating past the top one.
                  height: `${Math.max(3, (v / imprAxisMax) * BAR_BUDGET_PX)}px`,
                  background: v ? "linear-gradient(180deg, #5cf797, #39e673, #1f9950)" : "rgba(139,147,161,0.15)",
                  boxShadow: v ? "0 0 14px rgba(57,230,115,0.45)" : "none",
                  transformOrigin: "bottom",
                  animation: `barGrow 0.5s cubic-bezier(0.34,1.56,0.64,1) ${0.15 + i * 0.06}s both`,
                }} />
                <span className="font-mono c-faint" style={{ fontSize: 9 }}>{days[i].slice(8, 10)}</span>
              </div>
            ))}
            </div>
          </div>
        </div>

        {topPost && (topPost.sourceUrl || topPost.thumbnailUrl) && (
          // Fixed pixel height (not "100%") — a portrait vs landscape photo has a wildly
          // different natural aspect ratio, and "100%" against this column's otherwise
          // auto/content-driven height fell back to sizing off that ratio, so the whole
          // panel visibly grew or shrank depending purely on which model was selected.
          // A constant height keeps the panel the same size no matter whose photo it is.
          <div className="w-full lg:w-72 flex-shrink-0 lg:border-l relative flex flex-col items-center justify-center group p-4" style={{
            background: "rgba(255,255,255,0.02)", borderColor: "rgba(57,230,115,0.2)", height: 320, minHeight: 320, maxHeight: 320,
          }}>
            <div className="rounded-xl border" style={{
              width: "100%", height: "100%", overflow: "hidden", background: "#000", position: "relative",
              borderColor: "rgba(57,230,115,0.25)", boxShadow: "0 12px 30px -12px rgba(0,0,0,0.6)",
            }}>
              {/* sourceUrl is Buffer's full-resolution original asset; thumbnailUrl is a
                  small pre-cropped preview — only fall back to it if source is missing. */}
              <img src={topPost.sourceUrl || topPost.thumbnailUrl} alt="" className="w-full h-full transition-transform duration-700 group-hover:scale-105"
                style={{ objectFit: "cover", animation: "topPostZoomIn 0.6s ease-out both" }}
                onError={(e) => { if (e.target.src !== topPost.thumbnailUrl && topPost.thumbnailUrl) e.target.src = topPost.thumbnailUrl; }} />
              <div style={{ position: "absolute", inset: 0, background: "linear-gradient(180deg, rgba(0,0,0,0.6) 0%, transparent 22%, transparent 58%, rgba(0,0,0,0.9) 100%)" }} />
              <span className="fs-9 uppercase tracking-widest font-mono absolute top-3 left-3 px-1.5 py-0.5 rounded flex items-center gap-1" style={{
                color: "#0c0f0d", background: "#39e673",
                boxShadow: "0 0 16px rgba(57,230,115,0.6)",
                animation: "cardIn 0.4s ease-out 0.2s both",
              }}>
                <Flame size={10} /> Post of the week
              </span>
              <div className="absolute left-3 right-3 bottom-3 flex flex-col gap-1.5" style={{ animation: "neoFadeInUp 0.4s ease-out 0.3s both" }}>
                {topPost.text && (
                  <p className="fs-11 leading-snug" style={{
                    color: "#fff", textShadow: "0 1px 3px rgba(0,0,0,0.6)",
                    display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden",
                  }}>{topPost.text}</p>
                )}
                <div className="flex items-center gap-3 pt-0.5">
                  <span className="fs-9 font-mono" style={{ color: "rgba(255,255,255,0.85)" }}>{fmtK(topPost.impressions)} impr</span>
                  <span className="fs-9 font-mono" style={{ color: "rgba(255,255,255,0.85)" }}>{fmtK(topPost.reactions)} likes</span>
                  {topPost.externalLink && (
                    <a href={topPost.externalLink} target="_blank" rel="noreferrer" className="fs-9 font-mono ml-auto"
                      style={{ color: "#39e673" }}>view →</a>
                  )}
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// New Infloww fields beyond earnings — refunds, automated messages, priority mass
// messages, tracking links. Automated messages / PMM / tracking links are all
// current-state snapshots (same value repeated on every synced day), not daily
// events, so we read the latest row per model rather than summing across days —
// summing would multiply a lifetime total by however many days got synced.
// days/periodLabel mirror the Agency Revenue Week/Month toggle above it — refunds
// are a real per-day sum so the window actually changes what's counted; automated
// messages / PMM / tracking links stay "latest snapshot" regardless of the toggle
// since those are lifetime/current-state values, not day-bucketed (see their sync
// logic), so there's nothing period-specific to sum for them.
function OfExtrasSection({ models, inflowwDailyStats, days = 7, periodLabel = "this week", sinceISO }) {
  const toLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const windowAgo = new Date(); windowAgo.setDate(windowAgo.getDate() - (days - 1));
  const windowAgoStr = sinceISO || toLocalISO(windowAgo);

  // Free and paid are separate Infloww accounts with their own sync rows — merging
  // them into one "latest" row (the old approach) meant whichever account type
  // happened to sort last silently ate the other's numbers. One row per account
  // type instead, same as CreatorInsightsSection already does it correctly.
  const rows = [];
  models.forEach((m) => {
    const modelRows = (inflowwDailyStats || []).filter((r) => r.model === m.name);
    if (!modelRows.length) return;
    const byAccountType = {};
    modelRows.forEach((r) => { (byAccountType[r.accountType] || (byAccountType[r.accountType] = [])).push(r); });
    Object.entries(byAccountType).forEach(([accountType, acctRows]) => {
      const windowRows = acctRows.filter((r) => r.statDate >= windowAgoStr);
      const refundsWindow = windowRows.reduce((s, r) => s + (r.refundsNet || 0), 0);
      // Chatting ratio (a.k.a. sub-to-message ratio) — chat/message revenue
      // (PPVs, tips, customs — messagesNet + tipsNet) vs subscription revenue
      // (subsNet), summed over the same window as refunds above. Worth
      // treating as informational, not a target to optimize: it's easy to
      // game by pushing PPVs at the expense of renewals, and a page that
      // improves retention (more subs revenue) will show a "worse" ratio
      // even while making more money overall.
      const chatRevenue = windowRows.reduce((s, r) => s + (r.messagesNet || 0) + (r.tipsNet || 0), 0);
      const subRevenue = windowRows.reduce((s, r) => s + (r.subsNet || 0), 0);
      // Sort by the actual calendar day (statDate), not syncedAt — a bulk sync
      // upserts every day's row within the same request, often with identical
      // (or near-identical) syncedAt timestamps, which made "latest by
      // syncedAt" pick an effectively random day instead of the real latest
      // one, silently showing 0 for snapshot fields (fans chatted, etc.) that
      // only ever get written onto today's row.
      const latest = [...acctRows].sort((a, b) => (b.statDate || "").localeCompare(a.statDate || ""))[0];
      rows.push({
        name: m.name, accountType,
        refundsWindow,
        fansChatted: latest.fansChatted || 0,
        replyMin: latest.replyTimeMs ? Math.round(latest.replyTimeMs / 60000) : null,
        chattingRatio: subRevenue > 0 ? chatRevenue / subRevenue : (chatRevenue > 0 ? Infinity : null),
      });
    });
  });

  if (!rows.length) return null;
  const hasAnyActivity = rows.some((r) => r.refundsWindow || r.fansChatted);
  if (!hasAnyActivity) return null;

  return (
    <div className="c-bg-surface border c-border rounded-xl p-4 mb-6">
      <div className="flex items-center justify-between mb-3">
        <span className="fs-11 uppercase tracking-widest c-muted font-mono">OF extras</span>
        <span className="fs-9 uppercase tracking-widest font-mono px-1.5 py-0.5 rounded"
          style={{ color: "#8B93A1", background: "rgba(139,147,161,0.12)" }}>refunds · {periodLabel} — rest · latest snapshot</span>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-xs">
          <thead>
            <tr className="c-muted font-mono uppercase fs-10 border-b c-border">
              <th className="text-left py-2 pr-3">Model</th>
              <th className="text-right py-2 px-3">Refunds ({periodLabel})</th>
              <th className="text-right py-2 px-3">Fans chatted</th>
              <th className="text-right py-2 px-3">Reply time</th>
              <th className="text-right py-2 pl-3" title="Chat/message revenue (PPVs, tips, customs) : subscription revenue. Informational only — easy to game, and a healthier page (more renewals) can show a 'worse' ratio while earning more overall.">
                Chatting ratio
              </th>
            </tr>
          </thead>
          <tbody>
            {rows.map((r) => (
              <tr key={`${r.name}-${r.accountType}`} className="border-b c-border c-text">
                <td className="py-2 pr-3 font-mono">{r.name}{r.accountType === "free" ? " (free)" : ""}</td>
                <td className="py-2 px-3 text-right font-mono" style={{ color: r.refundsWindow > 0 ? "#E2725B" : undefined }}>
                  {r.refundsWindow > 0 ? `-$${r.refundsWindow.toFixed(2)}` : "$0"}
                </td>
                <td className="py-2 px-3 text-right font-mono">{r.fansChatted.toLocaleString()}</td>
                <td className="py-2 px-3 text-right font-mono">{r.replyMin != null ? `${r.replyMin} min` : "—"}</td>
                <td className="py-2 pl-3 text-right font-mono">
                  {r.chattingRatio == null ? "—" : r.chattingRatio === Infinity ? "1:0" : `1:${Math.round(r.chattingRatio)}`}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}


// Auto-generated read on an account's health, combining reply time + renew rate +
// the "big fan pool but nobody pays" pattern — same idea as the Creator Report
// table above, just turned into a plain-language verdict instead of raw numbers.
function creatorInsight(a) {
  const notes = [];
  if (a.replyMin != null) {
    if (a.replyMin > 60) notes.push("reply time přes hodinu — ztracený příjem");
    else if (a.replyMin <= 30) notes.push("reply time v pohodě");
  }
  if (a.renewPct != null) {
    if (a.renewPct >= 55) notes.push("silný renew");
    else if (a.renewPct < 45) notes.push("slabý renew");
  } else if (a.accountType === "free") {
    notes.push("free účet — velký fanoušek pool na konverzi");
  }
  if (a.activeFans > 1000 && a.avgSpend < 1) {
    notes.push("hodně fanoušků, skoro nic neplatí — obsah/cena nekonvertuje");
  }
  if (!notes.length) return { text: "Bez výrazných výkyvů.", tone: "neutral" };
  const tone = a.replyMin > 60 || (a.renewPct != null && a.renewPct < 45) || (a.activeFans > 1000 && a.avgSpend < 1)
    ? "bad" : (a.replyMin <= 30 && a.renewPct >= 55) ? "good" : "neutral";
  return { text: notes.join(" · ") + ".", tone };
}

const TONE_COLOR = { good: "#39e673", bad: "#E2725B", neutral: "#8B93A1" };

// Revenue-by-creator bar chart + one insight card per account — the visual,
// at-a-glance companion to the raw CreatorReportSection table above it. 30-day
// window regardless of the Agency Revenue toggle above, since these fields
// (reply time, renew rate) are themselves already rolling/latest-snapshot values,
// not day-specific — a shorter window would just be noisier for no real benefit.
function CreatorInsightsSection({ models, inflowwDailyStats, embedded, days = 30, periodLabel = "30d", sinceISO }) {
  // Mirrors the Agency Revenue Week/Month toggle above it — earnings and avgSpend
  // (both derived from earnings) actually change with the window; the snapshot
  // fields (reply time, renew %, rank, ...) don't, since they're latest-available
  // values with no meaningful "this week vs this month" sum.
  // `sinceISO`, when passed, pins the window to the same calendar range as the Agency
  // Revenue chart above it (e.g. "1st of this month" instead of a rolling N-day lookback,
  // which would otherwise pull in most of last month a few days into a new one).
  const toLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const windowAgo = new Date(); windowAgo.setDate(windowAgo.getDate() - (days - 1));
  const windowAgoStr = sinceISO || toLocalISO(windowAgo);

  const latestNonZero = (rows, field) => {
    const withValue = rows.filter((r) => r[field] != null).sort((a, b) => b.statDate.localeCompare(a.statDate));
    if (!withValue.length) return null;
    const nonZero = withValue.find((r) => r[field] !== 0);
    return (nonZero || withValue[0])[field];
  };

  const accounts = [];
  models.forEach((m) => {
    const modelRows = (inflowwDailyStats || []).filter((r) => r.model === m.name);
    if (!modelRows.length) return;
    const byAccountType = {};
    modelRows.forEach((r) => { (byAccountType[r.accountType] || (byAccountType[r.accountType] = [])).push(r); });
    Object.entries(byAccountType).forEach(([accountType, rows]) => {
      const earnings30d = rows.filter((r) => r.statDate >= windowAgoStr).reduce((s, r) => s + (r.earningsNet || 0), 0);
      const activeFans = latestNonZero(rows, "activeFans");
      const fansWithRenewOn = latestNonZero(rows, "fansWithRenewOn");
      const replyTimeMs = latestNonZero(rows, "replyTimeMs");
      const performanceRank = latestNonZero(rows, "performanceRank");
      const profileVisitors = latestNonZero(rows, "profileVisitors");
      const avgSubscriptionLengthDays = latestNonZero(rows, "avgSubscriptionLengthDays");
      accounts.push({
        model: m.name, accountType, earnings30d,
        activeFans, fansWithRenewOn, performanceRank, profileVisitors, avgSubscriptionLengthDays,
        replyMin: replyTimeMs ? Math.round(replyTimeMs / 60000) : null,
        renewPct: (activeFans && fansWithRenewOn != null) ? Math.round((fansWithRenewOn / activeFans) * 1000) / 10 : null,
        avgSpend: activeFans ? earnings30d / activeFans : null,
      });
    });
  });

  if (!accounts.length) return null;
  accounts.sort((a, b) => b.earnings30d - a.earnings30d);
  const maxEarnings = Math.max(1, ...accounts.map((a) => a.earnings30d));

  const content = (
    <>
      <div className="flex items-center justify-between mb-4">
        <span className="fs-11 uppercase tracking-widest c-muted font-mono">Creator performance · {periodLabel}</span>
        <span className="fs-9 uppercase tracking-widest font-mono px-1.5 py-0.5 rounded"
          style={{ color: "#8B93A1", background: "rgba(139,147,161,0.12)" }}>auto-generated read</span>
      </div>

      <div className="flex flex-col gap-2.5 mb-5">
        {accounts.map((a) => {
          const pct = (a.earnings30d / maxEarnings) * 100;
          return (
            <div key={`${a.model}-${a.accountType}`} className="flex items-center gap-3">
              <div className="fs-11 font-mono c-text truncate" style={{ width: 96, flexShrink: 0 }}>
                {a.model}{a.accountType === "free" ? " (free)" : ""}
              </div>
              <div className="flex-1 rounded-full overflow-hidden" style={{ height: 6, background: "rgba(255,255,255,0.06)" }}>
                <div className="h-full rounded-full" style={{ width: `${pct}%`, background: "#39e673", boxShadow: "0 0 8px rgba(57,230,115,0.5)" }} />
              </div>
              <div className="fs-11 font-mono c-accent text-right" style={{ width: 70, flexShrink: 0 }}>${Math.round(a.earnings30d).toLocaleString()}</div>
            </div>
          );
        })}
      </div>

      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
        {accounts.map((a) => {
          const insight = creatorInsight(a);
          const color = TONE_COLOR[insight.tone];
          return (
            <div key={`${a.model}-${a.accountType}-card`} className="rounded-lg p-3" style={{
              background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.08)", borderLeft: `3px solid ${color}`,
            }}>
              <div className="flex items-baseline justify-between mb-2">
                <span className="fs-12 font-mono font-bold c-text">{a.model}{a.accountType === "free" ? " · free" : ""}</span>
                <span className="fs-12 font-mono c-accent">${Math.round(a.earnings30d).toLocaleString()}</span>
              </div>
              <div className="flex flex-col gap-1 mb-2">
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>OF rank</span><span className="c-muted">{a.performanceRank != null ? `#${a.performanceRank}` : "—"}</span>
                </div>
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>Reply time</span><span className="c-muted">{a.replyMin != null ? `${a.replyMin} min` : "—"}</span>
                </div>
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>Renew on</span><span className="c-muted">{a.renewPct != null ? `${a.renewPct}%` : "—"}</span>
                </div>
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>Active fans</span><span className="c-muted">{a.activeFans != null ? a.activeFans.toLocaleString() : "—"}</span>
                </div>
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>Profile visitors</span><span className="c-muted">{a.profileVisitors != null ? a.profileVisitors.toLocaleString() : "—"}</span>
                </div>
                <div className="flex justify-between fs-10 font-mono c-faint">
                  <span>Avg sub length</span><span className="c-muted">{a.avgSubscriptionLengthDays != null ? `${a.avgSubscriptionLengthDays}d` : "—"}</span>
                </div>
              </div>
              <p className="fs-10 font-mono" style={{ color, lineHeight: 1.5, opacity: 0.9 }}>{insight.text}</p>
            </div>
          );
        })}
      </div>
    </>
  );

  if (embedded) return content;
  return (
    <div className="c-bg-surface border c-border rounded-xl p-4 mb-6">
      {content}
    </div>
  );
}

function Dashboard({ cards, models, stats, reels, onNavigate, inflowwDailyStats, inflowwSyncing, refreshInfloww, bufferDailyStats, bufferTopPosts, settings }) {
  const [revRange, setRevRange] = useState(7); // 7 or 30
  // "+$X" flash shown briefly next to the big number after a manual refresh actually
  // changes the total — not on every render, only when refresh caused the delta.
  const [deltaFlash, setDeltaFlash] = useState(null);
  const prevTotalRef = useRef(null);
  const refreshPendingRef = useRef(false);

  // Subtle cursor-tilt on the Agency Revenue panel — mutates the DOM
  // directly via ref rather than React state, so mouse movement doesn't
  // re-render this panel (which was restarting the revenue chart's own
  // mount animation on every mouse twitch — the state-based version did
  // exactly that).
  const tiltRef = useRef(null);
  const tiltRectRef = useRef(null);
  const tiltRafRef = useRef(null);
  const handleTiltEnter = () => {
    if (tiltRef.current) tiltRectRef.current = tiltRef.current.getBoundingClientRect();
  };
  const handleTiltMove = (e) => {
    const el = tiltRef.current;
    const rect = tiltRectRef.current;
    if (!el || !rect) return;
    if (tiltRafRef.current) return;
    const clientX = e.clientX, clientY = e.clientY;
    tiltRafRef.current = requestAnimationFrame(() => {
      tiltRafRef.current = null;
      const px = (clientX - rect.left) / rect.width - 0.5;
      const py = (clientY - rect.top) / rect.height - 0.5;
      el.style.transition = "transform 0.1s ease-out";
      el.style.transform = `perspective(1400px) rotateX(${py * -1.5}deg) rotateY(${px * 1.5}deg)`;
    });
  };
  const handleTiltLeave = () => {
    if (tiltRafRef.current) { cancelAnimationFrame(tiltRafRef.current); tiltRafRef.current = null; }
    const el = tiltRef.current;
    if (!el) return;
    el.style.transition = "transform 0.5s ease-out";
    el.style.transform = "perspective(1400px) rotateX(0deg) rotateY(0deg)";
  };

  // Agency revenue: every tracked model's Free + Paid Infloww earnings,
  // summed per day across the whole agency, for whichever range is selected.
  const agencyModelNames = new Set(models.map((m) => m.name));
  const myInflowwRows = (inflowwDailyStats || []).filter((r) => agencyModelNames.has(r.model));
  const hasInflowwData = myInflowwRows.length > 0;

  // Primary Objective — same monthly-revenue-vs-goal strip Neo shows under its
  // orb, mirrored here so it's visible without opening Neo. Same source (this
  // calendar month's real Infloww revenue, all models, Free + Paid combined)
  // and the same $20k fallback goal when no agency goal is set.
  const objNow = new Date();
  const objMonthStart = `${objNow.getFullYear()}-${String(objNow.getMonth() + 1).padStart(2, "0")}-01`;
  const monthRevenue = myInflowwRows.filter((r) => r.statDate >= objMonthStart).reduce((sum, r) => sum + (r.earningsNet || 0), 0);
  const monthGoal = (settings && settings.monthlyRevenueGoal) || 20000;
  const monthPct = Math.min(100, Math.round((monthRevenue / monthGoal) * 100));
  const dayOfMonth = objNow.getDate();
  const daysInMonth = new Date(objNow.getFullYear(), objNow.getMonth() + 1, 0).getDate();

  // "Week" is a rolling 7-day window ending today. "Month" is the calendar month —
  // the 1st through today — by design for the Team dashboard (Creator-side per-model
  // cards use rolling 30/7 day windows instead; different intent, don't unify them).
  // Early in a new month this legitimately has few days of data — that's expected,
  // not a bug, same as any month-to-date figure anywhere else.
  // toISO is the shared local-calendar-date helper defined below with the other
  // date helpers (not UTC-shifted — see its comment there).
  // Calendar week, Monday through today — not a rolling 7-day window. At Monday
  // 00:00 this collapses to just today (a single fresh candle) and fills back in
  // day by day through Sunday, same "to-date" shape as the Month view below.
  const getWeekDays = () => {
    const now = new Date();
    const dow = now.getDay(); // 0=Sun..6=Sat
    const daysSinceMonday = dow === 0 ? 6 : dow - 1;
    const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday);
    const out = [];
    for (const d = new Date(monday); d <= now; d.setDate(d.getDate() + 1)) out.push(toISO(d));
    return out;
  };
  const getMonthDaysToDate = () => {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const out = [];
    for (const d = new Date(first); d <= now; d.setDate(d.getDate() + 1)) out.push(toISO(d));
    return out;
  };
  const days = revRange === 7 ? getWeekDays() : getMonthDaysToDate();
  const sumForDay = (day) => myInflowwRows.filter((r) => r.statDate === day).reduce((t, r) => t + (r.earningsNet || 0), 0);
  const chartData = days.map((day) => ({ date: day, value: sumForDay(day) }));
  const rangeTotal = chartData.reduce((t, d) => t + d.value, 0);

  // Weeks-this-month tracker (below the chart) and its "see all weeks" modal —
  // splits a run of ISO day strings into real Monday-Sunday calendar weeks,
  // same alignment as the Week/Month toggle above AND as OnlyFans' own payout
  // cycle (OF pays out weekly on Mondays) — so a week boundary here always
  // lines up with a real payout boundary. The tradeoff: the first/last week of
  // a month can be shorter than 7 days if the month doesn't start/end on a
  // Monday/Sunday — that's correct, not a bug, same as the main chart above.
  const ORDINAL_WEEK_LABELS = ["First week", "Second week", "Third week", "Fourth week", "Fifth week", "Sixth week"];
  const bucketIntoWeeks = (dayList) => {
    const weeks = [];
    let current = null;
    dayList.forEach((iso) => {
      const d = new Date(iso + "T00:00:00");
      if (d.getDay() === 1 || !current) {
        current = { days: [] };
        weeks.push(current);
      }
      current.days.push(iso);
    });
    return weeks.map((w) => ({
      startISO: w.days[0],
      endISO: w.days[w.days.length - 1],
      total: w.days.reduce((t, day) => t + sumForDay(day), 0),
    }));
  };
  const [showAllWeeksModal, setShowAllWeeksModal] = useState(false);
  const getAllWeeksHistory = () => {
    if (!myInflowwRows.length) return [];
    const earliest = [...new Set(myInflowwRows.map((r) => r.statDate))].sort()[0];
    const now = new Date();
    const todayISO = toISO(now);
    const allDays = [];
    for (const d = new Date(earliest + "T00:00:00"); toISO(d) <= todayISO; d.setDate(d.getDate() + 1)) allDays.push(toISO(d));
    return bucketIntoWeeks(allDays).reverse();
  };
  // Same real Monday-Sunday buckets as "See all weeks" (built from the whole
  // history), just filtered down to weeks whose start falls in the current
  // calendar month — not a fresh rebucketing from day 1 of the month, which
  // used to invent a bogus short "week" for day 1-2 whenever the month didn't
  // start on a Monday. Those stray leading days actually belong to the last
  // week of the PREVIOUS month, same as "See all weeks" already treats them,
  // so this keeps the two views in agreement on both the week boundaries and
  // how many weeks the month actually has.
  const weeksThisMonth = (() => {
    const now = new Date();
    return getAllWeeksHistory()
      .filter((w) => {
        const d = new Date(w.startISO + "T00:00:00");
        return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
      })
      .sort((a, b) => a.startISO.localeCompare(b.startISO));
  })();
  const fmtWeekRange = (startISO, endISO) => {
    const s = new Date(startISO + "T00:00:00"), e = new Date(endISO + "T00:00:00");
    const fmt = (d, withYear) => d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: withYear ? "numeric" : undefined });
    return `${fmt(s, s.getFullYear() !== e.getFullYear())} – ${fmt(e, true)}`;
  };

  useEffect(() => {
    if (refreshPendingRef.current) {
      refreshPendingRef.current = false;
      const delta = rangeTotal - (prevTotalRef.current || 0);
      if (Math.round(delta) !== 0) {
        setDeltaFlash({ amount: delta, key: Date.now() });
        setTimeout(() => setDeltaFlash(null), 2400);
      }
    }
  }, [rangeTotal]);

  const handleRefreshClick = async () => {
    refreshPendingRef.current = true;
    prevTotalRef.current = rangeTotal;
    await refreshInfloww();
  };

  // Previous period for the delta badge. Week: the prior rolling 7-day window (one clean
  // shift back, same as the window above is a rolling shift forward).
  // Month: the ENTIRE prior calendar month, not just the same handful of days-so-far — matching
  // day-count against a month that just started made the % swing wildly (e.g. +14000% comparing
  // day 1 vs day 1). Comparing to last month's full total reads sane the whole month through.
  const prevDays = revRange === 7
    ? days.map((day) => { const d = new Date(day + "T00:00:00"); d.setDate(d.getDate() - 7); return toISO(d); })
    : (() => {
        const now = new Date();
        const prevFirst = new Date(now.getFullYear(), now.getMonth() - 1, 1);
        const prevLast = new Date(now.getFullYear(), now.getMonth(), 0);
        const out = [];
        for (const d = new Date(prevFirst); d <= prevLast; d.setDate(d.getDate() + 1)) out.push(toISO(d));
        return out;
      })();
  const prevTotal = prevDays.reduce((t, day) => t + sumForDay(day), 0);

  // Per-model split for the "Earnings by model" list below the chart — always the
  // same rolling window as the chart above it (7 or 30 days), so the number here
  // never disagrees with what's plotted. Goal: her latest weekly earningsGoal in
  // 7D mode, her monthlyGoal in 30D mode — never the agency-wide default, an unset
  // personal goal means no goal shown for her, not a borrowed agency number.
  const daySet = new Set(days);
  const modelEarnings = models
    .map((m) => {
      const value = myInflowwRows.filter((r) => r.model === m.name && daySet.has(r.statDate)).reduce((t, r) => t + (r.earningsNet || 0), 0);
      let goal = null;
      if (revRange === 7) {
        const latestStat = [...stats].filter((s) => s.model === m.name && s.earningsGoal)
          .sort((a, b) => (b.weekOf || "").localeCompare(a.weekOf || ""))[0];
        goal = latestStat ? latestStat.earningsGoal : null;
      } else {
        goal = (m.monthlyGoal != null && m.monthlyGoal !== "") ? Number(m.monthlyGoal) : null;
      }
      return { name: m.name, value, goal };
    })
    .sort((a, b) => b.value - a.value);
  const modelEarningsMax = Math.max(1, ...modelEarnings.map((m) => m.value));
  const goalPeriodLabel = revRange === 7 ? "weekly" : "monthly";

  return (
    <div>
      <div ref={tiltRef}
        onMouseEnter={handleTiltEnter}
        onMouseMove={handleTiltMove}
        onMouseLeave={handleTiltLeave}

// ---------- date helpers ----------

const toISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const todayISO = () => toISO(new Date());
const addDays = (iso, n) => {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return toISO(d);
};
const fmtDay = (iso) => {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
};

// ---------- tasks ----------

function TaskManager({ tasks, persistTasks, models, restrictModel }) {
  const [adding, setAdding] = useState(false);
  const [title, setTitle] = useState("");
  const [model, setModel] = useState(restrictModel || "");
  const [assignee, setAssignee] = useState("");
  const [dueDate, setDueDate] = useState(todayISO());
  const [recurring, setRecurring] = useState(false);
  const [filter, setFilter] = useState(restrictModel || "all");

  const nextSeq = () => (tasks.reduce((m, t) => Math.max(m, t.seq || 0), 0) + 1);

  const addTask = async () => {
    if (!title.trim()) return;
    const task = {
      id: uid(), seq: nextSeq(), title, model: restrictModel || model, assignee, dueDate, recurring,
      status: "todo", notes: "", createdAt: Date.now(),
    };
    await persistTasks([...tasks, task]);
    setTitle(""); setModel(restrictModel || ""); setAssignee(""); setDueDate(todayISO()); setRecurring(false); setAdding(false);
  };

  const toggleDone = async (task) => {
    const done = task.status !== "done";
    let next = tasks.map((t) => (t.id === task.id ? { ...t, status: done ? "done" : "todo" } : t));
    if (done && task.recurring) {
      next = [...next, {
        id: uid(), seq: nextSeq() + 1, title: task.title, model: task.model, assignee: task.assignee,
        dueDate: addDays(task.dueDate || todayISO(), 7), recurring: true,
        status: "todo", notes: task.notes, createdAt: Date.now(),
      }];
    }
    await persistTasks(next);
  };

  const deleteTask = async (id) => {
    await persistTasks(tasks.filter((t) => t.id !== id));
  };

  const visible = (filter === "all" ? tasks : tasks.filter((t) => t.model === filter))
    .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
  const overdue = (t) => t.status !== "done" && t.dueDate && t.dueDate < todayISO();

  return (
    <div>
      <div className="flex items-center justify-between mb-4 gap-3 flex-wrap">
        {!restrictModel && (
          <div className="flex items-center gap-1.5 flex-wrap">
            <button onClick={() => setFilter("all")}
              className={`fs-11 font-mono uppercase px-2.5 py-1 rounded-lg border ${filter === "all" ? "c-border-accent c-accent" : "c-border c-muted"}`}>
              All
            </button>
            {models.map((m) => (
              <button key={m.name} onClick={() => setFilter(m.name)}
                className={`fs-11 font-mono uppercase px-2.5 py-1 rounded-lg border ${filter === m.name ? "c-border-accent c-accent" : "c-border c-muted"}`}>
                {m.name}
              </button>
            ))}
          </div>
        )}
        {restrictModel && <span className="fs-11 font-mono uppercase c-accent">{restrictModel}'s tasks</span>}
        <button onClick={() => setAdding(true)}
          className="flex items-center gap-1.5 fs-11 font-mono uppercase tracking-wide c-bg-accent c-onaccent px-3 py-1.5 rounded-lg font-semibold hover-bg-accent2">
          <Plus size={13} /> New task
        </button>
      </div>

      {adding && (
        <div className="mb-4 c-bg-surface border c-border rounded-xl p-3 flex gap-2 flex-wrap items-center">
          <input autoFocus value={title} onChange={(e) => setTitle(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && addTask()} placeholder="Task, e.g. upload weekly photo set..."
            className="flex-1 minw-180 c-bg-app border c-border rounded-lg px-2.5 py-2 text-sm c-text outline-none focus-border-accent" />
          {!restrictModel && (
            <select value={model} onChange={(e) => setModel(e.target.value)}
              className="c-bg-app border c-border rounded-lg px-2.5 py-2 text-sm c-text outline-none">
              <option value="">Model</option>
              {models.map((m) => <option key={m.name} value={m.name}>{m.name}</option>)}
            </select>
          )}
          <input type="date" value={dueDate} onChange={(e) => setDueDate(e.target.value)}
            className="c-bg-app border c-border rounded-lg px-2.5 py-2 text-sm c-text outline-none" />
          {!restrictModel && (
            <input value={assignee} onChange={(e) => setAssignee(e.target.value)} placeholder="Assignee (Martin, chatter...)"
              className="minw-180 c-bg-app border c-border rounded-lg px-2.5 py-2 text-sm c-text outline-none focus-border-accent" />
          )}
          <label className="flex items-center gap-1.5 fs-11 font-mono uppercase c-muted">
            <input type="checkbox" checked={recurring} onChange={(e) => setRecurring(e.target.checked)} />
            weekly
          </label>
          <button onClick={addTask} className="px-3 py-2 rounded-lg c-bg-accent c-onaccent text-xs font-mono uppercase font-semibold">Add</button>
          <button onClick={() => setAdding(false)} className="px-3 py-2 rounded-lg border c-border c-muted text-xs font-mono uppercase">Cancel</button>
        </div>
      )}

      {visible.length === 0 ? (
        <div className="fs-12 c-faint font-mono italic py-10 text-center border border-dashed c-border rounded-xl">no tasks</div>
      ) : (
        <div className="space-y-2">
          {visible.map((t) => (
            <div key={t.id}
              className={`flex items-center gap-3 c-bg-surface border rounded-xl px-3 py-2.5 group ${t.status === "done" ? "c-border opacity-50" : overdue(t) ? "c-border-warn-a" : "c-border"}`}>
              <button onClick={() => toggleDone(t)} className="flex-shrink-0">
                <CheckCircle2 size={18} className={t.status === "done" ? "c-success" : "c-border2"} />
              </button>
              <div className="flex-1 min-w-0">
                <div className={`text-sm c-text ${t.status === "done" ? "line-through" : ""}`}>{t.title}</div>
                <div className="flex items-center gap-2 fs-10 font-mono c-muted mt-0.5">
                  {t.model && <span>{t.model}</span>}
                  {t.assignee && <span className="flex items-center gap-0.5"><User size={10} />{t.assignee}</span>}
                  {t.dueDate && <span className={overdue(t) ? "c-warn" : ""}>{fmtDay(t.dueDate)}</span>}
                  {t.recurring && <span className="flex items-center gap-0.5"><Repeat size={10} />weekly</span>}
                </div>
              </div>
              <button onClick={() => deleteTask(t.id)}
                className="opacity-0 group-hover:opacity-100 c-muted hover-warn transition-opacity flex-shrink-0">
                <Trash2 size={13} />
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ---------- calendar ----------

function CalendarView({ cards, tasks, onNavigate, restrictModel }) {
  const [cursor, setCursor] = useState(() => {
    const t = new Date();
    return { year: t.getFullYear(), month: t.getMonth() };
  });
  const [selected, setSelected] = useState(todayISO());

  const first = new Date(cursor.year, cursor.month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });

  const scopedCards = restrictModel ? cards.filter((c) => c.model === restrictModel) : cards;
  const scopedTasks = restrictModel ? tasks.filter((t) => t.model === restrictModel) : tasks;

  const itemsByDate = {};
  scopedCards.forEach((c) => {
    if (!c.deadline) return;
    (itemsByDate[c.deadline] ||= []).push({ type: "scene", label: c.title, color: STAGES.find((s) => s.id === c.stage)?.color, model: c.model });
  });
  scopedTasks.forEach((t) => {
    if (!t.dueDate || t.status === "done") return;
    (itemsByDate[t.dueDate] ||= []).push({ type: "task", label: t.title, color: "#8B93A1", model: t.model });
  });

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const shiftMonth = (delta) => {
    let m = cursor.month + delta, y = cursor.year;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  const dayISO = (d) => `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;

  return (
    <div className="grid grid-cols-1 lg:grid-cols-5 gap-4">
      <div className="lg:col-span-3 c-bg-surface border c-border rounded-xl p-4">
        <div className="flex items-center justify-between mb-4">
          <span className="fs-13 c-text font-medium">{monthLabel}</span>
          <div className="flex gap-1">
            <button onClick={() => shiftMonth(-1)} className="p-1 rounded-lg border c-border c-muted hover-accent-text hover-border-accent"><ChevronLeft size={14} /></button>
            <button onClick={() => shiftMonth(1)} className="p-1 rounded-lg border c-border c-muted hover-accent-text hover-border-accent"><ChevronRight size={14} /></button>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => (
            <div key={d} className="fs-9 font-mono uppercase c-faint text-center py-1">{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const iso = dayISO(d);
            const items = itemsByDate[iso] || [];
            const isToday = iso === todayISO();
            const isSelected = iso === selected;
            return (
              <button key={i} onClick={() => setSelected(iso)}
                className={`aspect-square rounded-lg border p-1 flex flex-col items-start text-left transition-colors ${isSelected ? "c-border-accent" : "c-border"} ${isToday ? "c-bg-accent-a0" : "hover-bg-app"}`}>
                <span className={`fs-10 font-mono ${isToday ? "c-accent" : "c-muted"}`}>{d}</span>
                <div className="flex flex-wrap gap-0.5 mt-auto">
                  {items.slice(0, 3).map((it, idx) => (
                    <span key={idx} style={{ backgroundColor: it.color }} className="w-1.5 h-1.5 rounded-full" />
                  ))}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="lg:col-span-2 c-bg-surface border c-border rounded-xl p-4">
        <div className="flex items-center justify-between mb-3">
          <span className="fs-11 uppercase tracking-widest c-muted font-mono">{fmtDay(selected) || "—"}</span>
          <button onClick={() => onNavigate("content")} className="fs-11 font-mono uppercase c-accent hover:underline">Board →</button>
        </div>
        {(itemsByDate[selected] || []).length === 0 ? (
          <div className="fs-11 c-faint font-mono italic py-6 text-center">nothing scheduled</div>
        ) : (
          <div className="space-y-2">
            {(itemsByDate[selected] || []).map((it, idx) => (
              <div key={idx} className="flex items-center gap-2 text-xs">
                {it.type === "task" ? <CheckSquare size={12} className="c-idea flex-shrink-0" /> : <Circle size={8} fill={it.color} color={it.color} className="flex-shrink-0" />}
                <span className="c-text truncate flex-1">{it.label || "Untitled"}</span>
                <span className="c-muted font-mono fs-10">{it.model || "—"}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

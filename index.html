// Shared across the whole app (not inside any component) so it can be
// "unlocked" the instant someone clicks the Neo nav item — well before
// NeoPage itself mounts (boot sequence + render both take real time, and by
// then a fresh audio element would be past the browser's autoplay-permission
// window). NeoPage reuses this exact element instead of creating its own.
let sharedNeoAudioEl = null;
function primeNeoAudioUnlock() {
  if (!sharedNeoAudioEl) {
    sharedNeoAudioEl = new Audio(
      "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA="
    );
  }
  sharedNeoAudioEl.play().catch(() => {});
}

// Kicked off in parallel with the boot sequence (right when the Neo nav
// item is clicked) instead of waiting until NeoPage mounts — the greeting's
// TTS fetch is the slow part, and running it during the ~1.6s boot animation
// means the actual audio.play() call, once NeoPage mounts, happens much
// sooner after the original tap. iOS Safari in particular won't allow
// autoplay if too much real time has passed since the last user gesture.
let prefetchedGreetingUrl = null;
function prefetchNeoGreeting(text) {
  prefetchedGreetingUrl = (async () => {
    try {
      const { data, error } = await supabaseClient.functions.invoke("neo-tts", { body: { text } });
      if (error) throw error;
      const rawBytes = data instanceof Blob ? await data.arrayBuffer() : data;
      const header = new Uint8Array(rawBytes.slice(0, 3));
      const isId3 = header[0] === 0x49 && header[1] === 0x44 && header[2] === 0x33;
      const isMpegSync = header[0] === 0xFF && (header[1] & 0xE0) === 0xE0;
      if (!isId3 && !isMpegSync) return null;
      return URL.createObjectURL(new Blob([rawBytes], { type: "audio/mpeg" }));
    } catch {
      return null;
    }
  })();
}

if (!window.storage) {
  window.storage = {
    async get(key) {
      const cfg = TABLES[key];
      if (!cfg) return null;
      try {
        if (cfg.mode === "singleton") {
          const { data, error } = await supabaseClient.from(cfg.table).select("*").eq("id", 1).maybeSingle();
          if (error || !data) return null;
          return { key, value: JSON.stringify(cfg.fromDb(data)) };
        }
        const { data, error } = await supabaseClient.from(cfg.table).select("*");
        if (error) { console.error("storage.get", key, error); return null; }
        return { key, value: JSON.stringify((data || []).map(cfg.fromDb)) };
      } catch (e) { console.error("storage.get threw", key, e); return null; }
    },
    async set(key, value) {
      const cfg = TABLES[key];
      if (!cfg) return null;
      try {
        const parsed = JSON.parse(value);
        if (cfg.mode === "singleton") {
          const { error } = await supabaseClient.from(cfg.table).upsert(cfg.toDb(parsed));
          if (error) { console.error("storage.set", key, error); return null; }
          return { key, value };
        }
        const rows = parsed.map(cfg.toDb);
        if (rows.length) {
          const { error } = await supabaseClient.from(cfg.table).upsert(rows);
          if (error) { console.error("storage.set upsert", key, error); return null; }
        }
        // Remove rows that are no longer present in the current array (handles deletes).
        const { data: existing } = await supabaseClient.from(cfg.table).select(cfg.idKey);
        const currentIds = new Set(rows.map((r) => r[cfg.idKey]));
        const toDelete = (existing || []).map((r) => r[cfg.idKey]).filter((id) => !currentIds.has(id));
        if (toDelete.length) {
          await supabaseClient.from(cfg.table).delete().in(cfg.idKey, toDelete);
        }
        return { key, value };
      } catch (e) { console.error("storage.set threw", key, e); return null; }
    },
    async delete(key) {
      const cfg = TABLES[key];
      if (!cfg) return null;
      try {
        if (cfg.mode === "singleton") await supabaseClient.from(cfg.table).delete().eq("id", 1);
        else await supabaseClient.from(cfg.table).delete().neq(cfg.idKey, "__none__");
        return { key, deleted: true };
      } catch { return null; }
    },
    async list() { return { keys: Object.keys(TABLES) }; },
  };
}

/* JARVIS-style "materialize" reveal: a scan-line wipe uncovers the element
   left-to-right, with a couple of quick brightness flickers right as it
   lands, plus a brief glow flash — reads as HUD text booting up, not a
   plain fade. Uses clip-path/filter, so ONLY ever apply to text/HTML
   elements — never to the orb's own container, since those properties can
   break WebGL canvas compositing in some browsers (was making the orb
   render gray). */
@keyframes neoScanReveal {
  0%   { clip-path: inset(0 100% 0 0); opacity: 0; }
  55%  { clip-path: inset(0 0% 0 0); opacity: 1; }
  100% { clip-path: inset(0 0% 0 0); opacity: 1; }
}
@keyframes neoScanRevealR {
  0%   { clip-path: inset(0 0 0 100%); opacity: 0; }
  55%  { clip-path: inset(0 0 0 0%); opacity: 1; }
  100% { clip-path: inset(0 0 0 0%); opacity: 1; }
}
@keyframes neoMaterializeFlicker {
  0%   { opacity: 0; filter: brightness(1) drop-shadow(0 0 0 transparent); text-shadow: 0 0 0 transparent; }
  6%   { opacity: 1; filter: brightness(2.4) drop-shadow(0 0 10px currentColor); text-shadow: -2px 0 rgba(255,90,90,0.7), 2px 0 rgba(90,180,255,0.7); }
  12%  { opacity: 0.15; text-shadow: none; }
  18%  { opacity: 1; filter: brightness(2) drop-shadow(0 0 8px currentColor); text-shadow: 2px 0 rgba(255,90,90,0.6), -2px 0 rgba(90,180,255,0.6); }
  26%  { opacity: 0.2; text-shadow: none; }
  34%  { opacity: 1; filter: brightness(1.6) drop-shadow(0 0 5px currentColor); }
  42%  { opacity: 0.5; }
  50%  { opacity: 1; filter: brightness(1.2) drop-shadow(0 0 2px currentColor); }
  100% { opacity: 1; filter: brightness(1) drop-shadow(0 0 0 transparent); text-shadow: none; }
}
.neo-fade-in {
  opacity: 0;
  animation: neoScanReveal 0.5s steps(14, end) forwards, neoMaterializeFlicker 0.85s ease-out forwards;
}

  animation: neoScanRevealR 0.5s steps(14, end) forwards, neoMaterializeFlicker 0.85s ease-out forwards;
}
/* Safe fade for anything wrapping a canvas/WebGL element — opacity only,

/* Slowly flowing circuit-board background: dashed current running along
   the traces, dots breathing — subtle, not distracting. */
.circuit-line {

@keyframes neoCircuitTrace {
  0%   { stroke-dashoffset: 500; }   /* fully hidden */
  35%  { stroke-dashoffset: 0; }     /* fully drawn in */
  65%  { stroke-dashoffset: 0; }     /* holds, fully visible */
  100% { stroke-dashoffset: -500; }  /* erases away, same direction */
}
@keyframes neoCircuitDotPulse {

/* Revenue chart boot-in: line traces itself in like a terminal drawing a

// ---------- storage hooks ----------

// Generic hook for array-shaped tables (cards, tasks, stats, reels, trends,
// integrations, models). Reads the whole table on load; on persist(next),
// upserts every row in `next` and deletes whatever existed before but isn't
// in `next` anymore — so the UI's "replace the whole array" style keeps
// working exactly like it did with the old (broken) storage.
function useSupaTable(table, idField, fallback, toJS, toDB) {
  const [value, setValue] = useState(fallback);
  const [loading, setLoading] = useState(true);
  const prevIdsRef = useRef(new Set());

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data, error } = await supabaseClient.from(table).select("*");
      if (error) throw error;
      const mapped = (data || []).map(toJS);
      prevIdsRef.current = new Set(mapped.map((r) => r[idField]));
      setValue(mapped.length ? mapped : fallback);
    } catch (e) {
      console.error("load failed for " + table, e);
      setValue(fallback);
    }
    setLoading(false);
  }, [table]);

  useEffect(() => { load(); }, [load]);

  const persist = async (next) => {
    setValue(next);
    try {
      const nextIds = new Set(next.map((r) => r[idField]));
      const removed = [...prevIdsRef.current].filter((id) => !nextIds.has(id));
      if (next.length) {
        const { error } = await supabaseClient.from(table).upsert(next.map(toDB), { onConflict: idField });
        if (error) throw error;
      }
      if (removed.length) {
        const { error } = await supabaseClient.from(table).delete().in(idField, removed);
        if (error) throw error;
      }
      prevIdsRef.current = nextIds;
    } catch (e) {
      console.error("save failed for " + table, e);
    }
  };

  return { value, loading, persist, reload: load };
}

// settings is a single fixed row (id = 1), not an array.
function useSupaAppState(key, fallback) {
  const [value, setValue] = useState(fallback);
  const [loading, setLoading] = useState(true);

  const load = useCallback(async () => {
    setLoading(true);
    try {
      const { data, error } = await supabaseClient.from("app_state").select("*").eq("key", key).maybeSingle();
      if (error) throw error;
      setValue(data ? data.value : fallback);
    } catch (e) {
      console.error("load failed for app_state:" + key, e);
      setValue(fallback);
    }
    setLoading(false);
  }, [key]);

  useEffect(() => { load(); }, [load]);

  const persist = async (next) => {
    setValue(next);
    try {
      const { error } = await supabaseClient.from("app_state").upsert({ key, value: next, updated_at: new Date().toISOString() });
      if (error) throw error;
    } catch (e) {
      console.error("save failed for app_state:" + key, e);
    }
  };

  return { value, loading, persist };
}

function CountUp({ value, prefix = "", duration = 600 }) {
  const [display, setDisplay] = useState(0);
  useEffect(() => {
    let raf;
    const start = performance.now();
    const from = 0;
    const tick = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setDisplay(Math.round(from + (value - from) * eased));
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <>{prefix}{display.toLocaleString()}</>;
}

            className="px-3 py-2 rounded-lg border c-border c-warn text-xs font-mono uppercase hover-border-warn">
            Delete
          </button>
          <button onClick={() => onSave(form)}
            className="flex-1 py-2 rounded-lg c-bg-accent c-onaccent text-xs font-mono uppercase tracking-wide font-semibold hover-bg-accent2">
            Save changes
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- X bulk upload & auto-caption studio ----------

function XCaptionStudio({ models, restrictModel, filterModel, onBackToModels }) {
  const scopedModels = restrictModel ? models.filter((m) => m.name === restrictModel) : models;
  const [selectedModel, setSelectedModel] = React.useState(
    restrictModel || (filterModel && filterModel !== "all" ? filterModel : scopedModels[0]?.name || "")
  );
  React.useEffect(() => {
    if (restrictModel) { setSelectedModel(restrictModel); return; }
    if (filterModel && filterModel !== "all") setSelectedModel(filterModel);
  }, [filterModel, restrictModel]);

  const model = scopedModels.find((m) => m.name === selectedModel);

  return (
    <>
    {onBackToModels && (
      <button onClick={onBackToModels}
        className="flex items-center gap-1 fs-10 font-mono uppercase c-faint hover-accent-text mb-3 transition-colors">
        <ChevronLeft size={12} /> All models
      </button>
    )}
    {!restrictModel && scopedModels.length > 1 && (
      <div className="flex items-center gap-1.5 flex-wrap mb-4">
        {scopedModels.map((m) => (
          <button key={m.name} onClick={() => setSelectedModel(m.name)}
            className={`fs-11 font-mono uppercase px-2.5 py-1 rounded-lg border ${selectedModel === m.name ? "c-border-accent c-accent c-bg-accent-a2" : "c-border c-muted hover-bg-surface"}`}>
            {m.name}
          </button>
        ))}
      </div>
    )}
    {model && <XMassPlanner models={models} lockedModel={model.name} defaultOpen={true} />}
    </>
  );
}

// Default posting hours per chosen frequency, used until a model has enough
// of her own post history for computeBestHours (below) to take over — spread
// across the day rather than clustered, same spirit as the old fixed 11/17.
const DEFAULT_SLOT_HOURS = { 1: [11], 2: [11, 17], 3: [9, 13, 19] };

// Builds the next N posting slots from a sorted list of hours-of-day (e.g.
// [9, 13, 19]), starting from whichever is next available on/after
// startFrom (at least a few minutes from now, if startFrom is today or
// earlier) and cycling through the list, one day at a time once it wraps.
// Each model gets her own independent sequence — two different models both
// landing on the same day/time is fine, they're different accounts.
function nextMassPlannerSlots(n, hours, startFrom) {
  const list = hours && hours.length ? [...hours].sort((a, b) => a - b) : DEFAULT_SLOT_HOURS[2];
  const slots = [];
  const now = new Date();
  const base = startFrom && startFrom > now ? startFrom : now;
  let dayOffset = 0;
  let hourIdx = list.findIndex((h) => {
    const candidate = new Date(base);
    candidate.setHours(h, 0, 0, 0);
    return candidate > base;
  });
  if (hourIdx === -1) { hourIdx = 0; dayOffset = 1; }
  for (let i = 0; i < n; i++) {
    const slot = new Date(base);
    slot.setDate(base.getDate() + dayOffset);
    slot.setHours(list[hourIdx], 0, 0, 0);
    slots.push(slot);
    hourIdx++;
    if (hourIdx >= list.length) { hourIdx = 0; dayOffset++; }
  }
  return slots;
}

// Data-driven "best hours to post" for one model: pulls her recent X post
// history from Publer, buckets posts by the hour they went out, and ranks
// hours by average reach — an hour only counts once it has at least 2 posts
// behind it, so a single lucky 3am post can't crown 3am as the best time.
// Falls back to null (caller uses DEFAULT_SLOT_HOURS) when there isn't
// enough history yet.
async function computeBestHours(modelName) {
  const { data, error } = await supabaseClient.functions.invoke("publer-posts", {
    body: { modelName, platform: "x", days: 90 },
  });
  if (error || !data?.posts?.length) return null;
  const buckets = {};
  data.posts.forEach((p) => {
    if (!p.scheduledAt) return;
    const hour = new Date(p.scheduledAt).getHours();
    if (!buckets[hour]) buckets[hour] = { total: 0, count: 0 };
    buckets[hour].total += p.reach || 0;
    buckets[hour].count += 1;
  });
  const ranked = Object.entries(buckets)
    .filter(([, b]) => b.count >= 2)
    .map(([hour, b]) => ({ hour: Number(hour), avgReach: b.total / b.count, count: b.count }))
    .sort((a, b) => b.avgReach - a.avgReach);
  return ranked.length ? ranked : null;
}

// Downscales + re-encodes a photo before it goes to x-caption-generate as a
// vision input — Claude only needs enough resolution to read what's in the
// shot, not the original multi-megabyte file, and keeping the request small
// matters since a batch sends every photo in one call. Capped at 1024px on
// the long edge, re-encoded as JPEG q=0.82.
//
// This ONLY produces a throwaway copy for the caption-generation API call —
// the actual file that gets uploaded to Publer/X (confirmAndScheduleAll,
// below) is always the untouched original, EXIF and all, so nothing here
// can affect what actually gets posted.
//
// Phone photos routinely store their real orientation as an EXIF tag rather
// than physically rotating the pixels — drawing straight onto a <canvas>
// ignores that tag and can hand Claude a sideways/upside-down copy (which
// then risks a caption that doesn't match what's actually in frame, even
// though the real posted photo is fine). createImageBitmap with
// imageOrientation:"from-image" decodes it already corrected; the manual
// <img> fallback is only for environments where that option isn't supported.
async function fileToVisionImage(file, maxDim = 1024) {
  const drawToJpeg = (source, width, height) => new Promise((resolve, reject) => {
    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;
    canvas.getContext("2d").drawImage(source, 0, 0, width, height);
    canvas.toBlob((blob) => {
      if (!blob) { reject(new Error("Failed to encode image")); return; }
      const reader = new FileReader();
      reader.onload = () => resolve({ mediaType: "image/jpeg", data: String(reader.result).split(",")[1] });
      reader.onerror = () => reject(new Error("Failed to read encoded image"));
      reader.readAsDataURL(blob);
    }, "image/jpeg", 0.82);
  });

  if (typeof createImageBitmap === "function") {
    let bitmap;
    try {
      bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
    } catch (e) {
      bitmap = null; // fall through to the <img> path below
    }
    if (bitmap) {
      let { width, height } = bitmap;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      try {
        return await drawToJpeg(bitmap, width, height);
      } finally {
        bitmap.close();
      }
    }
  }

  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      let { width, height } = img;
      if (width > maxDim || height > maxDim) {
        const scale = maxDim / Math.max(width, height);
        width = Math.round(width * scale);
        height = Math.round(height * scale);
      }
      drawToJpeg(img, width, height).then(resolve, reject).finally(() => URL.revokeObjectURL(url));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Failed to load image")); };
    img.src = url;
  });
}

// Compact inline calendar for picking the Week Planner's posting window —
// swapped in for the old pair of native <input type="date"> fields, which
// looked (and felt) completely disconnected from the rest of the app's
// styling. First click sets the start (and clears any end); a second click
// on/after that date sets the end; clicking before the current start just
// starts a new range from there. Renders inline below its trigger (no
// floating/portal positioning to get wrong) and closes itself once a full
// range is picked or "No end date" is chosen.
function DateRangePicker({ start, end, onChange }) {
  const [open, setOpen] = React.useState(false);
  const [cursor, setCursor] = React.useState(() => {
    const d = new Date((start || toISO(new Date())) + "T00:00:00");
    return { year: d.getFullYear(), month: d.getMonth() };
  });
  // Whether the next click sets the end date rather than restarting the
  // range from scratch. Always false right after opening, so the very first
  // click always sets a fresh start — otherwise the pre-filled default start
  // (today) meant clicking any later date was read as "set the end" and you
  // could never move the start itself forward (e.g. picking a start of
  // tomorrow was impossible: the first click just extended today->tomorrow).
  const [pickingEnd, setPickingEnd] = React.useState(false);

  const first = new Date(cursor.year, cursor.month, 1);
  const startOffset = (first.getDay() + 6) % 7; // Monday-first
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const dayISO = (d) => `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const shiftMonth = (delta) => {
    let m = cursor.month + delta, y = cursor.year;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };

  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const pickDay = (iso) => {
    if (!pickingEnd) {
      onChange(iso, "");
      setPickingEnd(true);
    } else if (iso < start) {
      onChange(iso, ""); // clicked before the chosen start - restart from here
    } else {
      onChange(start, iso);
      setOpen(false);
      setPickingEnd(false);
    }
  };

  const fmt = (iso) => iso ? new Date(iso + "T00:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : null;
  const todayStr = toISO(new Date());

  return (
    <div>
      <button onClick={() => { setOpen((o) => !o); setPickingEnd(false); }}
        className="flex items-center gap-2 c-bg-app border c-border rounded-lg px-3 py-2 fs-11 font-mono c-text tap hover-border-accent transition-colors">
        <Calendar size={12} className="c-accent" />
        {fmt(start) || "Pick a start date"}
        <span className="c-faint">→</span>
        {fmt(end) || <span className="c-faint">no end date</span>}
        <ChevronDown size={12} className={`c-faint transition-transform ${open ? "rotate-180" : ""}`} />
      </button>

      {open && (
        <div className="mt-2 c-bg-app border c-border rounded-xl p-3 inline-block">
          <div className="flex items-center justify-between mb-3 gap-4">
            <span className="fs-11 c-text font-medium">{monthLabel}</span>
            <div className="flex gap-1">
              <button onClick={() => shiftMonth(-1)} className="p-1 rounded-lg border c-border c-muted hover-accent-text hover-border-accent"><ChevronLeft size={12} /></button>
              <button onClick={() => shiftMonth(1)} className="p-1 rounded-lg border c-border c-muted hover-accent-text hover-border-accent"><ChevronRight size={12} /></button>
            </div>
          </div>
          <div className="grid grid-cols-7 gap-1 mb-1">
            {["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => (
              <div key={d} className="fs-9 font-mono uppercase c-faint text-center" style={{ width: 30 }}>{d}</div>
            ))}
          </div>
          <div className="grid grid-cols-7 gap-1">
            {cells.map((d, i) => {
              if (!d) return <div key={i} style={{ width: 30, height: 30 }} />;
              const iso = dayISO(d);
              const isPast = iso < todayStr;
              const isStart = iso === start;
              const isEnd = iso === end;
              const inRange = start && end && iso > start && iso < end;
              const isToday = iso === todayStr;
              return (
                <button key={i} disabled={isPast} onClick={() => pickDay(iso)}
                  className="rounded-lg fs-10 font-mono flex items-center justify-center transition-colors disabled:cursor-not-allowed"
                  style={{
                    width: 30, height: 30,
                    background: isStart || isEnd ? "#39e673" : inRange ? "rgba(57,230,115,0.16)" : "transparent",
                    color: isStart || isEnd ? "#050705" : isToday ? "#39e673" : isPast ? "rgba(255,255,255,0.25)" : "#f2f5f0",
                    border: isToday && !isStart && !isEnd ? "1px solid rgba(57,230,115,0.4)" : "1px solid transparent",
                    fontWeight: isStart || isEnd ? 700 : 400,
                  }}>
                  {d}
                </button>
              );
            })}
          </div>
          <div className="flex items-center justify-between mt-3 pt-3" style={{ borderTop: "1px solid rgba(255,255,255,0.08)" }}>
            <button onClick={() => { onChange(start || todayStr, ""); }}
              className="fs-10 font-mono uppercase c-faint hover-accent-text transition-colors">
              No end date
            </button>
            <button onClick={() => setOpen(false)}
              className="fs-10 font-mono uppercase c-accent hover-accent-text transition-colors">
              Done
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// Picks all connected models at once, generates + auto-schedules a week of
// captioned posts across their X accounts, and shows a preview grid before
// anything actually gets uploaded/scheduled to Publer.
// lockedModel: when set, the planner always plans for exactly this one
// model — no account picker. A shared photo batch split across several
// models never made sense (a photo belongs to one creator, not a pool), so
// multi-account planning is gone; this always runs one model at a time.
function XMassPlanner({ models, lockedModel, defaultOpen = true }) {
  const [open, setOpen] = React.useState(defaultOpen);
  const [selected, setSelected] = React.useState(lockedModel ? [lockedModel] : []);
  React.useEffect(() => { if (lockedModel) setSelected([lockedModel]); }, [lockedModel]);
  const [photos, setPhotos] = React.useState([]);
  const fileInputRef = React.useRef(null);
  const [plan, setPlan] = React.useState(null);
  const [planning, setPlanning] = React.useState(false);
  const [planError, setPlanError] = React.useState("");
  const [itemStates, setItemStates] = React.useState({});
  const [runningAll, setRunningAll] = React.useState(false);

  // Posting frequency: how many times a day the plan schedules for. The
  // actual clock hours come from computeBestHours (that model's own post
  // history, ranked by reach) when there's enough of it, falling back to
  // DEFAULT_SLOT_HOURS otherwise — so "3x/day" means something different for
  // an account with 6 months of history vs a brand new one, on purpose.
  const [frequency, setFrequency] = React.useState(2);
  const [bestHours, setBestHours] = React.useState(null);
  const [bestHoursLoading, setBestHoursLoading] = React.useState(false);
  React.useEffect(() => {
    if (!lockedModel) { setBestHours(null); return; }
    let cancelled = false;
    setBestHoursLoading(true);
    computeBestHours(lockedModel)
      .then((ranked) => { if (!cancelled) setBestHours(ranked); })
      .catch(() => { if (!cancelled) setBestHours(null); })
      .finally(() => { if (!cancelled) setBestHoursLoading(false); });
    return () => { cancelled = true; };
  }, [lockedModel]);

  const usingStats = bestHours && bestHours.length >= frequency;
  const activeHours = usingStats
    ? bestHours.slice(0, frequency).map((h) => h.hour).sort((a, b) => a - b)
    : DEFAULT_SLOT_HOURS[frequency];

  // Posting window — when the batch should start and (optionally) the last
  // day it's allowed to land on. Start defaults to today; end is optional
  // (an empty end just means "run forward as long as it takes" like before).
  // When an end date IS set, generatePlan checks the batch actually fits
  // (frequency x days in range) before generating anything, instead of
  // silently spilling past the date the user asked to stop at.
  const [rangeStart, setRangeStart] = React.useState(() => toISO(new Date()));
  const [rangeEnd, setRangeEnd] = React.useState("");

  const toggleModel = (name) => setSelected((prev) => prev.includes(name) ? prev.filter((n) => n !== name) : [...prev, name]);

  const addPhotos = (fileList) => {
    const files = Array.from(fileList || []).filter((f) => f.type.startsWith("image/"));
    if (!files.length) return;
    setPhotos((prev) => [...prev, ...files.map((file) => ({ id: uid(), file, name: file.name, previewUrl: URL.createObjectURL(file) }))]);
    setPlan(null);
  };
  const removePhoto = (id) => {
    setPhotos((prev) => {
      const t = prev.find((p) => p.id === id);
      if (t?.previewUrl) URL.revokeObjectURL(t.previewUrl);
      return prev.filter((p) => p.id !== id);
    });
    setPlan(null);
  };

  const modelColor = (name) => MASS_PLANNER_COLORS[selected.indexOf(name) % MASS_PLANNER_COLORS.length];

  const generatePlan = async () => {
    if (!selected.length || !photos.length) return;
    setPlanning(true);
    setPlanError("");
    setPlan(null);
    setItemStates({});
    try {
      const groups = {};
      selected.forEach((n) => { groups[n] = []; });
      photos.forEach((p, i) => groups[selected[i % selected.length]].push(p));

      // If an end date is set, make sure the batch actually fits in the
      // window at the chosen frequency before generating anything (and
      // spending API credit on captions) — better to tell the user up front
      // than to silently spill posts past the date they asked to stop at.
      const startAt = new Date(rangeStart + "T00:00:00");
      if (rangeEnd) {
        const endAt = new Date(rangeEnd + "T23:59:59");
        const daysInRange = Math.max(1, Math.floor((endAt - startAt) / 86400000) + 1);
        const capacity = daysInRange * activeHours.length;
        if (photos.length > capacity) {
          throw new Error(`${photos.length} photos won't fit between ${rangeStart} and ${rangeEnd} at ${frequency}x/day (room for ${capacity}) — pick a later end date, or a higher frequency.`);
        }
      }

      const items = [];
      for (const modelName of selected) {
        const modelPhotos = groups[modelName];
        if (!modelPhotos.length) continue;
        const images = await Promise.all(modelPhotos.map((p) => fileToVisionImage(p.file)));
        const { data, error } = await supabaseClient.functions.invoke("x-caption-generate", {
          body: { modelName, images },
        });
        if (error) {
          const body = await error.context?.json?.().catch(() => null);
          throw new Error(`${modelName}: ${body?.error || error.message}`);
        }
        if (data?.error) throw new Error(`${modelName}: ${data.error}`);
        const captions = data.captions || [];
        const slots = nextMassPlannerSlots(modelPhotos.length, activeHours, startAt);
        // One caption per photo, in the same order they were sent — no more
        // modulo-cycling a small caption pool, since each caption is now
        // written to match that specific photo.
        modelPhotos.forEach((photo, i) => {
          items.push({ id: uid(), model: modelName, photo, caption: captions[i] || "", scheduledAt: slots[i].toISOString() });
        });
      }
      items.sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt));
      setPlan(items);
    } catch (e) {
      setPlanError(e.message || "Failed to generate plan");
    } finally {
      setPlanning(false);
    }
  };

  const setItemState = (id, patch) => setItemStates((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));

  const confirmAndScheduleAll = async () => {
    if (!plan || !plan.length) return;
    setRunningAll(true);
    for (const item of plan) {
      if (itemStates[item.id]?.status === "done") continue;
      setItemState(item.id, { status: "uploading", error: "" });
      try {
        const form = new FormData();
        form.append("file", item.photo.file, item.photo.name);
        const uploadResp = await fetch(`${SUPABASE_URL}/functions/v1/publer-upload-media`, {
          method: "POST", headers: { Authorization: `Bearer ${SUPABASE_ANON_KEY}` }, body: form,
        });
        const uploadJson = await uploadResp.json();
        if (!uploadResp.ok || uploadJson.error) throw new Error(uploadJson.error || "Upload failed");

        setItemState(item.id, { status: "scheduling" });
        const scheduleResp = await fetch(`${SUPABASE_URL}/functions/v1/publer-schedule`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
          body: JSON.stringify({
            modelName: item.model, platform: "x", text: item.caption,
            mediaId: uploadJson.id, scheduledAt: item.scheduledAt,
          }),
        });
        const scheduleJson = await scheduleResp.json();
        if (!scheduleResp.ok || scheduleJson.error) throw new Error(scheduleJson.error || "Scheduling failed");
        setItemState(item.id, { status: "done" });
      } catch (e) {
        setItemState(item.id, { status: "error", error: e.message || "Failed" });
      }
    }
    setRunningAll(false);
  };

  const allDone = plan && plan.length > 0 && plan.every((it) => itemStates[it.id]?.status === "done");
  const doneCount = plan ? plan.filter((it) => itemStates[it.id]?.status === "done").length : 0;

  // Always render a full Mon–Sun-from-today 7-day strip so the shape of the
  // week is visible even on days with nothing scheduled, not just the days
  // that happen to have a post.
  const weekDays = React.useMemo(() => {
    const start = new Date();
    start.setHours(0, 0, 0, 0);
    return Array.from({ length: 7 }, (_, i) => {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      return d.toISOString().slice(0, 10);
    });
  }, [plan]);

  const renderAvatar = (name, size = 28) => (
    <span className="rounded-full flex items-center justify-center font-bold flex-shrink-0"
      style={{
        width: size, height: size, fontSize: size * 0.42,
        background: modelColor(name) + "26", color: modelColor(name),
        border: `1.5px solid ${modelColor(name)}66`,
      }}>
      {name.slice(0, 1).toUpperCase()}
    </span>
  );

  return (
    <div className="mb-5 rounded-2xl p-5 relative overflow-hidden"
      style={{
        background: "radial-gradient(ellipse 120% 100% at 10% 0%, rgba(18,179,76,0.09), transparent 60%), #0b0f0d",
        border: "1px solid rgba(57,230,115,0.16)",
      }}>
      <button onClick={() => setOpen((o) => !o)} className="w-full flex items-center justify-between tap">
        <div className="flex items-center gap-3">
          <div className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0"
            style={{ background: "rgba(57,230,115,0.12)", border: "1px solid rgba(57,230,115,0.3)" }}>
            <Megaphone size={16} className="c-accent" />
          </div>
          <div className="text-left">
            <div className="flex items-center gap-2">
              <span className="text-base font-extrabold tracking-tight c-text">Week Planner</span>
              <XLogo size={11} className="c-muted" />
            </div>
            <p className="fs-11 c-muted mt-0.5">
              {lockedModel ? `Plan ${lockedModel}'s week — captions, photos, and scheduling in one go` : "Plan a week across every X account at once"}
            </p>
          </div>
        </div>
        <div className="flex items-center gap-3 flex-shrink-0">
          {plan && plan.length > 0 && (
            <span className="fs-10 font-mono uppercase px-2 py-1 rounded-lg c-bg-accent-a2 c-accent hidden sm:inline-block">
              {plan.length} posts ready
            </span>
          )}
          <ChevronDown size={16} className={`c-muted transition-transform ${open ? "rotate-180" : ""}`} />
        </div>
      </button>

      {open && (
        <div className="mt-4 pt-4 border-t" style={{ borderColor: "rgba(57,230,115,0.14)" }}>
          {!lockedModel && (
            <>
              <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-2.5">Accounts</div>
              <div className="flex flex-wrap gap-3 mb-5">
                {models.map((m) => {
                  const isOn = selected.includes(m.name);
                  return (
                    <button key={m.name} onClick={() => { toggleModel(m.name); setPlan(null); }}
                      className="flex flex-col items-center gap-1.5 tap group" style={{ width: 60 }}>
                      <div className="relative">
                        <div className="rounded-full flex items-center justify-center font-bold transition-all"
                          style={{
                            width: 44, height: 44, fontSize: 16,
                            background: isOn ? modelColor(m.name) + "22" : "rgba(255,255,255,0.04)",
                            border: isOn ? `2px solid ${modelColor(m.name)}` : "2px solid rgba(255,255,255,0.10)",
                            color: isOn ? modelColor(m.name) : "var(--c-faint, #6b7280)",
                            boxShadow: isOn ? `0 0 14px ${modelColor(m.name)}40` : "none",
                          }}>
                          {m.name.slice(0, 1).toUpperCase()}
                        </div>
                        {isOn && (
                          <div className="absolute -bottom-0.5 -right-0.5 rounded-full flex items-center justify-center"
                            style={{ width: 16, height: 16, background: modelColor(m.name) }}>
                            <Sparkles size={9} style={{ color: "#04150a" }} />
                          </div>
                        )}
                      </div>
                      <span className={`fs-10 font-mono truncate w-full text-center ${isOn ? "c-text font-semibold" : "c-faint"}`}>{m.name}</span>
                    </button>
                  );
                })}
              </div>
            </>
          )}

          <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-2.5">Posting frequency</div>
          <div className="flex items-center gap-3 flex-wrap mb-5">
            <div className="flex rounded-full p-0.5" style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.08)" }}>
              {[1, 2, 3].map((n) => (
                <button key={n} onClick={() => { setFrequency(n); setPlan(null); }}
                  className="fs-11 font-mono uppercase px-3 py-1.5 rounded-full tap"
                  style={frequency === n ? { background: "#39e673", color: "#050705" } : { background: "transparent", color: "#9d9b95" }}>
                  {n}x/day
                </button>
              ))}
            </div>
            <span className="fs-10 font-mono c-faint">
              {bestHoursLoading
                ? "checking her post history…"
                : `at ${activeHours.map((h) => `${String(h).padStart(2, "0")}:00`).join(", ")}`
              }
              {!bestHoursLoading && (
                <span className="ml-1.5" style={{ opacity: 0.7 }}>
                  {usingStats ? "· best times from her own reach history" : "· default times, not enough post history yet"}
                </span>
              )}
            </span>
          </div>

          <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-2.5">
            Post between
            <span className="ml-2 normal-case" style={{ opacity: 0.7 }}>{rangeEnd ? "" : "· runs forward as long as it takes"}</span>
          </div>
          <div className="mb-5">
            <DateRangePicker start={rangeStart} end={rangeEnd}
              onChange={(s, e) => { setRangeStart(s); setRangeEnd(e); setPlan(null); }} />
          </div>

          <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-2.5">
            {lockedModel ? `${lockedModel}'s photos` : "Shared photo batch"}
          </div>
          <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden"
            onChange={(e) => { addPhotos(e.target.files); e.target.value = ""; }} />
          {photos.length === 0 ? (
            <button onClick={() => fileInputRef.current?.click()}
              className="w-full flex flex-col items-center justify-center gap-1.5 border border-dashed rounded-2xl py-8 mb-4 transition-colors tap"
              style={{ borderColor: "rgba(255,255,255,0.14)" }}
              onMouseEnter={(e) => { e.currentTarget.style.borderColor = "rgba(57,230,115,0.5)"; e.currentTarget.style.background = "rgba(57,230,115,0.03)"; }}
              onMouseLeave={(e) => { e.currentTarget.style.borderColor = "rgba(255,255,255,0.14)"; e.currentTarget.style.background = "transparent"; }}>
              <div className="w-9 h-9 rounded-full flex items-center justify-center mb-1" style={{ background: "rgba(255,255,255,0.06)" }}>
                <Plus size={16} className="c-muted" />
              </div>
              <span className="fs-12 c-muted font-mono">Upload photos</span>
              <span className="fs-10 c-faint font-mono">{lockedModel ? "gets scheduled across the coming week" : "drops get split evenly across the accounts above"}</span>
            </button>
          ) : (
            <div className="mb-4">
              <div className="grid grid-cols-6 sm:grid-cols-8 md:grid-cols-12 gap-2 mb-2">
                {photos.map((p) => (
                  <div key={p.id} className="relative rounded-xl overflow-hidden group" style={{ paddingTop: "100%", boxShadow: "0 2px 8px rgba(0,0,0,0.3)" }}>
                    <img src={p.previewUrl} alt={p.name} className="absolute inset-0 w-full h-full object-cover" />
                    <button onClick={() => removePhoto(p.id)}
                      className="absolute top-1 right-1 rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity"
                      style={{ background: "rgba(0,0,0,0.6)" }}>
                      <Trash2 size={10} className="text-white" />
                    </button>
                  </div>
                ))}
                <button onClick={() => fileInputRef.current?.click()}
                  className="rounded-xl flex items-center justify-center border border-dashed c-border hover-border-accent tap" style={{ paddingTop: "100%", position: "relative" }}>
                  <Plus size={16} className="c-muted absolute" />
                </button>
              </div>
              <span className="fs-10 c-faint font-mono">{photos.length} photos queued</span>
            </div>
          )}

          <button onClick={generatePlan} disabled={!selected.length || !photos.length || planning}
            className="flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl c-bg-accent c-onaccent fs-12 font-mono uppercase tracking-wide font-semibold hover-bg-accent2 disabled:opacity-40 tap mb-1"
            style={{ boxShadow: selected.length && photos.length ? "0 0 20px rgba(57,230,115,0.25)" : "none" }}>
            {planning ? <><Loader2 size={14} className="animate-spin" /> Generating captions...</> : <><Sparkles size={14} /> Generate captions</>}
          </button>
          {planError && <div className="fs-10 font-mono mt-1 c-warn">{planError}</div>}

          {plan && plan.length > 0 && (
            <div className="mt-5 pt-4 border-t" style={{ borderColor: "rgba(57,230,115,0.14)" }}>
              <div className="flex items-center justify-between mb-4 flex-wrap gap-3 c-bg-app rounded-xl px-4 py-3" style={{ border: "1px solid rgba(57,230,115,0.12)" }}>
                <div>
                  <div className="text-lg font-extrabold c-text">{plan.length} posts</div>
                  <div className="fs-10 c-muted font-mono">across {selected.length} account{selected.length !== 1 ? "s" : ""} · {new Date(weekDays[0] + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })} – {new Date(weekDays[6] + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })}</div>
                </div>
                <button onClick={confirmAndScheduleAll} disabled={runningAll || allDone}
                  className={`flex items-center gap-2 px-4 py-2.5 rounded-xl fs-12 font-mono uppercase tracking-wide font-semibold tap disabled:opacity-40 ${allDone ? "c-bg-app c-accent border c-border-accent" : "c-bg-accent c-onaccent hover-bg-accent2"}`}
                  style={{ boxShadow: !allDone && !runningAll ? "0 0 20px rgba(57,230,115,0.3)" : "none" }}>
                  {allDone ? <Sparkles size={14} /> : runningAll ? <Loader2 size={14} className="animate-spin" /> : <Send size={14} />}
                  {allDone ? "All scheduled" : runningAll ? `Scheduling... ${doneCount}/${plan.length}` : "Schedule"}
                </button>
              </div>

              <div className="grid gap-2.5" style={{ gridTemplateColumns: "repeat(7, minmax(140px, 1fr))", overflowX: "auto" }}>
                {weekDays.map((day) => {
                  const dayItems = plan.filter((it) => it.scheduledAt.slice(0, 10) === day);
                  const isToday = day === new Date().toISOString().slice(0, 10);
                  const dayName = new Date(day + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" });
                  const dateNum = new Date(day + "T12:00:00").getDate();
                  return (
                    <div key={day} className="flex-shrink-0 rounded-xl p-2"
                      style={{ background: isToday ? "rgba(57,230,115,0.05)" : "rgba(255,255,255,0.015)", border: isToday ? "1px solid rgba(57,230,115,0.25)" : "1px solid rgba(255,255,255,0.06)", minHeight: 120 }}>
                      <div className="flex items-baseline gap-1.5 mb-2 px-0.5">
                        <span className={`fs-11 font-mono uppercase font-semibold ${isToday ? "c-accent" : "c-muted"}`}>{dayName}</span>
                        <span className="fs-10 font-mono c-faint">{dateNum}</span>
                      </div>
                      {dayItems.length === 0 ? (
                        <div className="fs-9 c-faint font-mono italic text-center py-6 opacity-50">—</div>
                      ) : (
                        <div className="flex flex-col gap-2">
                          {dayItems.map((it) => {
                            const st = itemStates[it.id]?.status;
                            return (
                              <div key={it.id} className="relative rounded-lg overflow-hidden" style={{ boxShadow: "0 2px 8px rgba(0,0,0,0.35)" }}>
                                <img src={it.photo.previewUrl} alt="" className="w-full object-cover" style={{ aspectRatio: "1/1" }} />
                                <div className="absolute inset-0" style={{ background: "linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.85) 100%)" }} />
                                <div className="absolute top-1 left-1">{renderAvatar(it.model, 20)}</div>
                                <div className="absolute top-1.5 right-1.5 fs-9 font-mono px-1 rounded" style={{ background: "rgba(0,0,0,0.55)", color: "#fff" }}>
                                  {new Date(it.scheduledAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}
                                </div>
                                <div className="absolute bottom-1 left-1.5 right-1.5 fs-9 leading-snug line-clamp-2" style={{ color: "rgba(255,255,255,0.92)" }}>
                                  {it.caption}
                                </div>
                                {st && (
                                  <div className="absolute inset-0 flex items-center justify-center"
                                    style={{ background: st === "error" ? "rgba(120,20,20,0.45)" : "rgba(0,0,0,0.45)" }}>
                                    {st === "done" && <div className="rounded-full p-1.5" style={{ background: "rgba(57,230,115,0.9)" }}><Sparkles size={12} style={{ color: "#04150a" }} /></div>}
                                    {(st === "uploading" || st === "scheduling") && <Loader2 size={16} className="animate-spin text-white" />}
                                    {st === "error" && <span className="fs-9 font-mono text-white text-center px-1">{itemStates[it.id].error}</span>}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Gradient-filled "mountain" trend line with a hover crosshair + tooltip.
// Single series only — two measures of different scale get two of these,
// never a second y-axis on the same chart.
function AreaTrendChart({ data, color, height = 160, valueFormat }) {
  const [hoverIdx, setHoverIdx] = React.useState(null);
  const svgRef = React.useRef(null);
  const W = 600, H = height, PAD_TOP = 18, PAD_BOTTOM = 22;
  const plotH = H - PAD_TOP - PAD_BOTTOM;
  const values = data.map((d) => d.value);
  const max = Math.max(1, ...values);
  const n = data.length;
  const xAt = (i) => (n <= 1 ? W / 2 : (i / (n - 1)) * W);
  const yAt = (v) => PAD_TOP + plotH - (v / max) * plotH;

  const linePath = data.map((d, i) => `${i === 0 ? "M" : "L"} ${xAt(i)},${yAt(d.value)}`).join(" ");
  const areaPath = `${linePath} L ${xAt(n - 1)},${H - PAD_BOTTOM} L ${xAt(0)},${H - PAD_BOTTOM} Z`;
  const gradId = React.useMemo(() => `areaGrad${Math.random().toString(36).slice(2)}`, []);

  const handleMove = (e) => {
    if (!svgRef.current || n === 0) return;
    const rect = svgRef.current.getBoundingClientRect();
    const relX = ((e.clientX - rect.left) / rect.width) * W;
    let idx = Math.round((relX / W) * (n - 1));
    idx = Math.max(0, Math.min(n - 1, idx));
    setHoverIdx(idx);
  };

  const fmt = valueFormat || ((v) => v.toLocaleString());
  const hover = hoverIdx != null ? data[hoverIdx] : null;

  return (
    <div className="relative">
      <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ display: "block" }}
        onMouseMove={handleMove} onMouseLeave={() => setHoverIdx(null)}>
        <defs>
          <linearGradient id={gradId} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.35" />
            <stop offset="100%" stopColor={color} stopOpacity="0" />
          </linearGradient>
        </defs>
        {[0.25, 0.5, 0.75].map((f) => (
          <line key={f} x1="0" x2={W} y1={PAD_TOP + plotH * f} y2={PAD_TOP + plotH * f}
            stroke="rgba(255,255,255,0.06)" strokeDasharray="3,4" />
        ))}
        <path d={areaPath} fill={`url(#${gradId})`} />
        <path d={linePath} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {hoverIdx != null && (
          <>
            <line x1={xAt(hoverIdx)} x2={xAt(hoverIdx)} y1={PAD_TOP} y2={H - PAD_BOTTOM} stroke={color} strokeOpacity="0.35" strokeWidth="1.5" />
            <circle cx={xAt(hoverIdx)} cy={yAt(hover.value)} r="4.5" fill={color} stroke="#0b0f0d" strokeWidth="2" style={{ filter: `drop-shadow(0 0 6px ${color})` }} />
          </>
        )}
      </svg>
      {hover && (
        <div className="absolute pointer-events-none px-2.5 py-1.5 rounded-lg fs-9 font-mono whitespace-nowrap"
          style={{
            left: `${(xAt(hoverIdx) / W) * 100}%`, top: 0, transform: `translate(${hoverIdx > n / 2 ? "-105%" : "5%"}, 0)`,
            background: "#0c0f0d", border: `1px solid ${color}55`, boxShadow: "0 8px 20px rgba(0,0,0,0.5)",
          }}>
          <div className="c-faint">{new Date(hover.date + "T12:00:00").toLocaleDateString(undefined, { day: "numeric", month: "short" })}</div>
          <div className="font-bold" style={{ color }}>{fmt(hover.value)}</div>
        </div>
      )}
    </div>
  );
}

// Donut with a centered total and a legend — the only chart form here with
// more than one series, so it's the one that needs the legend.
function EngagementDonut({ segments, centerLabel }) {
  const total = segments.reduce((s, seg) => s + seg.value, 0);
  const R = 42, CX = 50, CY = 50, STROKE = 14;
  const circumference = 2 * Math.PI * R;
  let offsetAcc = 0;
  return (
    <div className="flex items-center gap-5 flex-wrap">
      <div className="relative flex-shrink-0" style={{ width: 128, height: 128 }}>
        <svg viewBox="0 0 100 100" style={{ width: "100%", height: "100%", transform: "rotate(-90deg)" }}>
          <circle cx={CX} cy={CY} r={R} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={STROKE} />
          {total > 0 && segments.map((seg, i) => {
            const frac = seg.value / total;
            const dash = frac * circumference;
            const gap = circumference - dash;
            const el = (
              <circle key={i} cx={CX} cy={CY} r={R} fill="none" stroke={seg.color} strokeWidth={STROKE}
                strokeDasharray={`${Math.max(dash - 1.5, 0)} ${gap + 1.5}`} strokeDashoffset={-offsetAcc}
                strokeLinecap="round" style={{ filter: `drop-shadow(0 0 4px ${seg.color}88)` }} />
            );
            offsetAcc += dash;
            return el;
          })}
        </svg>
        <div className="absolute inset-0 flex flex-col items-center justify-center">
          <div className="text-lg font-extrabold c-text leading-none">{total.toLocaleString()}</div>
          <div className="fs-9 c-faint font-mono uppercase mt-0.5">{centerLabel}</div>
        </div>
      </div>
      <div className="flex flex-col gap-1.5 min-w-0">
        {segments.map((seg) => (
          <div key={seg.label} className="flex items-center gap-2 fs-11 font-mono">
            <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ background: seg.color, boxShadow: `0 0 6px ${seg.color}` }} />
            <span className="c-muted">{seg.label}</span>
            <span className="c-text font-semibold ml-auto pl-3">{seg.value.toLocaleString()}</span>
            <span className="c-faint" style={{ width: 36, textAlign: "right" }}>{total > 0 ? Math.round((seg.value / total) * 100) : 0}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// One ring per account, sized by its share of the group total — same
// pattern as a small-multiple bar set, just circular to match the rest of
// this dashboard's rounded language.
function AccountShareRing({ name, color, value, shareOfTotal, sublabel }) {
  const R = 26, STROKE = 5;
  const circumference = 2 * Math.PI * R;
  const dash = Math.max(0, Math.min(1, shareOfTotal)) * circumference;
  return (
    <div className="flex flex-col items-center gap-2" style={{ width: 84 }}>
      <div className="relative" style={{ width: 64, height: 64 }}>

          <circle cx="32" cy="32" r={R} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth={STROKE} />
          <circle cx="32" cy="32" r={R} fill="none" stroke={color} strokeWidth={STROKE}
            strokeDasharray={`${dash} ${circumference - dash}`} strokeLinecap="round"
            style={{ filter: `drop-shadow(0 0 5px ${color}aa)` }} />

}

// Month-grid calendar of what's queued in Publer but not yet posted —
// same visual language as the content-plan CalendarView (dots per day, a
// side panel for the selected day) so "what's scheduled" reads the same
// way everywhere in the app, instead of a plain chronological list.
function ScheduledPostsCalendar({ posts, accountColor, glowRgb }) {
  const initialMonth = React.useMemo(() => {
    const first = posts.find((p) => p.scheduledAt);
    const d = first ? new Date(first.scheduledAt) : new Date();
    return { year: d.getFullYear(), month: d.getMonth() };
  }, []); // eslint-disable-line react-hooks/exhaustive-deps
  const [cursor, setCursor] = React.useState(initialMonth);
  const postsByDate = React.useMemo(() => {
    const map = {};
    posts.forEach((p) => {
      if (!p.scheduledAt) return;
      const iso = toISO(new Date(p.scheduledAt));
      (map[iso] ||= []).push(p);
    });
    Object.values(map).forEach((list) => list.sort((a, b) => new Date(a.scheduledAt) - new Date(b.scheduledAt)));
    return map;
  }, [posts]);
  const firstDateWithPosts = Object.keys(postsByDate).sort()[0];
  const [selected, setSelected] = React.useState(firstDateWithPosts || todayISO());

  const first = new Date(cursor.year, cursor.month, 1);
  const startOffset = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const monthLabel = first.toLocaleDateString("en-US", { month: "long", year: "numeric" });
  const dayISO = (d) => `${cursor.year}-${String(cursor.month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const shiftMonth = (delta) => {
    let m = cursor.month + delta, y = cursor.year;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    setCursor({ year: y, month: m });
  };
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selectedPosts = postsByDate[selected] || [];

  return (
    <div className="grid grid-cols-1 lg:grid-cols-5 gap-3">
      <div className="lg:col-span-2 c-bg-surface rounded-xl p-4" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
        <div className="flex items-center justify-between mb-3">
          <span className="fs-11 c-text font-medium">{monthLabel}</span>
          <div className="flex gap-1">
            <button onClick={() => shiftMonth(-1)} className="p-1 rounded-lg tap" style={{ border: "1px solid rgba(255,255,255,0.1)" }}><ChevronLeft size={12} className="c-muted" /></button>
            <button onClick={() => shiftMonth(1)} className="p-1 rounded-lg tap" style={{ border: "1px solid rgba(255,255,255,0.1)" }}><ChevronRight size={12} className="c-muted" /></button>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">
          {["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"].map((d) => (
            <div key={d} className="fs-9 font-mono uppercase c-faint text-center py-0.5">{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const iso = dayISO(d);
            const items = postsByDate[iso] || [];
            const isToday = iso === todayISO();
            const isSelected = iso === selected;
            return (
              <button key={i} onClick={() => setSelected(iso)}
                className="aspect-square rounded-lg p-1 flex flex-col items-start text-left tap"
                style={{
                  border: isSelected ? `1px solid ${glowRgb}88` : "1px solid rgba(255,255,255,0.06)",
                  background: isToday ? `${glowRgb}14` : "transparent",
                }}>
                <span className="fs-9 font-mono" style={{ color: isToday ? glowRgb : "#9d9b95" }}>{d}</span>
                <div className="flex flex-wrap gap-0.5 mt-auto">
                  {items.slice(0, 4).map((p, idx) => (
                    <span key={idx} style={{ backgroundColor: accountColor(p.model) }} className="w-1.5 h-1.5 rounded-full" />
                  ))}
                </div>
              </button>
            );
          })}
        </div>
      </div>

      <div className="lg:col-span-3 c-bg-surface rounded-xl p-4" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
        <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">{fmtDay(selected) || "—"}</div>
        {selectedPosts.length === 0 ? (
          <div className="fs-11 c-faint font-mono italic py-8 text-center">nothing scheduled this day</div>
        ) : (
          <div className="flex flex-col gap-1.5">
            {selectedPosts.map((p) => {
              const color = accountColor(p.model);
              const ts = p.scheduledAt ? new Date(p.scheduledAt).getTime() : null;
              return (
                <div key={p.id} className="flex items-center gap-3 rounded-lg p-2" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
                  {p.thumbnailUrl ? (
                    <img src={p.thumbnailUrl} alt="" className="flex-shrink-0 rounded-lg object-cover" style={{ width: 44, height: 44 }} />
                  ) : (
                    <div className="flex-shrink-0 rounded-lg c-bg-app" style={{ width: 44, height: 44 }} />
                  )}
                  <span className="fs-10 font-bold px-1.5 py-0.5 rounded flex-shrink-0" style={{ background: color + "26", color }}>{p.model}</span>
                  <div className="flex-1 min-w-0 fs-11 c-text truncate">{p.text || <span className="c-faint italic">No text</span>}</div>
                  <div className="flex-shrink-0 fs-10 font-mono c-faint">{ts ? new Date(ts).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" }) : ""}</div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// Shared landing dashboard for a social platform (X or Instagram): connected
// accounts, a 30-day reach trend, an engagement-mix donut, per-account share
// rings, and a top-posts table — all real numbers from buffer_daily_stats /
// buffer_top_posts, which publer-sync populates hourly for whichever
// platform each Publer account is on. "Plan posts" is the doorway into the
// per-model workflow (caption studio + planner for X; the existing
// Instagram hub for IG).
function PlatformOverviewDashboard({
  platform, label, icon, glowRgb, bgGradient,
  models, bufferDailyStats, bufferTopPosts, competitors, persistCompetitors,
  onPlanPosts, planLabel = "Plan posts", extraSection, noAccountsHint, metricLabel = "Reach",
}) {
  const [account, setAccount] = React.useState("all");
  const [range, setRange] = React.useState(7);

  const allRows = (bufferDailyStats || []).filter((r) => r.platform === platform);
  const connectedNames = new Set(allRows.map((r) => r.model));
  const connectedModels = models.filter((m) => connectedNames.has(m.name));
  const rows = account === "all" ? allRows : allRows.filter((r) => r.model === account);

  const dateNDaysAgo = (n) => { const d = new Date(); d.setDate(d.getDate() - n); return d.toISOString().slice(0, 10); };
  const rangeAgoStr = dateNDaysAgo(range - 1);
  const weekRows = rows.filter((r) => r.statDate >= rangeAgoStr);
  const weekTotals = {
    reach: weekRows.reduce((s, r) => s + (r.impressions || 0), 0),
    posts: weekRows.reduce((s, r) => s + (r.postCount || 0), 0),
    likes: weekRows.reduce((s, r) => s + (r.reactions || 0), 0),
  };
  const erDays = weekRows.filter((r) => r.engagementRate != null);
  const avgEr = erDays.length ? erDays.reduce((s, r) => s + r.engagementRate, 0) / erDays.length : null;

  const trend30 = React.useMemo(() => {
    const dates = Array.from({ length: 30 }, (_, i) => dateNDaysAgo(29 - i));
    return dates.map((date) => ({
      date,
      value: rows.filter((r) => r.statDate === date).reduce((s, r) => s + (r.impressions || 0), 0),
    }));
  }, [rows.length, account]);

  const donutSegments = [
    { label: "Likes", value: weekTotals.likes, color: XNEON.pink.fg },
    { label: "Replies", value: weekRows.reduce((s, r) => s + (r.comments || 0), 0), color: XNEON.blue.fg },
    { label: "Reposts", value: weekRows.reduce((s, r) => s + (r.reposts || 0), 0), color: MASS_PLANNER_COLORS[4] },
  ];

  const accountColor = (name) => MASS_PLANNER_COLORS[connectedModels.findIndex((m) => m.name === name) % MASS_PLANNER_COLORS.length];

  // Live post list (not just the 5-post rolling-7-day snapshot buffer_top_posts
  // keeps) so "Top posts" actually grows/shrinks to match the 7D/30D toggle —
  // same fix already applied on the IG dashboard, backported here. Fetches per
  // selected account, or per every connected account (merged) when "all" is
  // selected, since one publer-posts call only covers a single account.
  const [livePosts, setLivePosts] = React.useState(null);
  React.useEffect(() => {
    const targets = account === "all" ? connectedModels.map((m) => m.name) : [account];
    if (!targets.length) { setLivePosts(null); return; }
    let cancelled = false;
    (async () => {
      try {
        const results = await Promise.all(targets.map((modelName) =>
          supabaseClient.functions.invoke("publer-posts", { body: { modelName, platform, days: range } })
        ));
        if (cancelled) return;
        const merged = results.flatMap((r, i) =>
          !r.error && r.data?.posts ? r.data.posts.map((p) => ({ ...p, model: targets[i] })) : []
        );
        setLivePosts(merged.length ? merged : (results.some((r) => !r.error) ? [] : null));
      } catch (e) {
        if (!cancelled) setLivePosts(null);
      }
    })();
    return () => { cancelled = true; };
  }, [account, range, platform, connectedModels.map((m) => m.name).join(",")]);

  const topPosts = livePosts?.length
    ? livePosts
        .map((p) => ({ model: p.model, text: p.text, thumbnailUrl: p.thumbnailUrl, externalLink: p.postLink, impressions: p.reach }))
        .sort((a, b) => (b.impressions || 0) - (a.impressions || 0))
    : (bufferTopPosts || [])
        .filter((p) => p.platform === platform && connectedNames.has(p.model) && (account === "all" || p.model === account))
        .sort((a, b) => (b.impressions || 0) - (a.impressions || 0));

  // Not-yet-published queue — separate Publer endpoint (state: scheduled)
  // from the analytics one topPosts uses, so it's its own fetch/section.
  const [scheduledPosts, setScheduledPosts] = React.useState(null);
  React.useEffect(() => {
    if (!connectedModels.length) { setScheduledPosts(null); return; }
    let cancelled = false;
    (async () => {
      try {
        const { data, error } = await supabaseClient.functions.invoke("publer-scheduled", {
          body: { platform, ...(account !== "all" ? { modelName: account } : {}) },
        });
        if (cancelled) return;
        setScheduledPosts(!error && data?.scheduled ? data.scheduled : []);
      } catch (e) {
        if (!cancelled) setScheduledPosts([]);
      }
    })();
    return () => { cancelled = true; };
  }, [account, platform, connectedModels.map((m) => m.name).join(",")]);

  // Cursor-tilt, scoped to just the header row (icon/title/CTA) rather than
  // the whole panel — this used to be applied to the entire outer container,
  // which was fine back when that container was small, but it grew into a
  // page-length block (stat tiles, charts, top posts all stacked under it)
  // and rotating something that tall around a small 1400px perspective
  // visibly warped the layout near the top/bottom edges. The header is a
  // fixed-height block regardless of how much data loads below it, so the
  // same bug can't recur here. Direct DOM mutation (not React state) so
  // mouse movement never triggers a re-render of the heavy panel below.
  const tiltRef = React.useRef(null);
  const tiltRectRef = React.useRef(null);
  const tiltRafRef = React.useRef(null);
  const handleTiltEnter = () => {
    if (tiltRef.current) tiltRectRef.current = tiltRef.current.getBoundingClientRect();
  };
  const handleTiltMove = (e) => {
    const el = tiltRef.current;
    const rect = tiltRectRef.current;
    if (!el || !rect) return;
    if (tiltRafRef.current) return;
    const clientX = e.clientX, clientY = e.clientY;
    tiltRafRef.current = requestAnimationFrame(() => {
      tiltRafRef.current = null;
      const px = (clientX - rect.left) / rect.width - 0.5;
      const py = (clientY - rect.top) / rect.height - 0.5;
      el.style.transition = "transform 0.1s ease-out";
      el.style.transform = `perspective(1400px) rotateX(${py * -3}deg) rotateY(${px * 3}deg)`;
    });
  };
  const handleTiltLeave = () => {
    if (tiltRafRef.current) { cancelAnimationFrame(tiltRafRef.current); tiltRafRef.current = null; }
    const el = tiltRef.current;
    if (!el) return;
    el.style.transition = "transform 0.5s ease-out";
    el.style.transform = "perspective(1400px) rotateX(0deg) rotateY(0deg)";
  };

  return (
    <div
      className="rounded-2xl p-5 md:p-7 relative overflow-hidden mb-5"
      style={{
        background: bgGradient, border: `1px solid ${glowRgb}22`,
        "--glow-c": `${glowRgb}73`,
        animation: "panelGlowPulse 6s ease-in-out infinite",
      }}>
      <div className="flex items-start justify-between gap-3 mb-6 flex-wrap">
        <div ref={tiltRef}
          onMouseEnter={handleTiltEnter}
          onMouseMove={handleTiltMove}
          onMouseLeave={handleTiltLeave}
          className="flex items-center gap-3"
          style={{ transformStyle: "preserve-3d" }}>
          <div className="w-11 h-11 rounded-xl flex items-center justify-center flex-shrink-0"
            style={{ background: `${glowRgb}1f`, border: `1px solid ${glowRgb}4d` }}>
            {icon}
          </div>
          <div>
            <div className="text-2xl font-extrabold tracking-tight c-text" style={{ textShadow: `0 0 12px ${glowRgb}33` }}>{label} Dashboard</div>
            <p className="c-muted text-sm mt-0.5">
              {connectedModels.length} account{connectedModels.length !== 1 ? "s" : ""} connected via Publer
            </p>
          </div>
        </div>
        <button onClick={onPlanPosts}
          className="flex items-center gap-2 px-4 py-2.5 rounded-xl fs-12 font-mono uppercase tracking-wide font-semibold tap"
          style={{ background: glowRgb, color: "#050705", boxShadow: `0 0 14px ${glowRgb}40` }}>
          <Megaphone size={14} /> {planLabel}
        </button>
      </div>

      {connectedModels.length === 0 ? (
        <div className="fs-12 c-faint font-mono italic py-10 text-center rounded-xl" style={{ border: "1px dashed rgba(255,255,255,0.12)" }}>
          {noAccountsHint || "No accounts connected yet — connect one in Publer, then sync will pick it up automatically."}
        </div>
      ) : (
        <>
          <div className="flex items-center justify-between gap-3 flex-wrap mb-5">
            <div className="flex flex-wrap gap-1.5">
              <button onClick={() => setAccount("all")}
                className="fs-11 font-mono uppercase px-3 py-1.5 rounded-full tap"
                style={account === "all"
                  ? { background: `${glowRgb}22`, color: glowRgb, border: `1px solid ${glowRgb}66` }
                  : { background: "transparent", color: "#9d9b95", border: "1px solid rgba(255,255,255,0.1)" }}>
                All accounts
              </button>
              {connectedModels.map((m) => (
                <button key={m.name} onClick={() => setAccount(m.name)}
                  className="fs-11 font-mono uppercase px-3 py-1.5 rounded-full tap"
                  style={account === m.name
                    ? { background: `${glowRgb}22`, color: glowRgb, border: `1px solid ${glowRgb}66` }
                    : { background: "transparent", color: "#9d9b95", border: "1px solid rgba(255,255,255,0.1)" }}>
                  {m.name}
                </button>
              ))}
            </div>
            <div className="flex rounded-full p-0.5" style={{ background: "rgba(255,255,255,0.05)", border: "1px solid rgba(255,255,255,0.08)" }}>
              {[7, 30].map((d) => (
                <button key={d} onClick={() => setRange(d)}
                  className="fs-11 font-mono uppercase px-3 py-1.5 rounded-full tap"
                  style={range === d ? { background: glowRgb, color: "#050705" } : { background: "transparent", color: "#9d9b95" }}>
                  {d}D
                </button>
              ))}
            </div>
          </div>

          <div className="flex flex-wrap gap-2.5 mb-5">
            <XNeonStatTile label={`${metricLabel} · ${range}d`} value={weekTotals.reach.toLocaleString()} color="blue" icon={<Eye size={11} style={{ color: XNEON.blue.fg }} />} />
            <XNeonStatTile label={`Posts · ${range}d`} value={weekTotals.posts} color="green" icon={<Sparkles size={11} style={{ color: XNEON.green.fg }} />} />
            <XNeonStatTile label={`Likes · ${range}d`} value={weekTotals.likes.toLocaleString()} color="pink" icon={<Heart size={11} style={{ color: XNEON.pink.fg }} />} />
            <XNeonStatTile label="Avg engagement" value={avgEr != null ? `${avgEr.toFixed(1)}%` : "—"} color="amber" icon={<Flame size={11} style={{ color: XNEON.amber.fg }} />} />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-5 gap-3 mb-5">
            <div className="lg:col-span-3 c-bg-app rounded-xl p-4" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
              <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">{metricLabel} · last 30 days</div>
              <AreaTrendChart data={trend30} color={glowRgb} />
            </div>
            <div className="lg:col-span-2 c-bg-app rounded-xl p-4 flex flex-col justify-center" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
              <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">Engagement mix · {range}d</div>
              <EngagementDonut segments={donutSegments} centerLabel="total" />
            </div>
          </div>

          <div className="c-bg-app rounded-xl p-4 mb-5" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
            <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">Share of {metricLabel.toLowerCase()} · {range}d</div>
            <div className="flex flex-wrap gap-4">
              {connectedModels.map((m) => {
                const color = accountColor(m.name);
                const mReach = weekRows.filter((r) => r.model === m.name).reduce((s, r) => s + (r.impressions || 0), 0);
                return (
                  <AccountShareRing key={m.name} name={m.name} color={color} value={m.name}
                    shareOfTotal={weekTotals.reach > 0 ? mReach / weekTotals.reach : 0}
                    sublabel={`${mReach.toLocaleString()} ${metricLabel.toLowerCase()}`} />
                );
              })}
            </div>
          </div>

          {scheduledPosts != null && (
            <div className="c-bg-app rounded-xl p-4 mb-5" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
              <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">
                Scheduled · upcoming ({scheduledPosts.length})
              </div>
              <ScheduledPostsCalendar posts={scheduledPosts} accountColor={accountColor} glowRgb={glowRgb} />
            </div>
          )}

          {topPosts.length > 0 && (
            <div className="c-bg-app rounded-xl p-4 mb-5" style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
              <div className="fs-10 uppercase tracking-widest c-faint font-mono mb-3">
                {livePosts?.length ? `Top posts · last ${range} days (${topPosts.length})` : "Top posts · rolling 7 days"}
              </div>
              <div className="flex flex-col gap-1.5">
                {topPosts.map((p, i) => {
                  const color = accountColor(p.model);
                  return (
                    <a key={p.externalLink || `${p.model}-${i}`} href={p.externalLink || undefined} target="_blank" rel="noreferrer"
                      className="flex items-center gap-3 rounded-lg p-2 hover-border-accent transition-colors"
                      style={{ border: "1px solid rgba(255,255,255,0.06)" }}>
                      {p.thumbnailUrl ? (
                        <img src={p.thumbnailUrl} alt="" className="flex-shrink-0 rounded-lg object-cover" style={{ width: 48, height: 48 }} />
                      ) : (
                        <div className="flex-shrink-0 rounded-lg c-bg-surface" style={{ width: 48, height: 48 }} />
                      )}
                      <span className="fs-10 font-bold px-1.5 py-0.5 rounded flex-shrink-0" style={{ background: color + "26", color }}>{p.model}</span>
                      <div className="flex-1 min-w-0 fs-11 c-text truncate">{p.text || <span className="c-faint italic">No text</span>}</div>
                      <div className="flex-shrink-0 fs-11 font-mono c-text font-semibold text-right" style={{ width: 70 }}>{(p.impressions || 0).toLocaleString()}<span className="c-faint fs-9 block">{metricLabel.toLowerCase()}</span></div>
                    </a>
                  );
                })}
              </div>
            </div>
          )}

          {extraSection}
        </>
      )}

      {persistCompetitors && <XCompetitorSettings competitors={competitors} persistCompetitors={persistCompetitors} />}
    </div>
  );
}

// A tiny decorative sine-ish squiggle — purely ornamental (no axis, no
// legend needed), matching the reference dashboard's wavy line-under-hero
// motif. Derived loosely from real values so it's not pure noise, but it's
// not meant to be read precisely — the real numbers live in the tiles.
function IGStar({ size = 14, color = "#fff" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
      <path d="M12 2l2.6 6.6L22 10l-5.5 4.6L18 22l-6-3.6L6 22l1.5-7.4L2 10l7.4-1.4L12 2z" />
    </svg>

// ISO-3166 alpha-2 -> flag emoji via regional indicator symbols — no lookup
// table needed, the Unicode code points are just A-Z offset into that block.
function flagEmoji(countryCode) {
  if (!countryCode || countryCode.length !== 2) return "🏳️";
  return String.fromCodePoint(...[...countryCode.toUpperCase()].map((c) => 0x1f1e6 + c.charCodeAt(0) - 65));
}

// Overlapping bubble cluster, laid out 1:1 off the reference — four fixed
// slots (big/top/tiny/bottom-right) that the biggest-to-smallest share
// always maps onto in that order, so it holds its shape regardless of which
// age bucket happens to be biggest. Falls back to four zeroed placeholder
// buckets when Publer hasn't collected anything yet, rather than an empty
// card — the shape stays visible, it just reads 0% everywhere.
const AGE_BUBBLE_SLOTS = [
  { left: "2%", bottom: "4%", sizePct: 0.60 },  // biggest
  { left: "58%", bottom: "0%", sizePct: 0.42 }, // 2nd — bottom-right, overlaps the big one
  { left: "46%", top: "0%", sizePct: 0.30 },    // 3rd — top
  { left: "80%", top: "24%", sizePct: 0.15 },   // smallest — tiny, top-right
];
const DEFAULT_AGES = [
  { label: "18-24 years", pct: 0 }, { label: "25-34 years", pct: 0 },
  { label: "35-44 years", pct: 0 }, { label: "45+ years", pct: 0 },
];
// Each bubble drifts on its own slow loop (different duration/delay/direction
// per slot) so the cluster reads as gently floating rather than static —
// small enough (a few px) that the overlap/labels stay legible throughout.
const BUBBLE_FLOAT_ANIM = [
  { duration: "9s", delay: "0s", name: "bubbleFloatA" },
  { duration: "11s", delay: "-3s", name: "bubbleFloatB" },
  { duration: "8s", delay: "-1s", name: "bubbleFloatC" },
  { duration: "10s", delay: "-5s", name: "bubbleFloatA" },
];
function AgeRangeBubbles({ ages, colors }) {
  const data = (ages && ages.length ? ages : DEFAULT_AGES).slice(0, 4);
  const containerPx = 260;
  return (
    <div className="relative mx-auto" style={{ width: containerPx, height: containerPx * 0.72 }}>
      {data.map((a, i) => {
        const slot = AGE_BUBBLE_SLOTS[i];
        const size = Math.round(containerPx * slot.sizePct);
        const color = colors[i % colors.length];
        const anim = BUBBLE_FLOAT_ANIM[i % BUBBLE_FLOAT_ANIM.length];
        return (
          <div key={a.label} title={a.label}
            className="absolute rounded-full flex flex-col items-center justify-center"
            style={{
              width: size, height: size, left: slot.left, top: slot.top, bottom: slot.bottom,
              background: `${color}29`, border: `1.5px solid ${color}77`,
              boxShadow: `0 0 24px ${color}40`, zIndex: 4 - i,
              animation: `${anim.name} ${anim.duration} ease-in-out ${anim.delay} infinite`,
            }}>
            <span className="font-extrabold leading-none" style={{ color, fontSize: Math.max(12, size * 0.22) }}>{a.pct}%</span>
            {size >= 60 && <span className="fs-9 font-mono c-faint mt-1 text-center px-1" style={{ lineHeight: 1.1 }}>{a.label}</span>}
          </div>
        );
      })}
    </div>
  );
}

const DEFAULT_COUNTRIES = [{ code: "US", value: 0 }, { code: "DE", value: 0 }, { code: "GB", value: 0 }, { code: "ES", value: 0 }];

// Dot-fill world silhouette — the real country outlines (flekschas/simple-world-map,
// CC BY-SA), filled with a repeating dot pattern instead of a solid color so

function WorldDotMap({ color = "#a78bfa" }) {
